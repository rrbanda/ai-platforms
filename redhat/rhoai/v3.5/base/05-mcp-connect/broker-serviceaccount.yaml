apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-gateway-broker
  namespace: ocp-mcp-server
---
# Long-lived token for the broker SA -- referenced by MCPServerRegistration credentialRef
apiVersion: v1
kind: Secret
metadata:
  name: mcp-broker-credential
  namespace: ocp-mcp-server
  labels:
    mcp.kuadrant.io/secret: "true"
  annotations:
    kubernetes.io/service-account.name: mcp-gateway-broker
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-gateway-broker-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: mcp-gateway-broker
    namespace: ocp-mcp-server
