apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: gemma4-agentic-free
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Gemma 4 Agentic Free Tier"
    openshift.io/description: "Free tier: 1000 tokens/min for all authenticated users"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: gemma4-12b-agentic
      namespace: gemma4-agentic
      tokenRateLimits:
        - limit: 1000
          window: 1m
  priority: 10
