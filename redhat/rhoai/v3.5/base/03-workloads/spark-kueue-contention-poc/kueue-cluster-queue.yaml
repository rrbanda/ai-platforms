# ClusterQueue: contention-cq
#
# DELIBERATELY CONSTRAINED to 4 CPU / 8Gi memory.
# This is NOT a production configuration — it exists to reproduce the
# resource-contention scenario described in the POC.
#
# A SparkApplication requesting 10 CPU (driver 2 + 4 executors × 2) will
# exceed this quota, forcing Kueue to hold the job in Suspended state
# until quota becomes available.
#
# NOTE: This ClusterQueue handles quota-level all-or-nothing (Kueue only
# unsuspends when quota for ALL pod sets can be reserved at once).
# For full gang scheduling (evict + retry if pods don't become Ready),
# you must ALSO configure gangScheduling in the Kueue CR — see README.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: contention-cq
spec:
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: ["cpu", "memory"]
    flavors:
    - name: default-flavor
      resources:
      - name: "cpu"
        nominalQuota: 4
      - name: "memory"
        nominalQuota: 8Gi
