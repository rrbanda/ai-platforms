# TC-6b: Retry Behavior WITHOUT Kueue — Under Resource Contention
#
# Purpose: Show the pod creation/teardown churn WITHOUT admission control.
# Same resource request as tc6a (9 CPU: 1 CPU driver + 4×2 CPU executors)
# but NO Kueue label. The Spark Operator creates Driver + Executor pods
# immediately. When executors can't all schedule and the job eventually
# fails/times out, restartPolicy OnFailure triggers retries — each retry
# creates a new batch of pods that also can't fully schedule.
#
# Tested: 2026-10-15 on RHOAI 3.5.1 / Spark Operator 2.4.0 / Kueue 1.4.3
# Without Kueue: driver ran, executors attempted scheduling, job entered
# PENDING_RERUN on failure, retrying and creating new pods in a loop.
# Events showed repeated pod creation/deletion cycles.
#
# Expected behavior:
#   - Driver pod runs; some executor pods stay Pending
#   - Job eventually fails or hangs
#   - On failure, Spark Operator retries (up to 3 times)
#   - Each retry: new pods created → same partial scheduling → fail again
#   - oc get events shows repeated pod creation/deletion events
#
# Compare with tc6-retry-with-kueue.yaml (zero pod churn).
#
# NOTE: No kueue.x-k8s.io/queue-name label — Kueue does not manage this job.
#
# Verification:
#   oc apply -f tc6-retry-without-kueue.yaml
#   oc get sparkapplication tc6-retry-no-kueue -w
#   oc get events --field-selector involvedObject.name=tc6-retry-no-kueue -w
#   # Observe: repeated pod creation/deletion events
#   oc delete sparkapplication tc6-retry-no-kueue
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: tc6-retry-no-kueue
  labels:
    app: spark-contention-poc
    poc/test-case: tc6-retry-comparison
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  sparkVersion: "4.0.1"
  image: quay.io/opendatahub/data-processing:Spark-v4.0.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py
  sparkConf:
    spark.executor.instances: "4"
  driver:
    cores: 1
    coreRequest: "1"
    memory: 512m
    serviceAccount: spark-operator-spark
    securityContext: {}
  executor:
    instances: 4
    cores: 2
    coreRequest: "2"
    memory: 512m
    securityContext: {}
  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 3
    onSubmissionFailureRetryInterval: 10
