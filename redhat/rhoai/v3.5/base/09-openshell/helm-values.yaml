# OpenShell Helm values -- OpenShift base defaults.
# Per NVIDIA docs, disableTls lets the OpenShift Route handle TLS (edge),
# making the chart portable across clusters with no per-cluster TLS config.
openshiftRoute:
  enabled: true

podSecurityContext:
  fsGroup: null

securityContext:
  runAsUser: null

server:
  disableTls: true
  auth:
    allowUnauthenticatedUsers: true
