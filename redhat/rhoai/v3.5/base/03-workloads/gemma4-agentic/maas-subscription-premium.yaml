apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: gemma4-agentic-premium
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Gemma 4 Agentic Premium Tier"
    openshift.io/description: "Premium tier: 100000 tokens/min for all authenticated users"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: gemma4-12b-agentic
      namespace: gemma4-agentic
      tokenRateLimits:
        - limit: 100000
          window: 1m
  priority: 40
