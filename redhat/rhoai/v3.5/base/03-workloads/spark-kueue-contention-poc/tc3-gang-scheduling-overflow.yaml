# TC-3 Overflow: Second job that CANNOT fit while tc3-gang-scheduling is running.
#
# Apply AFTER tc3-gang-scheduling is admitted.
# This job also requests 4 CPU (driver 1 + 3 executors × 1) but quota is now full.
# Kueue holds this job Suspended — it does NOT partially admit the driver alone.
#
# Expected behavior:
#   - SparkApplication stays Suspended
#   - Zero pods created
#   - Workload object shows ADMITTED=False
#   - Once tc3-gang-scheduling completes and quota is released, this job is admitted
#
# Verification:
#   oc get sparkapplication tc3-gang-overflow -w
#   oc get workload
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: tc3-gang-overflow
  labels:
    app: spark-contention-poc
    poc/test-case: tc3-gang-overflow
    kueue.x-k8s.io/queue-name: contention-lq
spec:
  type: Scala
  mode: cluster
  image: quay.io/opendatahub/data-processing:Spark-v4.0.1
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples.jar
  arguments: ["10000"]
  sparkVersion: "4.0.1"
  timeToLiveSeconds: 300
  restartPolicy:
    type: Never
  driver:
    cores: 1
    memory: "512m"
    serviceAccount: spark-operator-spark
    securityContext: {}
  executor:
    cores: 1
    instances: 3
    memory: "512m"
    securityContext: {}
