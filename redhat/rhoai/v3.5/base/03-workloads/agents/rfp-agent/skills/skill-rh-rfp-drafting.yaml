    **Date:** [Submission date]
    **RFP Reference:** [Customer's reference number]
    **Prepared for:** [Customer organization]

    ---

    ## 1. Executive Summary
    [AUTO-GENERATED from scope + capabilities]

    ### Understanding of Requirements
    [Restate customer's need in their language. Reference specific scope items.]

    ### Our Approach
    [3-4 sentences: engagement model, operating model, key differentiators]

    ### Key Differentiators
    - [Specific to THIS RFP]
    - [Specific to THIS RFP]
    - [Specific to THIS RFP]

    ---

    ## 2. Technical Approach

    ### 2.1 Engagement Model
    [Phases, workstreams, governance. Map to customer's deliverables.]

    ### 2.2 Methodology

    | Phase | Activities | Deliverables | Duration |
    |-------|-----------|--------------|----------|
    | Mobilization | [activities] | D1, D2 | [weeks] |
