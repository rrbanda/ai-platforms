# RHOAI 3.5 -- Inference-only (RHAII profile)
skipCrdCheck: true
profile: rhaii
components:
  kserve:
    gateway:
      create: true
      name: openshift-ai-inference
      namespace: openshift-ingress
      labels:
        istio.io/rev: openshift-gateway
      spec:
        gatewayClassName: openshift-ai-inference
        listeners:
          - name: https
            port: 443
            protocol: HTTPS
            allowedRoutes:
              namespaces:
                from: All
