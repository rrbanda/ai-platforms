apiVersion: v1
kind: ConfigMap
metadata:
  name: evalhub-collection-rfp-agent
  namespace: evalhub
  labels:
    trustyai.opendatahub.io/evalhub-collection-type: collection
    trustyai.opendatahub.io/evalhub-collection-name: rfp-agent-rag-eval-v1
data:
  collection.yaml: |
    id: rfp-agent-rag-eval-v1
    name: RFP Agent RAG Evaluation v1
    category: rag
    description: >-
      Evaluation collection for the Red Hat RFP Agent RAG pipeline.
      Measures faithfulness, answer relevancy, context precision, and
      context recall against benchmark questions.
    tags:
      - rfp-agent
      - rag
      - production
    benchmarks:
      - id: ragas_rag_default
        provider_id: ragas
        weight: 1.0
        primary_score:
          metric: faithfulness
          lower_is_better: false
        pass_criteria:
          threshold: 0.7
        parameters:
          llm_model: "gemini-2.5-flash"
          llm_base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
          embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
          embedding_base_url: "http://rfp-ogx-service.rfp-agent.svc.cluster.local:8321/v1"
    pass_criteria:
      threshold: 0.6
