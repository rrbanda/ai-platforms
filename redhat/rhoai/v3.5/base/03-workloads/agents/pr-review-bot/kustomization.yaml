apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pr-review-bot

resources:
  - sandbox.yaml
  - startup.yaml
  - service.yaml
  - route.yaml
  - soul.yaml
  - config.yaml
  - restart-hook.yaml
  - restart-rbac.yaml
  - skills/skill-release-yaml-generator.yaml
  - skills/skill-pr-review-bot.yaml
  - skills/skill-post-deploy-validator.yaml
  - skills/skill-gitops-merge-manager.yaml
  - skills/skill-release-handover-report.yaml

configMapGenerator:
  - name: pr-review-bot-openshell-policy
    files:
      - sandbox-policy.rego
      - policy.yaml

generatorOptions:
  disableNameSuffixHash: true
