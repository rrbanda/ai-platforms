# TC-2: Kueue Admission Blocking
#
# Purpose: Demonstrate Kueue prevents the "half-admitted" state.
# Same resource request as TC-1 (33 CPU: 1 CPU driver + 4×8 CPU executors)
# but WITH the Kueue queue label. Kueue calculates the total resource demand
# and compares against ClusterQueue quota (25 CPU). Since 33 > 25, the job
# stays Suspended — zero pods are created.
#
# Tested: 2026-10-15 on RHOAI 3.5.1 / Spark Operator 2.4.0 / Kueue 1.4.3
# Job stayed Suspended with zero pods. Kueue Workload showed:
#   "Inadmissible by ClusterQueue spark-cq: insufficient unused quota for
#    cpu in flavor default-flavor, 8 more needed"
#
# Expected behavior:
#   - SparkApplication stays in Suspended state
#   - Zero Driver/Executor pods are created
#   - Kueue creates a Workload object with ADMITTED=False
#   - No resource waste — nothing is scheduled until quota is available
#
# Verification:
#   oc apply -f tc2-kueue-admission-blocking.yaml
#   oc get sparkapplication tc2-kueue-admission-block -w
#   oc get workload -l kueue.x-k8s.io/queue-name=spark-lq
#   oc get pods -l sparkoperator.k8s.io/app-name=tc2-kueue-admission-block
#   oc delete sparkapplication tc2-kueue-admission-block
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: tc2-kueue-admission-block
  labels:
    app: spark-contention-poc
    poc/test-case: tc2-admission-blocking
    kueue.x-k8s.io/queue-name: spark-lq
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  sparkVersion: "4.0.1"
  image: quay.io/opendatahub/data-processing:Spark-v4.0.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py
  sparkConf:
    spark.executor.instances: "4"
  driver:
    cores: 1
    coreRequest: "1"
    memory: 512m
    serviceAccount: spark-operator-spark
    securityContext: {}
  executor:
    instances: 4
    cores: 8
    coreRequest: "8"
    memory: 1g
    securityContext: {}
  restartPolicy:
    type: Never
