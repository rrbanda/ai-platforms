name: Lint and Validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'redhat/rhoai/v3.5/base/10-agenthive/**'
      - 'redhat/rhoai/v3.5/base/03-workloads/agents/**'
      - 'redhat/rhoai/v3.5/base/10-agenthive/image/**'
      - 'redhat/rhoai/v3.5/base/10-agenthive/evalhub/**'
      - '.github/workflows/ci-lint.yaml'
  push:
    branches: [main]
    paths:
      - 'redhat/rhoai/v3.5/base/10-agenthive/**'
      - 'redhat/rhoai/v3.5/base/03-workloads/agents/**'
      - 'redhat/rhoai/v3.5/base/10-agenthive/image/**'
      - 'redhat/rhoai/v3.5/base/10-agenthive/evalhub/**'
      - '.github/workflows/ci-lint.yaml'

permissions:
  contents: read

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install --quiet yamllint

      - name: Lint platform YAML
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 200}}}' \
            redhat/rhoai/v3.5/base/10-agenthive/bootstrap/*.yaml \
            redhat/rhoai/v3.5/base/10-agenthive/apps/*.yaml \
            redhat/rhoai/v3.5/base/10-agenthive/infra/**/*.yaml \
            redhat/rhoai/v3.5/base/10-agenthive/evalhub/*.yaml \
            redhat/rhoai/v3.5/base/10-agenthive/open-webui/*.yaml \
            redhat/rhoai/v3.5/base/03-workloads/agents/rfp-agent/*.yaml \
            redhat/rhoai/v3.5/base/03-workloads/agents/rfp-agent/skills/*.yaml \
            redhat/rhoai/v3.5/base/03-workloads/agents/rfp-agent/eval/*.yaml \
            redhat/rhoai/v3.5/base/03-workloads/agents/rhoai-copilot/*.yaml \
            redhat/rhoai/v3.5/base/03-workloads/agents/rhoai-copilot/skills/*.yaml \
            redhat/rhoai/v3.5/base/03-workloads/agents/pod-health-watcher/*.yaml \
            redhat/rhoai/v3.5/base/03-workloads/agents/pod-health-watcher/skills/*.yaml \
            redhat/rhoai/v3.5/base/03-workloads/agents/stale-image-finder/*.yaml \
            redhat/rhoai/v3.5/base/03-workloads/agents/stale-image-finder/skills/*.yaml \
            redhat/rhoai/v3.5/base/03-workloads/agents/pr-review-bot/*.yaml \
            redhat/rhoai/v3.5/base/03-workloads/agents/pr-review-bot/skills/*.yaml

  kustomize-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | \
            tar xz -C /usr/local/bin

      - name: Validate agent rfp-agent
        run: kustomize build redhat/rhoai/v3.5/base/03-workloads/agents/rfp-agent > /dev/null

      - name: Validate agent rfp-agent eval
        run: kustomize build redhat/rhoai/v3.5/base/03-workloads/agents/rfp-agent/eval > /dev/null

      - name: Validate agent rhoai-copilot
        run: kustomize build redhat/rhoai/v3.5/base/03-workloads/agents/rhoai-copilot > /dev/null

      - name: Validate agent pod-health-watcher
        run: kustomize build redhat/rhoai/v3.5/base/03-workloads/agents/pod-health-watcher > /dev/null

      - name: Validate agent stale-image-finder
        run: kustomize build redhat/rhoai/v3.5/base/03-workloads/agents/stale-image-finder > /dev/null

      - name: Validate agent pr-review-bot
        run: kustomize build redhat/rhoai/v3.5/base/03-workloads/agents/pr-review-bot > /dev/null

      - name: Validate gitops infra
        run: kustomize build redhat/rhoai/v3.5/base/10-agenthive/infra > /dev/null

      - name: Validate gitops apps
        run: kustomize build redhat/rhoai/v3.5/base/10-agenthive/apps > /dev/null

      - name: Validate gitops evalhub
        run: kustomize build redhat/rhoai/v3.5/base/10-agenthive/evalhub > /dev/null

      - name: Validate gitops open-webui
        run: kustomize build redhat/rhoai/v3.5/base/10-agenthive/open-webui > /dev/null

      - name: Validate gitops bootstrap
        run: kustomize build redhat/rhoai/v3.5/base/10-agenthive/bootstrap > /dev/null

      - name: Validate OpenShift MCP
        run: kustomize build redhat/rhoai/v3.5/base/10-agenthive/mcp-servers/openshift > /dev/null

      - name: Validate RHOAI MCP
        run: kustomize build redhat/rhoai/v3.5/base/10-agenthive/mcp-servers/rhoai > /dev/null

      - name: Validate sandbox template
        run: kustomize build redhat/rhoai/v3.5/base/10-agenthive/sandbox-template > /dev/null

  skill-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check skill-sources match runtime lists
        run: python3 redhat/rhoai/v3.5/base/10-agenthive/scripts/check-skill-parity.py


  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Containerfile.runtime
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: redhat/rhoai/v3.5/base/10-agenthive/image/Containerfile.runtime
          failure-threshold: error

      - name: Lint Containerfile.agent
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: redhat/rhoai/v3.5/base/10-agenthive/image/Containerfile.agent
          failure-threshold: error
