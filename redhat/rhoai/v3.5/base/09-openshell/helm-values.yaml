# OpenShell Helm values -- OpenShift base defaults.
# TLS is disabled on the server; an edge-terminated Route (created in prereqs)
# handles external TLS, making the chart portable with no per-cluster TLS SANs.
openshiftRoute:
  enabled: false

podSecurityContext:
  fsGroup: null

securityContext:
  runAsUser: null

server:
  disableTls: true
  auth:
    allowUnauthenticatedUsers: true
