# TC-3: Gang Scheduling (All-or-Nothing Admission)
#
# Purpose: Prove Kueue does NOT partially admit a SparkApplication.
# Same resource request as TC-1/TC-2 (33 CPU: 1 CPU driver + 4×8 CPU executors).
# With ClusterQueue quota at 25 CPU, Kueue cannot reserve ALL pod sets
# (driver + all executors) atomically — so it admits NONE.
#
# The key validation vs TC-1: without Kueue, the driver runs alone while
# executors stay Pending (half-admitted). With Kueue, NOTHING runs.
#
# Tested: 2026-10-15 on RHOAI 3.5.1 / Spark Operator 2.4.0 / Kueue 1.4.3
# Job stayed Suspended with zero pods. Kueue Workload message:
#   "Inadmissible by ClusterQueue spark-cq: insufficient unused quota for
#    cpu in flavor default-flavor, 8 more needed"
# Proves gang scheduling: Kueue won't admit driver (1 CPU) alone even
# though 25 CPU is available — it requires the full 33 CPU.
#
# Expected behavior:
#   - SparkApplication stays in Suspended state
#   - Kueue will NOT schedule the driver alone while executors wait
#   - Zero pods created — no partial scheduling, no resource waste
#
# Verification:
#   oc apply -f tc3-gang-scheduling.yaml
#   oc get sparkapplication tc3-gang-scheduling -w
#   oc get pods -l sparkoperator.k8s.io/app-name=tc3-gang-scheduling
#   oc delete sparkapplication tc3-gang-scheduling
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: tc3-gang-scheduling
  labels:
    app: spark-contention-poc
    poc/test-case: tc3-gang-scheduling
    kueue.x-k8s.io/queue-name: spark-lq
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  sparkVersion: "4.0.1"
  image: quay.io/opendatahub/data-processing:Spark-v4.0.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py
  sparkConf:
    spark.executor.instances: "4"
  driver:
    cores: 1
    coreRequest: "1"
    memory: 512m
    serviceAccount: spark-operator-spark
    securityContext: {}
  executor:
    instances: 4
    cores: 8
    coreRequest: "8"
    memory: 1g
    securityContext: {}
  restartPolicy:
    type: Never
