apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../gitops-operator-subscription.yaml
  - ../../sealed-secrets-subscription.yaml
  - ../../argocd-rbac.yaml
patches:
  - target:
      kind: Subscription
      name: openshift-gitops-operator
    patch: |
      - op: replace
        path: /spec/source
        value: REPLACE_WITH_REDHAT_CATALOG_NAME
  - target:
      kind: Subscription
      name: sealed-secrets-operator-helm
    patch: |
      - op: replace
        path: /spec/source
        value: REPLACE_WITH_CERTIFIED_CATALOG_NAME
