apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pod-health-watcher

resources:
  - sandbox.yaml
  - startup.yaml
  - service.yaml
  - route.yaml
  - soul.yaml
  - config.yaml
  - restart-hook.yaml
  - restart-rbac.yaml
  - skills/skill-pod-health-watcher.yaml
  - skills/skill-pod-failure-diagnoser.yaml
  - skills/skill-pod-auto-remediate.yaml
  - skills/skill-incident-escalator.yaml

configMapGenerator:
  - name: pod-health-watcher-openshell-policy
    files:
      - sandbox-policy.rego
      - policy.yaml

generatorOptions:
  disableNameSuffixHash: true
