# OpenShell Helm values -- OpenShift base defaults.
# mTLS is the default; access via port-forward or ingress.
# Ref: OpenShell on OpenShift quick reference.
podSecurityContext:
  fsGroup: null

securityContext:
  runAsUser: null

server:
  auth:
    allowUnauthenticatedUsers: true
  # Operator mode: each workspace maps 1:1 to a pre-existing namespace.
  # Requires chart v0.0.116+ for full workspace auto-creation from namespaces.
  drivers:
    kubernetes:
      workspaceMode: operator
      operatorNamespaceLabel: "openshell.dev/managed-by=gateway"
