apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-restart
  namespace: rhoai-copilot
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: openshell-sandbox
      containers:
      - name: restart
        image: registry.redhat.io/openshift4/ose-cli:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          # GitOps rollout: never patch the Sandbox CR (ArgoCD owns spec).
          # Delete the controller-managed pod so it is recreated with the
          # ConfigMaps from this sync (startup, soul, skills, config).
          echo "PostSync: rolling sandbox pod to load synced ConfigMaps"
          if oc get pod rhoai-copilot -n rhoai-copilot >/dev/null 2>&1; then
            oc delete pod rhoai-copilot -n rhoai-copilot --wait=false
            echo "Pod delete issued; Sandbox controller will recreate it."
          else
            echo "No pod present yet; Sandbox controller will create it."
          fi
