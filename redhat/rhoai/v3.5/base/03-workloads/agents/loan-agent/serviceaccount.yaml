apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshell-sandbox
  namespace: loan-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: loan-agent-openshell-sandbox-privileged
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
- kind: ServiceAccount
  name: openshell-sandbox
  namespace: loan-agent
