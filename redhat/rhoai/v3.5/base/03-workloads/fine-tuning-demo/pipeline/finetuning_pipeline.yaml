              \   def log_message(msg: str):\n        \"\"\"Log message to console\
              \ and shared log file.\"\"\"\n        print(msg)\n        log_path =\
              \ os.path.join(pvc_mount_path, shared_log_file)\n        with open(log_path,\
              \ \"a\") as f:\n            f.write(msg + \"\\n\")\n\n    def parse_uri(uri:\
              \ str) -> tuple[str, str]:\n        \"\"\"Parse dataset URI to determine\
              \ source type and path.\n\n        Args:\n            uri: Dataset URI\
              \ with scheme. Supported formats:\n                - HuggingFace: hf://dataset-name\
              \ or dataset-name\n                - S3/MinIO: s3://bucket/path/to/file.jsonl\n\
              \                - HTTP/HTTPS: http://... or https://... (e.g., MinIO\
              \ shared links)\n                - Local/PVC: pvc://path/to/file.jsonl\
              \ or /absolute/path/to/file.jsonl\n\n        Returns:\n            Tuple\
              \ of (source_type, path) where source_type is 'hf', 's3', 'http', or\
              \ 'local'\n        \"\"\"\n        uri = uri.strip()\n\n        # Check\
              \ for explicit schemes\n        if uri.startswith(\"http://\") or uri.startswith(\"\
              https://\"):\n            return (\"http\", uri)\n        elif uri.startswith(\"\
              hf://\"):\n            return (\"hf\", uri[5:])\n        elif uri.startswith(\"\
              s3://\"):\n            return (\"s3\", uri[5:])\n        elif uri.startswith(\"\
              pvc://\"):\n            return (\"local\", uri[6:])\n        elif uri.startswith(\"\
              /\"):\n            return (\"local\", uri)\n        else:\n        \
              \    # Default to HuggingFace if no scheme\n            return (\"hf\"\
              , uri)\n\n    def validate_chat_format_dataset(dataset: Dataset) ->\
              \ bool:\n        \"\"\"Validate that dataset follows chat template format.\n\
              \n        Expected format:\n        - Each entry should have 'messages'\
              \ or 'conversations' field\n        - Messages should be a list of dicts\
              \ with 'role' and 'content'\n        - Roles should be from: 'system',\
              \ 'user', 'assistant', 'function', 'tool'\n        \"\"\"\n        if\
              \ len(dataset) == 0:\n            raise ValueError(\"Dataset is empty\"\
              )\n\n        valid_roles = {\"system\", \"user\", \"assistant\", \"\
              function\", \"tool\"}\n\n        # Check first 100 examples (or fewer\
              \ if dataset is smaller)\n        num_to_check = min(100, len(dataset))\n\
              \n        for i in range(num_to_check):\n            item = dataset[i]\n\
              \n            # Check for common chat format fields\n            if\
              \ \"messages\" in item:\n                messages = item[\"messages\"\
              ]\n            elif \"conversations\" in item:\n                messages\
              \ = item[\"conversations\"]\n            else:\n                raise\
              \ ValueError(\n                    f\"Item {i} missing 'messages' or\
              \ 'conversations' field. Found keys: {list(item.keys())}\"\n       \
              \         )\n\n            if not isinstance(messages, list):\n    \
              \            raise ValueError(f\"Item {i}: messages must be a list\"\
              )\n\n            for j, msg in enumerate(messages):\n              \
              \  if not isinstance(msg, dict):\n                    raise ValueError(f\"\
              Item {i}, message {j}: must be a dict\")\n\n                if \"role\"\
              \ not in msg or \"content\" not in msg:\n                    raise ValueError(f\"\
