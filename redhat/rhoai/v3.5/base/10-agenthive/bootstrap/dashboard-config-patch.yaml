# Patch for the RHOAI dashboard config to enable Gen AI Studio and AutoRAG.
apiVersion: opendatahub.io/v1alpha
kind: OdhDashboardConfig
metadata:
  name: odh-dashboard-config
  namespace: redhat-ods-applications
spec:
  dashboardConfig:
    genAiStudio: true
    autorag: true
    disableLMEval: false
