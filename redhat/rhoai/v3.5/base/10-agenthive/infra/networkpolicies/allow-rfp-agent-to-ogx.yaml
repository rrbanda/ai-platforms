apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rfp-agent-to-ogx
  namespace: rfp-agent
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector:
    matchLabels:
      app: ogx
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8321
