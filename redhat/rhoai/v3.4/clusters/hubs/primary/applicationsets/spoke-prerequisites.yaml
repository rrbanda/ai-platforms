apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-prerequisites
  namespace: openshift-gitops
spec:
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: all-rhoai-spokes
        requeueAfterSeconds: 180
  template:
    metadata:
      name: '{{name}}-servicemesh'
      annotations:
        apps.open-cluster-management.io/ocm-managed-cluster: '{{name}}'
        argocd.argoproj.io/skip-reconcile: "true"
        argocd.argoproj.io/sync-wave: "0"
      labels:
        apps.open-cluster-management.io/pull-to-ocm-managed-cluster: "true"
    spec:
      project: rhoai-platform
      source:
        repoURL: https://github.com/rrbanda/ai-platforms.git
        targetRevision: main
        path: redhat/rhoai/v3.4/base/00-operators/servicemesh
      destination:
        server: https://kubernetes.default.svc
        namespace: openshift-operators
      syncPolicy:
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
