    \ n_gpu, mem, n_cpu):\\n        storage_uri\\\n          \\ = f\\\"pvc://{pvc_name}/{model_relative_path}\\\"\\n\\n        isvc = {\\n  \\\n          \\          \\\"apiVersion\\\": \\\"serving.kserve.io/v1beta1\\\",\\n            \\\"\\\n          kind\\\": \\\"InferenceService\\\",\\n            \\\"metadata\\\": {\\n           \\\n          \\     \\\"name\\\": name,\\n                \\\"namespace\\\": namespace,\\n     \\\n          \\           \\\"annotations\\\": {\\n                    \\\"serving.kserve.io/deploymentMode\\\"\\\n          : \\\"Standard\\\",\\n                    \\\"security.opendatahub.io/enable-auth\\\"\\\n          : \\\"false\\\",\\n                    \\\"openshift.io/display-name\\\": f\\\"EvalHub\\\n          \\ Model {name}\\\",\\n                },\\n                \\\"labels\\\": {\\n \\\n          \\                   \\\"opendatahub.io/dashboard\\\": \\\"true\\\",\\n          \\\n          \\      },\\n            },\\n            \\\"spec\\\"\
