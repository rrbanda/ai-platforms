apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-ocp-agent
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ocp-virt-migration-agent
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: rhoai-workloads
  sources:
    - repoURL: https://github.com/rrbanda/ai-platforms.git
      targetRevision: main
      path: redhat/rhoai/v3.5/base/03-workloads/agents/ocp-virt-agent/chart
      helm:
        valueFiles:
          - $values/redhat/rhoai/v3.5/base/03-workloads/agents/ocp-virt-agent/values/values-agent.yaml
    - repoURL: https://github.com/rrbanda/ai-platforms.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ocp-virt-agent
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
