apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-config
  namespace: openshell-dashboard
data:
  oauth2-proxy.cfg: |
    provider = "keycloak-oidc"
    oidc_issuer_url = "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/master"
    insecure_oidc_skip_issuer_verification = true
    client_id = "openshell-dashboard"
    redirect_url = "https://openshell-dashboard-openshell-dashboard.apps.ocp.qn6c5.sandbox1388.opentlc.com/oauth2/callback"
    http_address = "0.0.0.0:4180"
    upstreams = ["http://127.0.0.1:8080"]
    email_domains = ["*"]
    skip_provider_button = true
    pass_access_token = true
    set_xauthrequest = true
    cookie_secure = true
    cookie_httponly = true
    cookie_samesite = "lax"
    scope = "openid profile email"
    ssl_insecure_skip_verify = true
