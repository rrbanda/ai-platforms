apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-mcp-gateway-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/rrbanda/ai-platforms.git
    targetRevision: main
    path: redhat/rhoai/v3.4/deploy/00-operators/mcp-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-operators
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
