# NOTE: installPlanApproval is Automatic -- operator upgrades within the
# pinned channel happen without manual approval. For production, consider
# switching to Manual to control upgrade timing.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: keycloak
spec:
  channel: stable-v26.6
  installPlanApproval: Automatic
  name: rhbk-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
