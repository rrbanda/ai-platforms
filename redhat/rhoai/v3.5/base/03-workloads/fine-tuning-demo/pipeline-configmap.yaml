    n       \\\n          \\                         \\\"memory\\\": mem,\\n                           \\\n          \\ },\\n                        },\\n                    },\\n             \\\n          \\       \\\"timeout\\\": 30,\\n                },\\n            },\\n        }\\n\\\n          \\        path = f\\\"{KSERVE_ISVC_API}/namespaces/{namespace}/inferenceservices\\\"\\\n          \\n        resp = _k8s_api(\\\"POST\\\", path, isvc)\\n        resp.raise_for_status()\\n\\\n          \\        logger.info(f\\\"Created InferenceService {name} (storageUri={storage_uri})\\\"\\\n          )\\n        return resp.json()\\n\\n    def _wait_for_isvc_ready(namespace,\\\n          \\ name, timeout_s=600):\\n        start = time.time()\\n        path = f\\\"\\\n          {KSERVE_ISVC_API}/namespaces/{namespace}/inferenceservices/{name}\\\"\\n  \\\n          \\      logger.info(f\\\"Waiting for InferenceService {name} to be Ready (timeout:\\\n          \\ {timeout_s}s)...\\\")\\n    \
