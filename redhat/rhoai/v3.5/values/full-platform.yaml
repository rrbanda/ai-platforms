# RHOAI 3.5 -- Full platform
skipCrdCheck: true
components:
  dashboard:
    dsc:
      managementState: Managed
  kserve:
    dependencies:
      certManager: true
      leaderWorkerSet: true
      jobSet: true
      rhcl: true
      customMetricsAutoscaler: false
    dsc:
      managementState: Managed
      nim:
        managementState: Managed
      wva:
        managementState: Managed
    gateway:
      create: true
      name: openshift-ai-inference
      namespace: openshift-ingress
      labels:
        istio.io/rev: openshift-gateway
      spec:
        gatewayClassName: openshift-ai-inference
        listeners:
          - name: https
            port: 443
            protocol: HTTPS
            allowedRoutes:
              namespaces:
                from: All
  aigateway:
    dsc:
      managementState: Managed
      modelsAsAService:
        managementState: Managed
      batchGateway:
        managementState: Managed
    modelsAsAService:
      gateway:
        create: true
        name: maas-default-gateway
        namespace: openshift-ingress
        annotations:
          security.opendatahub.io/authorino-tls-bootstrap: "true"
          opendatahub.io/managed: "false"
        spec:
          gatewayClassName: maas-gateway-class
          listeners:
            - name: https
              port: 443
              protocol: HTTPS
              allowedRoutes:
                namespaces:
                  from: All
  aipipelines:
    dsc:
      managementState: Managed
      argoWorkflowsControllers:
        managementState: Managed
  kueue:
    dsc:
      managementState: Unmanaged
      autoCreateQueues: true
      defaultClusterQueueName: default
      defaultLocalQueueName: default
  ray:
    dsc:
      managementState: Managed
  trainer:
    dsc:
      managementState: Managed
  trainingoperator:
    dsc:
      managementState: Managed
  workbenches:
    dsc:
      managementState: Managed
      workbenchNamespace: rhods-notebooks
  modelregistry:
    dsc:
      managementState: Managed
      registriesNamespace: rhoai-model-registries
  trustyai:
    dsc:
      managementState: Managed
      mcpGuardrailsMode: false
      eval:
        lmeval:
          permitCodeExecution: deny
          permitOnline: deny
  mlflowoperator:
    dsc:
      managementState: Managed
  feastoperator:
    dsc:
      managementState: Managed
  ogx:
    dsc:
      managementState: Managed

  sparkoperator:
    dsc:
      managementState: Managed

  mcplifecycleoperator:
    dsc:
      managementState: Managed

services:
  monitoring:
    dsci:
      managementState: Managed

dependencies:
  rhcl:
    config:
      tlsEnabled: true
