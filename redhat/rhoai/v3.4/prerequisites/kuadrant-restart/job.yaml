apiVersion: batch/v1
kind: Job
metadata:
  name: restart-kuadrant-controller
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: openshift-gitops-argocd-application-controller
      restartPolicy: Never
      containers:
        - name: restart
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Waiting for DSC to reach Ready..."
              oc wait datasciencecluster/default-dsc \
                --for=jsonpath='{.status.phase}'=Ready \
                --timeout=900s || {
                echo "DSC not Ready after 15min -- proceeding anyway"
              }
              echo "Restarting Kuadrant controller to pick up Istio dependencies..."
              oc delete pod -n kuadrant-system \
                -l control-plane=controller-manager \
                --ignore-not-found
              echo "Kuadrant controller restarted."
  backoffLimit: 3
