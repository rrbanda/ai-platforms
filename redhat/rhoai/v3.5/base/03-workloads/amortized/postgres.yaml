# registry.redhat.io/rhel9/postgresql-15 runs as UID 26 — compatible with restricted-v2 SCC.
# Uses POSTGRESQL_* env vars (not POSTGRES_*) and /var/lib/pgsql/data for data dir.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: amortized
  labels:
    app: amortized
    component: postgres
spec:
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels:
      app: amortized
      component: postgres
  template:
    metadata:
      labels:
        app: amortized
        component: postgres
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: amortized-db
                  key: POSTGRESQL_DATABASE
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: amortized-db
                  key: POSTGRESQL_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amortized-db
                  key: POSTGRESQL_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "amortized"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "amortized"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: amortized
          component: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: amortized
  labels:
    app: amortized
    component: postgres
spec:
  type: ClusterIP
  selector:
    app: amortized
    component: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
