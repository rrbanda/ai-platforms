# SparkApplication with Kueue admission control.
# Same as spark-data-ingestion.yaml but adds the kueue.x-k8s.io/queue-name label.
#
# Kueue + Spark Operator integration (Technology Preview in RHOAI 3.5):
# - Kueue suspends the SparkApplication until quota is available
# - Driver and executor pod resources are accounted against the ClusterQueue
# - Gang scheduling ensures driver + all executors are admitted together
# - On completion, quota is reclaimed automatically
#
# Prerequisites (in addition to base SparkApplication prerequisites):
# - Red Hat build of Kueue Operator installed
# - SparkApplication listed in Kueue CR spec.integrations.frameworks
# - ClusterQueue with sufficient cpu/memory quota
# - LocalQueue spark-lq in the target namespace
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: data-ingestion-batch-kueue
  labels:
    app: spark-data-ingestion
    kueue.x-k8s.io/queue-name: spark-lq
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: quay.io/opendatahub/data-processing:Spark-v4.0.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///mnt/app/data_ingestion.py
  sparkVersion: "4.0.1"
  timeToLiveSeconds: 600
  sparkConf:
    spark.eventLog.enabled: "true"
    spark.eventLog.dir: "file:///mnt/event-logs"
  restartPolicy:
    type: Never
  volumes:
    - name: nas-input
      persistentVolumeClaim:
        claimName: nas-raw-data
    - name: output
      persistentVolumeClaim:
        claimName: ingestion-output
    - name: event-logs
      persistentVolumeClaim:
        claimName: spark-event-logs
    - name: schema
      configMap:
        name: ingestion-schema
    - name: app-code
      configMap:
        name: ingestion-app-code
    - name: work-dir
      emptyDir: {}
  driver:
    cores: 1
    memory: "1024m"
    serviceAccount: spark-operator-spark
    securityContext: {}
    env:
      - name: INPUT_DIR
        value: /mnt/nas-input
      - name: OUTPUT_DIR
        value: /mnt/output
      - name: SCHEMA_PATH
        value: /mnt/schema/schema.json
    volumeMounts:
      - name: nas-input
        mountPath: /mnt/nas-input
      - name: output
        mountPath: /mnt/output
      - name: event-logs
        mountPath: /mnt/event-logs
      - name: schema
        mountPath: /mnt/schema
      - name: app-code
        mountPath: /mnt/app
      - name: work-dir
        mountPath: /opt/spark/work-dir
  executor:
    cores: 1
    instances: 1
    memory: "1024m"
    securityContext: {}
    volumeMounts:
      - name: nas-input
        mountPath: /mnt/nas-input
        readOnly: true
      - name: output
        mountPath: /mnt/output
      - name: work-dir
        mountPath: /opt/spark/work-dir
