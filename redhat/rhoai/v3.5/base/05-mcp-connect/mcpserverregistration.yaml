apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: openshift-mcp-server-reg
  namespace: ocp-mcp-server
spec:
  prefix: "openshift_"
  hint: "OpenShift cluster inspection tools for AI agents"
  category:
    - kubernetes
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: openshift-mcp-server-route
    namespace: ocp-mcp-server
