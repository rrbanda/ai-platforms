        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef download_base_model(\n    model_name: str,\n    pvc_mount_path:\
          \ str,\n) -> str:\n    \"\"\"Pre-cache a HuggingFace model to the workspace\
          \ PVC.\n\n    Idempotent: skips download if model already cached (sentinel\
          \ file check).\n    This ensures the model is available on shared PVC for\
          \ training and eval\n    without re-downloading on every pipeline run.\n\
          \n    Args:\n        model_name: HuggingFace model ID (e.g. 'Qwen/Qwen2.5-1.5B-Instruct').\n\
          \        pvc_mount_path: Workspace PVC mount path.\n\n    Returns:\n   \
          \     The sub-path on PVC where the model is cached.\n    \"\"\"\n    import\
          \ os\n\n    from huggingface_hub import snapshot_download\n\n    model_dir_name\
          \ = model_name.replace(\"/\", \"--\")\n    model_path = os.path.join(pvc_mount_path,\
          \ \"models\", model_dir_name)\n    sentinel = os.path.join(model_path, \"\
          .download_complete\")\n\n    if os.path.exists(sentinel):\n        file_count\
          \ = sum(1 for _ in os.scandir(model_path) if _.is_file())\n        print(f\"\
