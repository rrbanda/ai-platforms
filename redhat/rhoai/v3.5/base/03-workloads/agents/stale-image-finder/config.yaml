apiVersion: v1
kind: ConfigMap
metadata:
  name: stale-image-finder-config
  labels:
    app.kubernetes.io/part-of: stale-image-finder
data:
  config.yaml: |
    model:
      default: "gemini-2.5-pro"
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      provider: custom
      api_key: "${OPENAI_API_KEY}"
    mcp_servers:
      openshift:
        url: "${OPENSHIFT_MCP_URL}"
        timeout: 60
        connect_timeout: 30
      github:
        command: "npx"
        args: ["-y", "@modelcontextprotocol/server-github"]
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
        timeout: 30
        connect_timeout: 15
        tools:
          include:
            - create_pull_request
            - get_file_contents
            - push_files
            - create_branch
            - list_branches
            - search_code
            - create_or_update_file
            - list_commits
    gateway:
      enabled: false
    tools:
      code_execution:
        enabled: "on"
        backend: local
      file_operations:
        enabled: "on"
      web_search:
        enabled: "off"
      browser:
        enabled: "off"
    toolsets:
      skills: true
      memory: true
      session_search: true
      delegation: true
      cronjob: true
      kanban: false
    delegation:
      max_concurrent_children: 3
    memory:
      enabled: true
      providers: []
    skills:
      enabled: true
      directory: /sandbox/.hermes/skills
      curator:
        enabled: true
    display:
      skin:
        branding:
          agent_name: "Stale Image Finder"
          welcome: "I find container images past 30/60/90-day windows and open GitOps PRs to refresh them."
          response_label: "Stale Image Finder"
    dashboard:
      title: "Stale Image Finder"
      subtitle: "AI-powered image compliance and GitOps refresh"
