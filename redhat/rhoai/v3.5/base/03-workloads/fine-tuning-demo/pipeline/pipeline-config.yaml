# Pipeline Configuration
#
# Externalized compile-time values for the fine-tuning pipeline.
# Edit this file to change container images, package versions, or
# default parameter values without modifying Python source code.
#
# After editing, run: make pipeline (or ./scripts/build-pipeline.sh)

# =============================================================================
# Container Images (updated when RHOAI ships a new version)
# =============================================================================
images:
  # Base image for pipeline executor pods (dataset download, model download, registry)
  pipeline_base: "quay.io/opendatahub/odh-th06-cpu-torch291-py312:odh-3.4"
  # Base image for training component (same image, used by train_model)
  training_base: "quay.io/opendatahub/odh-th06-cpu-torch291-py312:odh-3.4"
  # Base image for data quality filter
  quality_filter_base: "quay.io/opendatahub/odh-th06-cpu-torch291-py312:odh-3.4"
  # Base image for holdout eval (lm-eval with unitxt)
  eval_base: "registry.access.redhat.com/ubi9/python-311:latest"

# =============================================================================
# Package Dependencies (pinned versions for reproducibility)
# =============================================================================
packages:
  training:
    - "kubernetes"
    - "olot"
    - "matplotlib"
  quality_filter:
    - "sdg-hub>=0.7.0,<1.0"
    - "requests"
  model_download:
    - "huggingface_hub>=0.20.0"

# =============================================================================
# Pipeline Identity
# =============================================================================
pipeline:
  name: "finetuning-pipeline"
  version: "v4"
  description: >-
    7-phase fine-tuning pipeline supporting LoRA, SFT, OSFT, and custom
    techniques. Includes data quality filter (dedup + quality scoring),
    model pre-caching, distributed training, benchmark evaluation with
    safety benchmarks via EvalHub + MLflow, holdout evaluation, and
    model registry with full provenance.

# =============================================================================
# Infrastructure Defaults (per-cluster, override in overlays)
# =============================================================================
infrastructure:
  pvc_mount_path: "/mnt/shared"
  pvc_name: "fine-tuning-shared"
  namespace: "fine-tuning-demo"

# =============================================================================
# Service Endpoints (per-cluster, override in overlays)
# =============================================================================
services:
  evalhub_url: "https://evalhub.redhat-ods-applications.svc.cluster.local:8443"
  mlflow_experiment: "finetuning-experiments"
  registry_address: "fine-tuning-demo.rhoai-model-registries.svc.cluster.local"
  registry_port: 8443

# =============================================================================
# Default Run Parameters (data scientist overrides at run-time)
# =============================================================================
defaults:
  technique: "lora"
  base_model: "Qwen/Qwen2.5-1.5B-Instruct"
  dataset_uri: "hf://b-mc2/sql-create-context"
  dataset_subset: 5000
  train_split_ratio: 0.9
  epochs: 2
  learning_rate: 0.0002
  effective_batch_size: 128
  max_seq_len: 8192
  max_tokens_per_gpu: 32000
  gpu_per_worker: 1
  num_workers: 1
  cpu_per_worker: "4"
  memory_per_worker: "32Gi"
  training_runtime: "training-hub"
  seed: 42

# =============================================================================
# Evaluation Defaults
# =============================================================================
evaluation:
  benchmarks:
    # Accuracy (leaderboard-v2)
    - id: "leaderboard_ifeval"
      provider_id: "lm_evaluation_harness"
    - id: "leaderboard_bbh"
      provider_id: "lm_evaluation_harness"
    - id: "leaderboard_mmlu_pro"
      provider_id: "lm_evaluation_harness"
    - id: "leaderboard_musr"
      provider_id: "lm_evaluation_harness"
    - id: "leaderboard_math_hard"
      provider_id: "lm_evaluation_harness"
    # Safety & fairness
    - id: "truthfulqa_mc1"
      provider_id: "lm_evaluation_harness"
    - id: "toxigen"
      provider_id: "lm_evaluation_harness"
    - id: "ethics_cm"
      provider_id: "lm_evaluation_harness"
  holdout_tasks:
    - "arc_easy"
  holdout_limit: 100
  timeout: 7200
  gpu_count: 1
  cpu: "2"
  memory: "32Gi"
