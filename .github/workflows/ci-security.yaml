name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: redhat/
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table
          trivyignores: .trivyignore

  kubeconform-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | \
            tar xz -C /usr/local/bin
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" | \
            tar xz -C /usr/local/bin
      - name: Validate K8s schemas
        run: |
          ROOTS=(
            "redhat/rhoai/v3.5/base/03-workloads/agents/rfp-agent"
            "redhat/rhoai/v3.5/base/03-workloads/agents/loan-agent"
            "redhat/rhoai/v3.5/base/03-workloads/agents/rhoai-copilot"
            "redhat/rhoai/v3.5/base/03-workloads/agents/pod-health-watcher"
            "redhat/rhoai/v3.5/base/03-workloads/agents/stale-image-finder"
            "redhat/rhoai/v3.5/base/03-workloads/agents/pr-review-bot"
            "redhat/rhoai/v3.5/base/10-agenthive/infra"
            "redhat/rhoai/v3.5/base/10-agenthive/open-webui"
            "redhat/rhoai/v3.5/base/10-agenthive/evalhub"
            "redhat/rhoai/v3.5/base/10-agenthive/bootstrap"
          )
          for root in "${ROOTS[@]}"; do
            echo "--- Validating $root ---"
            kustomize build "$root" 2>/dev/null | kubeconform \
              -strict \
              -ignore-missing-schemas \
              -kubernetes-version 1.30.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -summary || true
          done

  rbac-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit RBAC permissions
        run: bash .github/scripts/rbac-audit.sh
