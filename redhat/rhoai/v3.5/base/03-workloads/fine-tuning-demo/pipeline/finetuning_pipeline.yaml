          \ 4. Input Sanitization ---\n    def parse_input(val, default):\n      \
          \  if val is None:\n            return default\n        if isinstance(val,\
          \ str):\n            try:\n                return json.loads(val)\n    \
          \        except json.JSONDecodeError:\n                return val\n    \
          \    return val\n\n    tasks_list = parse_input(task_names, [])\n    m_args\
          \ = parse_input(model_args, {})\n    _ = parse_input(gen_kwargs, {})  #\
          \ Reserved for future use\n    limit_val = None if limit == -1 else limit\n\
          \n    # --- 5. Build task dict ---\n    task_dict = {}\n\n    if tasks_list:\n\
          \        logger.info(f\"Adding benchmark tasks: {tasks_list}\")\n      \
          \  benchmark_task_dict = get_task_dict(tasks_list)\n        task_dict.update(benchmark_task_dict)\n\
          \n    if custom_task:\n        task_dict[\"custom_holdout_eval\"] = custom_task\n\
          \        logger.info(\"Added custom holdout task to evaluation\")\n\n  \
          \  if not task_dict:\n        raise ValueError(\"No tasks to evaluate! Provide\
          \ task_names or eval_dataset.\")\n\n    logger.info(f\"Total tasks to evaluate:\
          \ {len(task_dict)}\")\n\n    # --- 6. Load Model ---\n    logger.info(\"\
          Loading model with vLLM backend...\")\n    start_time = time.time()\n\n\
          \    try:\n        vllm_model_args = {\n            \"pretrained\": final_model_path,\n\
          \            \"trust_remote_code\": True,\n            \"gpu_memory_utilization\"\
          : 0.8,\n            \"dtype\": \"auto\",\n        }\n        vllm_model_args.update(m_args)\n\
          \n        model_class = get_model(\"vllm\")\n\n        if batch_size ==\
          \ \"auto\":\n            bs = \"auto\"\n        else:\n            try:\n\
          \                bs = int(batch_size)\n            except ValueError:\n\
          \                bs = \"auto\"\n\n        additional_config = {\n      \
          \      \"batch_size\": bs,\n            \"device\": None,\n        }\n\n\
          \        loaded_model = model_class.create_from_arg_obj(vllm_model_args,\
          \ additional_config)\n        logger.info(f\"Model loaded successfully in\
          \ {time.time() - start_time:.2f}s\")\n    except Exception as e:\n     \
          \   logger.error(f\"Failed to load model: {e}\")\n        raise RuntimeError(f\"\
          Model loading failed: {e}\")\n\n    # --- 7. Run Evaluation ---\n    logger.info(\"\
          Starting evaluation...\")\n    start_time = time.time()\n\n    try:\n  \
          \      results = evaluate(\n            lm=loaded_model,\n            task_dict=task_dict,\n\
          \            limit=limit_val,\n            verbosity=verbosity,\n      \
          \  )\n    except Exception as e:\n        logger.error(f\"Evaluation failed:\
          \ {str(e)}\")\n        raise RuntimeError(f\"Fatal error in evaluation:\
          \ {e}\")\n\n    duration = time.time() - start_time\n    logger.info(f\"\
          Evaluation completed in {duration:.2f}s\")\n\n    # --- 8. Output Processing\
          \ ---\n    def clean_for_json(obj):\n        if isinstance(obj, (int, float,\
          \ str, bool, type(None))):\n            return obj\n        elif hasattr(obj,\
          \ \"item\"):\n            return obj.item()\n        elif isinstance(obj,\
          \ dict):\n            return {k: clean_for_json(v) for k, v in obj.items()}\n\
          \        elif isinstance(obj, list):\n            return [clean_for_json(item)\
          \ for item in obj]\n        return str(obj)\n\n    clean_results = clean_for_json(results)\n\
          \n    # --- Log Evaluation Metadata ---\n    output_metrics.log_metric(\"\
          eval_duration_seconds\", round(duration, 2))\n    output_metrics.log_metric(\"\
          eval_tasks_count\", len(task_dict))\n\n    custom_eval_ran = custom_task\
          \ is not None and \"custom_holdout_eval\" in str(clean_results.get(\"results\"\
          , {}))\n    output_metrics.log_metric(\"custom_eval_enabled\", 1 if custom_eval_ran\
          \ else 0)\n\n    try:\n        output_metrics.metadata[\"eval_benchmark_tasks\"\
          ] = \",\".join(tasks_list)\n        output_metrics.metadata[\"eval_custom_task\"\
          ] = \"custom_holdout_eval\" if custom_task else \"none\"\n        output_metrics.metadata[\"\
          eval_model_path\"] = final_model_path\n        output_metrics.metadata[\"\
          eval_batch_size\"] = str(batch_size)\n        output_metrics.metadata[\"\
          eval_limit\"] = str(limit_val) if limit_val else \"all\"\n        if eval_dataset_info:\n\
          \            output_metrics.metadata[\"eval_dataset_examples\"] = str(eval_dataset_info.get(\"\
          num_examples\", \"\"))\n            output_metrics.metadata[\"eval_dataset_path\"\
          ] = eval_dataset_info.get(\"pvc_path\", \"\")\n            output_metrics.metadata[\"\
          eval_custom_data_used\"] = \"true\" if custom_eval_ran else \"false\"\n\
          \    except Exception as e:\n        logger.warning(f\"Could not set metadata:\
          \ {e}\")\n\n    # --- Log Task Metrics ---\n    if \"results\" in clean_results:\n\
          \        for task_name, metrics in clean_results[\"results\"].items():\n\
          \            display_name = metrics.get(\"alias\", task_name)\n\n      \
          \      if task_name == \"custom_holdout_eval\":\n                prefix\
          \ = \"holdout\"\n                logger.info(\"=== CUSTOM HOLDOUT EVALUATION\
          \ RESULTS ===\")\n            else:\n                prefix = display_name\n\
          \n            for key, value in metrics.items():\n                if isinstance(value,\
          \ (int, float)) and key != \"alias\":\n                    safe_key = f\"\
          {prefix}_{key}\".replace(\" \", \"_\").replace(\"/\", \"_\")\n         \
          \           output_metrics.log_metric(safe_key, value)\n\n             \
          \       if task_name == \"custom_holdout_eval\":\n                     \
          \   logger.info(f\"  {key}: {value:.4f}\" if isinstance(value, float) else\
          \ f\"  {key}: {value}\")\n\n        if custom_eval_ran and \"custom_holdout_eval\"\
          \ in clean_results[\"results\"]:\n            custom_results = clean_results[\"\
          results\"][\"custom_holdout_eval\"]\n            exact_match = custom_results.get(\"\
          exact_match,none\", custom_results.get(\"exact_match\", \"N/A\"))\n    \
          \        contains_match = custom_results.get(\"contains_match,none\", custom_results.get(\"\
          contains_match\", \"N/A\"))\n            logger.info(f\"=== HOLDOUT EXACT\
          \ MATCH: {exact_match} ===\")\n            logger.info(f\"=== HOLDOUT CONTAINS\
          \ MATCH: {contains_match} ===\")\n            logger.info(\"This metric\
          \ shows how well the model performs on YOUR held-out data.\")\n\n    # ---\
          \ Save Artifacts ---\n    output_results.name = \"eval_results.json\"\n\
          \    with open(output_results.path, \"w\") as f:\n        json.dump(clean_results,\
          \ f, indent=2)\n\n    if log_samples and custom_task and len(prompt_response_log)\
          \ > 0:\n        try:\n            output_samples.name = \"eval_samples.json\"\
          \n            with open(output_samples.path, \"w\") as f:\n            \
          \    json.dump(prompt_response_log, f, indent=2)\n            logger.info(f\"\
          Prompt/response log saved with {len(prompt_response_log)} samples\")\n \
          \       except Exception as e:\n            logger.warning(f\"Failed to\
          \ save prompt/response log: {e}\")\n    elif log_samples and \"samples\"\
          \ in clean_results:\n        output_samples.name = \"eval_samples.json\"\
          \n        with open(output_samples.path, \"w\") as f:\n            json.dump(clean_results[\"\
          samples\"], f, indent=2)\n\n"
        image: registry.access.redhat.com/ubi9/python-311:latest
        resources:
          accelerator:
            count: '1'
            resourceCount: '1'
pipelineInfo:
  description: Fine-tuning pipeline supporting LoRA, SFT, OSFT, and custom techniques.
    Includes dataset preparation with train/eval split, model pre-caching, distributed
    training, benchmark evaluation via EvalHub with MLflow, holdout evaluation on
    task-specific data, and model registry with full provenance.
  name: finetuning-pipeline
root:
  dag:
    tasks:
      dataset-download:
        cachingOptions: {}
        componentRef:
          name: comp-dataset-download
        inputs:
          parameters:
            dataset_uri:
              componentInputParameter: dataset_uri
            pvc_mount_path:
              runtimeValue:
                constant: '{{$.workspace_path}}'
            shared_log_file:
              runtimeValue:
                constant: pipeline_log.txt
            subset_count:
              componentInputParameter: dataset_subset
            train_split_ratio:
              componentInputParameter: train_split_ratio
        taskInfo:
          name: dataset-download
      download-base-model:
        cachingOptions: {}
        componentRef:
          name: comp-download-base-model
        inputs:
          parameters:
            model_name:
              componentInputParameter: base_model
            pvc_mount_path:
              runtimeValue:
                constant: '{{$.workspace_path}}'
        taskInfo:
          name: download-base-model
      evalhub-evaluator-kserve:
        cachingOptions: {}
        componentRef:
          name: comp-evalhub-evaluator-kserve
        dependentTasks:
        - train-model
        inputs:
          artifacts:
            model_artifact:
              taskOutputArtifact:
                outputArtifactKey: output_model
                producerTask: train-model
          parameters:
            base_model_name:
              componentInputParameter: base_model
            benchmarks:
              componentInputParameter: evalhub_benchmarks
            collection_id:
              componentInputParameter: evalhub_collection
            cpu:
              componentInputParameter: eval_cpu
            evalhub_job_name:
              runtimeValue:
                constant: finetuning-pipeline-eval
            evalhub_model_name:
              runtimeValue:
                constant: finetuned-model
            evalhub_poll_interval:
              runtimeValue:
                constant: 30.0
            evalhub_timeout:
              componentInputParameter: eval_timeout
            evalhub_url:
              componentInputParameter: evalhub_url
            gpu_count:
              componentInputParameter: eval_gpu_count
            memory:
              componentInputParameter: eval_memory
            mlflow_experiment_name:
              componentInputParameter: mlflow_experiment
            pvc_mount_path:
              runtimeValue:
                constant: '{{$.workspace_path}}'
        taskInfo:
          name: evalhub-evaluator-kserve
      kubeflow-model-registry:
        cachingOptions: {}
        componentRef:
          name: comp-kubeflow-model-registry
        dependentTasks:
        - evalhub-evaluator-kserve
        - train-model
        - universal-llm-evaluator
        inputs:
          artifacts:
            eval_metrics:
              taskOutputArtifact:
                outputArtifactKey: output_metrics
                producerTask: evalhub-evaluator-kserve
            eval_results:
              taskOutputArtifact:
                outputArtifactKey: output_results
                producerTask: evalhub-evaluator-kserve
            input_metrics:
              taskOutputArtifact:
                outputArtifactKey: output_metrics
                producerTask: train-model
            input_model:
              taskOutputArtifact:
                outputArtifactKey: output_model
                producerTask: train-model
          parameters:
            author:
              componentInputParameter: registry_author
            model_description:
              componentInputParameter: registry_description
            model_format_name:
              runtimeValue:
                constant: pytorch
            model_format_version:
              runtimeValue:
                constant: '1.0'
            model_name:
              componentInputParameter: registry_model_name
            model_version:
              componentInputParameter: registry_model_version
            pvc_mount_path:
              runtimeValue:
                constant: '{{$.workspace_path}}'
            registry_address:
              componentInputParameter: registry_address
            registry_port:
              componentInputParameter: registry_port
            shared_log_file:
              runtimeValue:
                constant: pipeline_log.txt
            source_namespace:
              runtimeValue:
                constant: ''
            source_pipeline_name:
              runtimeValue:
                constant: finetuning-pipeline
            source_pipeline_run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
            source_pipeline_run_name:
              runtimeValue:
                constant: '{{$.pipeline_job_name}}'
        taskInfo:
          name: kubeflow-model-registry
      train-model:
        cachingOptions: {}
        componentRef:
          name: comp-train-model
        dependentTasks:
        - dataset-download
        - download-base-model
        inputs:
          artifacts:
            dataset:
              taskOutputArtifact:
                outputArtifactKey: train_dataset
                producerTask: dataset-download
          parameters:
            lora_alpha:
              componentInputParameter: lora_alpha
            lora_bf16:
              componentInputParameter: lora_bf16
            lora_dropout:
              componentInputParameter: lora_dropout
            lora_flash_attention:
              componentInputParameter: lora_flash_attention
            lora_gradient_accumulation_steps:
              componentInputParameter: lora_grad_accum_steps
            lora_load_in_4bit:
              componentInputParameter: lora_load_in_4bit
            lora_load_in_8bit:
              componentInputParameter: lora_load_in_8bit
            lora_micro_batch_size:
              componentInputParameter: lora_micro_batch_size
            lora_r:
              componentInputParameter: lora_r
            lora_sample_packing:
              componentInputParameter: lora_sample_packing
            lora_target_modules:
              componentInputParameter: lora_target_modules
            osft_target_patterns:
              componentInputParameter: osft_target_patterns
            osft_unfreeze_rank_ratio:
              componentInputParameter: osft_unfreeze_ratio
            pvc_path:
              runtimeValue:
                constant: '{{$.workspace_path}}'
            sft_fsdp_sharding_strategy:
              componentInputParameter: sft_fsdp_sharding
            technique:
              componentInputParameter: technique
            training_base_model:
              componentInputParameter: base_model
            training_effective_batch_size:
              componentInputParameter: effective_batch_size
            training_envs:
              componentInputParameter: env_vars
            training_learning_rate:
              componentInputParameter: learning_rate
            training_lr_scheduler:
              componentInputParameter: lr_scheduler
            training_max_seq_len:
              componentInputParameter: max_seq_len
            training_max_tokens_per_gpu:
              componentInputParameter: max_tokens_per_gpu
            training_metadata_annotations:
              componentInputParameter: annotations
            training_metadata_labels:
              componentInputParameter: labels
            training_num_epochs:
              componentInputParameter: epochs
            training_resource_cpu_per_worker:
              componentInputParameter: cpu_per_worker
            training_resource_gpu_per_worker:
              componentInputParameter: gpu_per_worker
            training_resource_memory_per_worker:
              componentInputParameter: memory_per_worker
            training_resource_num_workers:
              componentInputParameter: num_workers
            training_runtime:
              componentInputParameter: training_runtime
            training_seed:
              componentInputParameter: seed
            training_use_liger:
              componentInputParameter: use_liger
        taskInfo:
          name: train-model
      universal-llm-evaluator:
        cachingOptions: {}
        componentRef:
          name: comp-universal-llm-evaluator
        dependentTasks:
        - dataset-download
        - evalhub-evaluator-kserve
        - train-model
        inputs:
          artifacts:
            eval_dataset:
              taskOutputArtifact:
                outputArtifactKey: eval_dataset
                producerTask: dataset-download
            model_artifact:
              taskOutputArtifact:
                outputArtifactKey: output_model
                producerTask: train-model
          parameters:
            batch_size:
              componentInputParameter: holdout_eval_batch_size
            limit:
              componentInputParameter: holdout_eval_limit
            log_samples:
              runtimeValue:
                constant: true
            task_names:
              componentInputParameter: holdout_eval_tasks
        taskInfo:
          name: universal-llm-evaluator
  inputDefinitions:
    parameters:
      annotations:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      base_model:
        defaultValue: Qwen/Qwen2.5-1.5B-Instruct
        isOptional: true
        parameterType: STRING
      cpu_per_worker:
        defaultValue: '4'
        isOptional: true
        parameterType: STRING
      dataset_subset:
        defaultValue: 5000.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      dataset_uri:
        defaultValue: hf://b-mc2/sql-create-context
        isOptional: true
        parameterType: STRING
      effective_batch_size:
        defaultValue: 128.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      env_vars:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      epochs:
        defaultValue: 2.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      eval_cpu:
        defaultValue: '2'
        isOptional: true
        parameterType: STRING
      eval_gpu_count:
        defaultValue: 1.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      eval_memory:
        defaultValue: 32Gi
        isOptional: true
        parameterType: STRING
      eval_timeout:
        defaultValue: 7200.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      evalhub_benchmarks:
        defaultValue:
        - id: leaderboard_ifeval
          provider_id: lm_evaluation_harness
        - id: leaderboard_bbh
          provider_id: lm_evaluation_harness
        - id: leaderboard_mmlu_pro
          provider_id: lm_evaluation_harness
        - id: leaderboard_musr
          provider_id: lm_evaluation_harness
        - id: leaderboard_math_hard
          provider_id: lm_evaluation_harness
        isOptional: true
        parameterType: LIST
      evalhub_collection:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      evalhub_url:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      gpu_per_worker:
        defaultValue: 1.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      holdout_eval_batch_size:
        defaultValue: auto
        isOptional: true
        parameterType: STRING
      holdout_eval_limit:
        defaultValue: 100.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      holdout_eval_tasks:
        defaultValue:
        - arc_easy
        isOptional: true
        parameterType: LIST
      labels:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      learning_rate:
        defaultValue: 0.0002
        isOptional: true
        parameterType: NUMBER_DOUBLE
      lora_alpha:
        defaultValue: 32.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      lora_bf16:
        defaultValue: true
        isOptional: true
        parameterType: BOOLEAN
      lora_dropout:
        defaultValue: 0.0
        isOptional: true
        parameterType: NUMBER_DOUBLE
      lora_flash_attention:
        defaultValue: true
        isOptional: true
        parameterType: BOOLEAN
      lora_grad_accum_steps:
        defaultValue: 1.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      lora_load_in_4bit:
        defaultValue: true
        isOptional: true
        parameterType: BOOLEAN
      lora_load_in_8bit:
        defaultValue: false
        isOptional: true
        parameterType: BOOLEAN
      lora_micro_batch_size:
        defaultValue: 2.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      lora_r:
        defaultValue: 16.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      lora_sample_packing:
        defaultValue: false
        isOptional: true
        parameterType: BOOLEAN
      lora_target_modules:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      lr_scheduler:
        defaultValue: cosine
        isOptional: true
        parameterType: STRING
      max_seq_len:
        defaultValue: 8192.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      max_tokens_per_gpu:
        defaultValue: 32000.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      memory_per_worker:
        defaultValue: 32Gi
        isOptional: true
        parameterType: STRING
      mlflow_experiment:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      num_workers:
        defaultValue: 1.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      osft_target_patterns:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      osft_unfreeze_ratio:
        defaultValue: 0.1
        isOptional: true
        parameterType: NUMBER_DOUBLE
      registry_address:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      registry_author:
        defaultValue: pipeline
        isOptional: true
        parameterType: STRING
      registry_description:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      registry_model_name:
        defaultValue: finetuned-model
        isOptional: true
        parameterType: STRING
      registry_model_version:
        defaultValue: 1.0.0
        isOptional: true
        parameterType: STRING
      registry_port:
        defaultValue: 8080.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      seed:
        defaultValue: 42.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      sft_fsdp_sharding:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      technique:
        defaultValue: lora
        isOptional: true
        parameterType: STRING
      train_split_ratio:
        defaultValue: 0.9
        isOptional: true
        parameterType: NUMBER_DOUBLE
      training_runtime:
        defaultValue: training-hub
        isOptional: true
        parameterType: STRING
      use_liger:
        defaultValue: true
        isOptional: true
        parameterType: BOOLEAN
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-dataset-download:
          imagePullPolicy: IfNotPresent
          secretAsEnv:
          - keyToEnv:
            - envVar: AWS_ACCESS_KEY_ID
              secretKey: AWS_ACCESS_KEY_ID
            - envVar: AWS_SECRET_ACCESS_KEY
              secretKey: AWS_SECRET_ACCESS_KEY
            optional: true
            secretName: s3-secret
            secretNameParameter:
              runtimeValue:
                constant: s3-secret
          - keyToEnv:
            - envVar: HF_TOKEN
              secretKey: HF_TOKEN
            optional: true
            secretName: hf-token
            secretNameParameter:
              runtimeValue:
                constant: hf-token
        exec-download-base-model:
          imagePullPolicy: IfNotPresent
          secretAsEnv:
          - keyToEnv:
            - envVar: HF_TOKEN
              secretKey: HF_TOKEN
            optional: true
            secretName: hf-token
            secretNameParameter:
              runtimeValue:
                constant: hf-token
        exec-evalhub-evaluator-kserve:
          imagePullPolicy: IfNotPresent
          secretAsEnv:
          - keyToEnv:
            - envVar: HF_TOKEN
              secretKey: HF_TOKEN
            optional: true
            secretName: hf-token
            secretNameParameter:
              runtimeValue:
                constant: hf-token
        exec-kubeflow-model-registry:
          imagePullPolicy: IfNotPresent
        exec-train-model:
          imagePullPolicy: IfNotPresent
          secretAsEnv:
          - keyToEnv:
            - envVar: KUBERNETES_SERVER_URL
              secretKey: KUBERNETES_SERVER_URL
            - envVar: KUBERNETES_AUTH_TOKEN
              secretKey: KUBERNETES_AUTH_TOKEN
            optional: false
            secretName: kubernetes-credentials
            secretNameParameter:
              runtimeValue:
                constant: kubernetes-credentials
          - keyToEnv:
            - envVar: OCI_PULL_SECRET_MODEL_DOWNLOAD
              secretKey: OCI_PULL_SECRET_MODEL_DOWNLOAD
            optional: true
            secretName: oci-pull-secret-model-download
            secretNameParameter:
              runtimeValue:
                constant: oci-pull-secret-model-download
          - keyToEnv:
            - envVar: HF_TOKEN
              secretKey: HF_TOKEN
            optional: true
            secretName: hf-token
            secretNameParameter:
              runtimeValue:
                constant: hf-token
        exec-universal-llm-evaluator:
          imagePullPolicy: IfNotPresent
          nodeSelector:
            labels:
              nvidia.com/gpu.present: 'true'
          secretAsEnv:
          - keyToEnv:
            - envVar: HF_TOKEN
              secretKey: HF_TOKEN
            optional: true
            secretName: hf-token
            secretNameParameter:
              runtimeValue:
                constant: hf-token
    pipelineConfig:
      workspace:
        kubernetes:
          pvcSpecPatch:
            accessModes:
            - ReadWriteMany
            storageClassName: nfs-csi
        size: 50Gi
