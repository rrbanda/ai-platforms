---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: evalhub-s3-credentials
  namespace: evalhub
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_DEFAULT_REGION: 
    AWS_S3_BUCKET: 
    AWS_S3_ENDPOINT: 
    AWS_SECRET_ACCESS_KEY: 
  template:
    metadata:
      name: evalhub-s3-credentials
      namespace: evalhub
    type: Opaque
