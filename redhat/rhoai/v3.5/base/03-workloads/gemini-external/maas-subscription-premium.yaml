apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: gemini-external-premium
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Gemini External Premium Tier"
    openshift.io/description: "Premium tier with higher rate limits for agentic workloads"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: gemini-3.7-flash
      namespace: gemini-external
      tokenRateLimits:
        - limit: 2500000
          window: 1h
    - name: gemini-3.5-flash
      namespace: gemini-external
      tokenRateLimits:
        - limit: 2500000
          window: 1h
    - name: gemini-3.5-flash-lite
      namespace: gemini-external
      tokenRateLimits:
        - limit: 5000000
          window: 1h
    - name: gemini-2.5-flash
      namespace: gemini-external
      tokenRateLimits:
        - limit: 2500000
          window: 1h
    - name: gemini-2.5-pro
      namespace: gemini-external
      tokenRateLimits:
        - limit: 1000000
          window: 1h
  priority: 20
