# Authorino TLS: enable service-ca cert for Envoy-to-Authorino gRPC.
#
# ONE-TIME PREREQ per cluster (if cert-manager created a conflicting cert):
#   oc delete certificate authorino-server-cert -n kuadrant-system 2>/dev/null
#   oc delete secret authorino-server-cert -n kuadrant-system 2>/dev/null
#
# The service annotation triggers OpenShift service-ca to regenerate it.
# ServerSideApply merges annotations without replacing the service.
---
apiVersion: v1
kind: Service
metadata:
  name: authorino-authorino-authorization
  namespace: kuadrant-system
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: authorino-server-cert
spec:
  ports:
    - name: grpc
      port: 50051
      protocol: TCP
      targetPort: 50051
    - name: http
      port: 5001
      protocol: TCP
      targetPort: 5001
---
apiVersion: operator.authorino.kuadrant.io/v1beta1
kind: Authorino
metadata:
  name: authorino
  namespace: kuadrant-system
spec:
  replicas: 1
  clusterWide: true
  listener:
    tls:
      enabled: true
      certSecretRef:
        name: authorino-server-cert
  oidcServer:
    tls:
      enabled: false
