              '
            - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing\
              \ import *\n\ndef dataset_download(\n    train_dataset: dsl.Output[dsl.Dataset],\n\
              \    eval_dataset: dsl.Output[dsl.Dataset],\n    dataset_uri: str,\n\
              \    pvc_mount_path: str,\n    train_split_ratio: float = 0.9,  # 1.0\
