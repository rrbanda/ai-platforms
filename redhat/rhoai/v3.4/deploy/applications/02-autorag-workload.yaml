apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autorag-workload
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/rrbanda/ai-platforms.git
    targetRevision: main
    path: redhat/rhoai/v3.4/deploy/03-workloads/autorag
  destination:
    server: https://kubernetes.default.svc
    namespace: autorag
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
