version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
    - /var/log
    - /dev/urandom
    - /opt/openshell
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /mnt
    - /run

landlock:
  compatibility: best_effort

network_policies:
  maas_inference:
    name: MaaS Gateway (model serving)
    endpoints:
      - host: maas.apps.ocp.qn6c5.sandbox1388.opentlc.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/lib/node_modules/opencode-ai/bin/.opencode

  jira_atlassian:
    name: Jira MCP (mcp-atlassian via uv)
    endpoints:
      - host: redhat.atlassian.net
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /sandbox/.uv/python/*/bin/python*

  mlflow_tracking:
    name: MLflow tracking server (RHOAI)
    endpoints:
      - host: mlflow-redhat-ods-applications.apps.ocp.qn6c5.sandbox1388.opentlc.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/lib/node_modules/opencode-ai/bin/.opencode

  openshell_gateway:
    name: OpenShell gateway
    endpoints:
      - host: openshell.openshell.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /opt/openshell/bin/openshell-sandbox

  cluster_dns:
    name: Cluster DNS
    endpoints:
      - host: "172.30.0.10"
        port: 53
      - host: "172.30.0.10"
        port: 5353
    binaries:
      - path: /**
