apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshell-sandbox
  namespace: opencode-vertex-tracing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencode-vertex-tracing-openshell-sandbox-privileged
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
- kind: ServiceAccount
  name: openshell-sandbox
  namespace: opencode-vertex-tracing
