apiVersion: argoproj.io/v1alpha1
kind: NotificationsConfiguration
metadata:
  name: default-notifications-configuration
  namespace: openshift-gitops
spec:
  triggers:
    - name: on-sync-failed
      template: sync-failed
      condition: app.status.operationState.phase in ['Error', 'Failed']
    - name: on-health-degraded
      template: health-degraded
      condition: app.status.health.status == 'Degraded'
    - name: on-sync-succeeded
      template: sync-succeeded
      condition: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
  templates:
    - name: sync-failed
      webhook:
        rhoai-webhook:
          method: POST
          body: |
            {
              "text": "RHOAI GitOps: Sync FAILED for {{.app.metadata.name}}",
              "app": "{{.app.metadata.name}}",
              "project": "{{.app.spec.project}}",
              "status": "{{.app.status.operationState.phase}}",
              "message": "{{.app.status.operationState.message}}",
              "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"
            }
    - name: health-degraded
      webhook:
        rhoai-webhook:
          method: POST
          body: |
            {
              "text": "RHOAI GitOps: {{.app.metadata.name}} is DEGRADED",
              "app": "{{.app.metadata.name}}",
              "project": "{{.app.spec.project}}",
              "health": "{{.app.status.health.status}}",
              "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"
            }
    - name: sync-succeeded
      webhook:
        rhoai-webhook:
          method: POST
          body: |
            {
              "text": "RHOAI GitOps: {{.app.metadata.name}} synced successfully",
              "app": "{{.app.metadata.name}}",
              "project": "{{.app.spec.project}}",
              "health": "{{.app.status.health.status}}"
            }
  services:
    - name: rhoai-webhook
      webhook:
        url: "REPLACE_WITH_WEBHOOK_URL"
        headers:
          - name: Content-Type
            value: application/json
