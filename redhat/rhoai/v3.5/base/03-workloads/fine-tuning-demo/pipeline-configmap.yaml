    \ time.sleep(15)\\n\\\n          \\        raise TimeoutError(f\\\"InferenceService {name} did not become Ready\\\n          \\ within {timeout_s}s\\\")\\n\\n    def _get_isvc_url(namespace, name):\\n  \\\n          \\      \\\"\\\"\\\"Get the model URL from the ISVC status.address.url field.\\\"\\\n          \\\"\\\"\\n        path = f\\\"{KSERVE_ISVC_API}/namespaces/{namespace}/inferenceservices/{name}\\\"\\\n          \\n        resp = _k8s_api(\\\"GET\\\", path)\\n        if resp.status_code ==\\\n          \\ 200:\\n            isvc = resp.json()\\n            address_url = isvc.get(\\\"\\\n          status\\\", {}).get(\\\"address\\\", {}).get(\\\"url\\\", \\\"\\\")\\n            if address_url:\\n\\\n          \\                url = address_url.rstrip(\\\"/\\\") + \\\"/v1\\\"\\n           \\\n          \\     logger.info(f\\\"ISVC address URL: {address_url}\\\")\\n              \\\n          \\  logger.info(f\\\"Model URL: {url}\\\")\\n                return url\\n    \\\n  \
    \        \\        status_url = isvc.get(\\\"status\\\", {}).get(\\\"url\\\", \\\"\\\")\\n    \\\n          \\        if status_url:\\n                url = status_url.rstrip(\\\"/\\\")\\\n          \\ + \\\":8080/v1\\\"\\n                logger.info(f\\\"ISVC status URL: {status_url},\\\n          \\ using port 8080\\\")\\n                logger.info(f\\\"Model URL: {url}\\\"\\\n          )\\n                return url\\n        fallback = f\\\"http://{name}-predictor.{namespace}.svc.cluster.local:8080/v1\\\"\\\n          \\n        logger.warning(f\\\"Could not read ISVC status, falling back to:\\\n          \\ {fallback}\\\")\\n        return fallback\\n\\n    def _cleanup_kserve(namespace,\\\n          \\ sr_name, isvc_name):\\n        logger.info(f\\\"Cleaning up InferenceService\\\n          \\ {isvc_name} and ServingRuntime {sr_name}\\\")\\n        for kind, api, name\\\n          \\ in [\\n            (\\\"InferenceService\\\", KSERVE_ISVC_API, isvc_name),\\n\\\n          \\\
