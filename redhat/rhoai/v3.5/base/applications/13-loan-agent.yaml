apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loan-agent
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: rhoai-workloads
  source:
    repoURL: https://github.com/rrbanda/ai-demos.git
    targetRevision: main
    path: agents/loan-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: loan-agent
  ignoreDifferences:
    - group: ""
      kind: ServiceAccount
      jsonPointers:
        - /imagePullSecrets
        - /secrets
    - group: route.openshift.io
      kind: Route
      jsonPointers:
        - /spec/host
    - group: bitnami.com
      kind: SealedSecret
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
