# TEMPLATE -- DO NOT APPLY DIRECTLY
# Seal with: kubeseal --format yaml < this-file > overlays/<cluster>/keycloak/sealed-keycloak-credentials.yaml
#
# Contains:
# - Keycloak admin password (auto-generated on first deploy, store for reference)
# - MCP server client secret (from Keycloak admin console after realm creation)
apiVersion: v1
kind: Secret
metadata:
  name: mcp-keycloak-credentials
  namespace: keycloak
type: Opaque
stringData:
  # Keycloak initial admin credentials (operator creates admin user automatically)
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: REPLACE_WITH_GENERATED_PASSWORD
  # MCP server confidential client secret (get from Keycloak admin console > Clients > mcp-server > Credentials)
  MCP_SERVER_CLIENT_SECRET: REPLACE_WITH_CLIENT_SECRET
