# Red Hat Build of Keycloak instance for MCP token exchange.
#
# WARNING: Uses embedded dev-file DB. Realm/client data is LOST on pod restart.
# After any Keycloak pod restart, you must recreate the realm and clients
# via the Keycloak admin API (see setup docs).
# For production: switch to PostgreSQL (spec.db.vendor: postgres) with a
# PersistentVolumeClaim or external database.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: mcp-keycloak
  namespace: keycloak
spec:
  instances: 1
  db:
    vendor: dev-file
  http:
    httpEnabled: true
  hostname:
    strict: false
  proxy:
    headers: xforwarded
  ingress:
    enabled: true
