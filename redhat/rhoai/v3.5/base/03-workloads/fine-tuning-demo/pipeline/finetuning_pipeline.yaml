    schemaVersion: 2.1.0
    sdkVersion: kfp-2.16.1
  platformSpec:
    platforms:
      kubernetes:
        deploymentSpec:
          executors:
            exec-data-quality-filter:
              imagePullPolicy: IfNotPresent
            exec-dataset-download:
              imagePullPolicy: IfNotPresent
              secretAsEnv:
              - keyToEnv:
                - envVar: AWS_ACCESS_KEY_ID
                  secretKey: AWS_ACCESS_KEY_ID
                - envVar: AWS_SECRET_ACCESS_KEY
                  secretKey: AWS_SECRET_ACCESS_KEY
                optional: true
                secretName: s3-secret
                secretNameParameter:
                  runtimeValue:
                    constant: s3-secret
              - keyToEnv:
                - envVar: HF_TOKEN
                  secretKey: HF_TOKEN
                optional: true
                secretName: hf-token
                secretNameParameter:
                  runtimeValue:
                    constant: hf-token
            exec-evalhub-evaluator-kserve:
              imagePullPolicy: IfNotPresent
              secretAsEnv:
              - keyToEnv:
                - envVar: HF_TOKEN
                  secretKey: HF_TOKEN
                optional: true
                secretName: hf-token
                secretNameParameter:
                  runtimeValue:
                    constant: hf-token
            exec-holdout-llm-evaluator:
              imagePullPolicy: IfNotPresent
              nodeSelector:
                labels:
                  nvidia.com/gpu.present: 'true'
              secretAsEnv:
              - keyToEnv:
                - envVar: HF_TOKEN
                  secretKey: HF_TOKEN
                optional: true
                secretName: hf-token
                secretNameParameter:
                  runtimeValue:
                    constant: hf-token
              tolerations:
              - effect: NoSchedule
                key: nvidia.com/gpu
                operator: Exists
            exec-kubeflow-model-registry:
              imagePullPolicy: IfNotPresent
            exec-train-model:
              imagePullPolicy: IfNotPresent
              nodeSelector:
                labels:
                  nvidia.com/gpu.present: 'true'
              secretAsEnv:
              - keyToEnv:
                - envVar: KUBERNETES_SERVER_URL
                  secretKey: KUBERNETES_SERVER_URL
                - envVar: KUBERNETES_AUTH_TOKEN
                  secretKey: KUBERNETES_AUTH_TOKEN
                optional: false
                secretName: kubernetes-credentials
                secretNameParameter:
                  runtimeValue:
                    constant: kubernetes-credentials
              - keyToEnv:
                - envVar: OCI_PULL_SECRET_MODEL_DOWNLOAD
                  secretKey: OCI_PULL_SECRET_MODEL_DOWNLOAD
                optional: true
                secretName: oci-pull-secret-model-download
                secretNameParameter:
                  runtimeValue:
                    constant: oci-pull-secret-model-download
              - keyToEnv:
                - envVar: HF_TOKEN
                  secretKey: HF_TOKEN
                optional: true
                secretName: hf-token
                secretNameParameter:
                  runtimeValue:
                    constant: hf-token
              tolerations:
              - effect: NoSchedule
                key: nvidia.com/gpu
                operator: Exists
        pipelineConfig:
          workspace:
            kubernetes:
              pvcSpecPatch:
                accessModes:
                - ReadWriteMany
                storageClassName: nfs-csi
            size: 50Gi
