apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-eval-to-ogx
  namespace: rfp-agent
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector:
    matchLabels:
      app: ogx
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rfp-agent-eval
      ports:
        - protocol: TCP
          port: 8321
