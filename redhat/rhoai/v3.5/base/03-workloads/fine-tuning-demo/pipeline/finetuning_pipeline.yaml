apiVersion: pipelines.kubeflow.org/v2beta1
kind: Pipeline
metadata:
  name: finetuning-pipeline
  namespace: fine-tuning-demo
spec:
  description: 7-phase fine-tuning pipeline supporting LoRA, SFT, OSFT, and custom
    techniques. Includes data quality filter, distributed training, benchmark evaluation
    via EvalHub + MLflow, holdout evaluation, and model registry with full provenance.
  displayName: finetuning-pipeline
---
apiVersion: pipelines.kubeflow.org/v2beta1
kind: PipelineVersion
metadata:
  name: v5
  namespace: fine-tuning-demo
spec:
  description: 7-phase fine-tuning pipeline supporting LoRA, SFT, OSFT, and custom
    techniques. Includes data quality filter, distributed training, benchmark evaluation
    via EvalHub + MLflow, holdout evaluation, and model registry with full provenance.
  displayName: v5
  pipelineName: finetuning-pipeline
  pipelineSpec:
    components:
      comp-data-quality-filter:
        executorLabel: exec-data-quality-filter
        inputDefinitions:
          artifacts:
            input_dataset:
              artifactType:
                schemaTitle: system.Dataset
                schemaVersion: 0.0.1
              description: Input dataset artifact from upstream component.
              isOptional: true
          parameters:
            enable_llm_judge:
              defaultValue: false
              description: Enable LLM-based quality scoring (requires endpoint).
              isOptional: true
              parameterType: BOOLEAN
            export_to_pvc:
              defaultValue: true
              description: Whether to save cleaned dataset to PVC.
              isOptional: true
              parameterType: BOOLEAN
            input_pvc_path:
              defaultValue: ''
              description: Path to input JSONL on PVC (alternative to artifact).
              isOptional: true
              parameterType: STRING
            llm_judge_endpoint:
              defaultValue: ''
              description: 'OpenAI-compatible API endpoint for the judge model

                (e.g., http://vllm-judge.namespace.svc.cluster.local:8000/v1).'
              isOptional: true
              parameterType: STRING
            max_repetition_ratio:
              defaultValue: 0.5
              description: Max ratio of repeated words in assistant response.
              isOptional: true
              parameterType: NUMBER_DOUBLE
            min_assistant_tokens:
              defaultValue: 5.0
              description: Minimum word count for assistant response.
              isOptional: true
              parameterType: NUMBER_INTEGER
            min_user_tokens:
              defaultValue: 3.0
              description: Minimum word count for user prompt.
              isOptional: true
              parameterType: NUMBER_INTEGER
            pvc_mount_path:
              defaultValue: ''
              description: PVC mount path for exports.
              isOptional: true
              parameterType: STRING
            shared_log_file:
              defaultValue: pipeline_log.txt
              description: Pipeline log file name.
              isOptional: true
              parameterType: STRING
            similarity_threshold:
              defaultValue: 0.85
              description: Fuzzy dedup threshold (0.0-1.0). Higher = stricter.
              isOptional: true
              parameterType: NUMBER_DOUBLE
        outputDefinitions:
          artifacts:
            output_dataset:
              artifactType:
                schemaTitle: system.Dataset
                schemaVersion: 0.0.1
            output_metrics:
              artifactType:
                schemaTitle: system.Metrics
                schemaVersion: 0.0.1
      comp-dataset-download:
        executorLabel: exec-dataset-download
        inputDefinitions:
          parameters:
            dataset_uri:
              description: Dataset URI (hf://, s3://, https://, pvc:// or absolute
                path)
              parameterType: STRING
            pvc_mount_path:
              description: Path where the shared PVC is mounted
              parameterType: STRING
            shared_log_file:
              defaultValue: pipeline_log.txt
              description: Name of the shared log file
              isOptional: true
              parameterType: STRING
            subset_count:
              defaultValue: 0.0
              description: Number of examples to use (0 = use all)
              isOptional: true
              parameterType: NUMBER_INTEGER
            train_split_ratio:
              defaultValue: 0.9
              description: Train/eval split (0.9 = 90%/10%, 1.0 = no split, all for
                training)
              isOptional: true
              parameterType: NUMBER_DOUBLE
        outputDefinitions:
          artifacts:
            eval_dataset:
              artifactType:
                schemaTitle: system.Dataset
                schemaVersion: 0.0.1
            train_dataset:
              artifactType:
                schemaTitle: system.Dataset
                schemaVersion: 0.0.1
      comp-evalhub-evaluator-kserve:
        executorLabel: exec-evalhub-evaluator-kserve
        inputDefinitions:
          artifacts:
            model_artifact:
              artifactType:
                schemaTitle: system.Model
                schemaVersion: 0.0.1
              description: Model artifact from upstream training step.
              isOptional: true
          parameters:
            base_model_name:
              defaultValue: ''
              description: HF model ID for tokenizer resolution.
              isOptional: true
              parameterType: STRING
            benchmarks:
              defaultValue: []
              description: 'List of benchmark specs [{"provider_id": "...", "id":
                "..."}].'
              isOptional: true
              parameterType: LIST
            collection_id:
              defaultValue: ''
              description: Eval Hub collection ID (alternative to benchmarks list).
              isOptional: true
              parameterType: STRING
            cpu:
              defaultValue: '2'
              description: CPU request/limit for the predictor (e.g. "2").
              isOptional: true
              parameterType: STRING
            evalhub_auth_token:
              defaultValue: ''
              description: Bearer token for Eval Hub auth.
              isOptional: true
              parameterType: STRING
            evalhub_job_name:
              defaultValue: pipeline-eval
              description: Evaluation job name in Eval Hub.
              isOptional: true
              parameterType: STRING
            evalhub_model_name:
              defaultValue: finetuned-model
              description: Display name for the model in Eval Hub.
              isOptional: true
              parameterType: STRING
            evalhub_poll_interval:
              defaultValue: 30.0
              description: Seconds between eval status polls.
              isOptional: true
              parameterType: NUMBER_INTEGER
            evalhub_tenant:
              defaultValue: ''
              description: Eval Hub tenant / namespace header (X-Tenant).
              isOptional: true
              parameterType: STRING
            evalhub_timeout:
              defaultValue: 7200.0
              description: Max seconds to wait for evaluation to complete.
              isOptional: true
              parameterType: NUMBER_INTEGER
            evalhub_url:
              description: Eval Hub API endpoint (empty = skip evaluation).
              parameterType: STRING
            gpu_count:
              defaultValue: 1.0
              description: Number of GPUs for the InferenceService predictor.
              isOptional: true
              parameterType: NUMBER_INTEGER
            isvc_ready_timeout:
              defaultValue: 600.0
              description: Max seconds to wait for InferenceService readiness.
              isOptional: true
              parameterType: NUMBER_INTEGER
            memory:
              defaultValue: 8Gi
              description: Pod memory request/limit for the predictor (e.g. "8Gi",
                "32Gi").
              isOptional: true
              parameterType: STRING
            mlflow_experiment_name:
              defaultValue: ''
              description: MLflow experiment name (non-empty enables MLflow).
              isOptional: true
              parameterType: STRING
            model_path:
              description: Local filesystem path to model directory (if no artifact).
              isOptional: true
              parameterType: STRING
            pvc_mount_path:
              defaultValue: ''
              description: Workspace PVC mount path (triggers KFP PVC mount).
              isOptional: true
              parameterType: STRING
            runtime_image:
              defaultValue: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:ad06abf3bb5235ebb5b2df84cd1b9fd09e823f0ff2eebfc82bb4590275ccfe0b
              description: Container image for the ServingRuntime (RHOAI vLLM default).
              isOptional: true
              parameterType: STRING
            trust_remote_code:
              defaultValue: false
              description: Pass --trust-remote-code to vLLM (enables arbitrary code
                from model repos).
              isOptional: true
              parameterType: BOOLEAN
            verify_tls:
              defaultValue: false
              description: Verify TLS certificates for Eval Hub API calls (False for
                self-signed certs).
              isOptional: true
              parameterType: BOOLEAN
        outputDefinitions:
          artifacts:
            output_metrics:
              artifactType:
                schemaTitle: system.Metrics
                schemaVersion: 0.0.1
            output_results:
              artifactType:
                schemaTitle: system.Artifact
                schemaVersion: 0.0.1
      comp-holdout-llm-evaluator:
        executorLabel: exec-holdout-llm-evaluator
        inputDefinitions:
          artifacts:
            eval_dataset:
              artifactType:
                schemaTitle: system.Dataset
                schemaVersion: 0.0.1
              description: JSONL dataset for custom holdout evaluation.
              isOptional: true
            model_artifact:
              artifactType:
                schemaTitle: system.Model
                schemaVersion: 0.0.1
              description: KFP Model artifact from training step.
              isOptional: true
          parameters:
            batch_size:
              defaultValue: auto
              description: Batch size ("auto" or integer).
              isOptional: true
              parameterType: STRING
            custom_eval_max_tokens:
              defaultValue: 256.0
              description: Max tokens for custom eval generation.
              isOptional: true
              parameterType: NUMBER_INTEGER
            enforce_eager:
              defaultValue: true
              description: Disable CUDA graphs (avoids JIT compilation issues).
              isOptional: true
              parameterType: BOOLEAN
            gen_kwargs:
              defaultValue: {}
              description: Generation kwargs for the model.
              isOptional: true
              parameterType: STRUCT
            limit:
              defaultValue: -1.0
              description: Max examples per task (-1 = all).
              isOptional: true
              parameterType: NUMBER_INTEGER
            log_samples:
              defaultValue: true
              description: Log individual evaluation samples.
              isOptional: true
              parameterType: BOOLEAN
            model_args:
              defaultValue: {}
              description: 'Model init args (e.g. {"dtype": "float16"}).'
              isOptional: true
              parameterType: STRUCT
            model_path:
              description: HF model ID or path. Used if model_artifact is None.
              isOptional: true
              parameterType: STRING
            task_names:
              description: Benchmark task names (e.g. ["arc_easy"]).
              parameterType: LIST
            verbosity:
              defaultValue: INFO
              description: Logging level.
              isOptional: true
              parameterType: STRING
        outputDefinitions:
          artifacts:
            output_metrics:
              artifactType:
                schemaTitle: system.Metrics
                schemaVersion: 0.0.1
            output_results:
              artifactType:
                schemaTitle: system.Artifact
                schemaVersion: 0.0.1
            output_samples:
              artifactType:
                schemaTitle: system.Artifact
                schemaVersion: 0.0.1
      comp-kubeflow-model-registry:
        executorLabel: exec-kubeflow-model-registry
        inputDefinitions:
          artifacts:
            eval_metrics:
              artifactType:
                schemaTitle: system.Metrics
                schemaVersion: 0.0.1
              description: Evaluation metrics from lm-eval.
              isOptional: true
            eval_results:
              artifactType:
                schemaTitle: system.Artifact
                schemaVersion: 0.0.1
              description: Full evaluation results JSON artifact.
              isOptional: true
            input_metrics:
              artifactType:
                schemaTitle: system.Metrics
                schemaVersion: 0.0.1
              description: Training metrics.
              isOptional: true
            input_model:
              artifactType:
                schemaTitle: system.Model
                schemaVersion: 0.0.1
              description: Model artifact from training step.
              isOptional: true
          parameters:
            author:
              defaultValue: pipeline
              description: Author name for the model registration.
              isOptional: true
              parameterType: STRING
            model_description:
              defaultValue: ''
              description: Optional description for the model.
              isOptional: true
              parameterType: STRING
            model_format_name:
              defaultValue: pytorch
              description: Model format name (e.g. "pytorch", "onnx").
              isOptional: true
              parameterType: STRING
            model_format_version:
              defaultValue: '1.0'
              description: Model format version.
              isOptional: true
              parameterType: STRING
            model_name:
              defaultValue: fine-tuned-model
              description: Name for the registered model.
              isOptional: true
              parameterType: STRING
            model_version:
              defaultValue: 1.0.0
              description: Version string for the model (e.g. "1.0.0").
              isOptional: true
              parameterType: STRING
            pvc_mount_path:
              description: PVC mount path for workspace storage.
              parameterType: STRING
            registry_address:
              defaultValue: ''
              description: Model Registry server address (hostname or IP).
              isOptional: true
              parameterType: STRING
            registry_port:
              defaultValue: 8080.0
              description: 'Model Registry server port (default: 8080).'
              isOptional: true
              parameterType: NUMBER_INTEGER
            shared_log_file:
              defaultValue: pipeline_log.txt
              description: Filename for shared pipeline log.
              isOptional: true
              parameterType: STRING
            source_namespace:
              defaultValue: ''
              description: Namespace where pipeline runs (auto-detected if empty).
              isOptional: true
              parameterType: STRING
            source_pipeline_name:
              defaultValue: ''
              description: Name of the source KFP pipeline.
              isOptional: true
              parameterType: STRING
            source_pipeline_run_id:
              defaultValue: ''
              description: Unique ID of the pipeline run.
              isOptional: true
              parameterType: STRING
            source_pipeline_run_name:
              defaultValue: ''
              description: Display name of the pipeline run.
              isOptional: true
              parameterType: STRING
        outputDefinitions:
          parameters:
            Output:
              parameterType: STRING
      comp-train-model:
        executorLabel: exec-train-model
        inputDefinitions:
          artifacts:
            dataset:
              artifactType:
                schemaTitle: system.Dataset
                schemaVersion: 0.0.1
              isOptional: true
          parameters:
            kubernetes_config:
              isOptional: true
              parameterType: TASK_CONFIG
            lora_alpha:
              defaultValue: 32.0
              isOptional: true
              parameterType: NUMBER_INTEGER
            lora_bf16:
              isOptional: true
              parameterType: BOOLEAN
            lora_dropout:
              defaultValue: 0.0
              isOptional: true
              parameterType: NUMBER_DOUBLE
            lora_enable_model_splitting:
              isOptional: true
              parameterType: BOOLEAN
            lora_flash_attention:
              isOptional: true
              parameterType: BOOLEAN
            lora_fp16:
              isOptional: true
              parameterType: BOOLEAN
            lora_gradient_accumulation_steps:
              isOptional: true
              parameterType: NUMBER_INTEGER
            lora_load_in_4bit:
              defaultValue: true
              isOptional: true
              parameterType: BOOLEAN
            lora_load_in_8bit:
              isOptional: true
              parameterType: BOOLEAN
            lora_logging_steps:
              isOptional: true
              parameterType: NUMBER_INTEGER
            lora_micro_batch_size:
              isOptional: true
              parameterType: NUMBER_INTEGER
            lora_r:
              defaultValue: 16.0
              isOptional: true
              parameterType: NUMBER_INTEGER
            lora_sample_packing:
              isOptional: true
              parameterType: BOOLEAN
            lora_save_steps:
              isOptional: true
              parameterType: NUMBER_INTEGER
            lora_save_total_limit:
              isOptional: true
              parameterType: NUMBER_INTEGER
            lora_target_modules:
              defaultValue: ''
              isOptional: true
              parameterType: STRING
            lora_tf32:
              isOptional: true
              parameterType: BOOLEAN
            lora_use_dora:
              isOptional: true
              parameterType: BOOLEAN
            lora_use_rslora:
              isOptional: true
              parameterType: BOOLEAN
            osft_fsdp_sharding_strategy:
              defaultValue: ''
              isOptional: true
              parameterType: STRING
            osft_lr_scheduler_kwargs:
              defaultValue: ''
              isOptional: true
              parameterType: STRING
            osft_memory_efficient_init:
              isOptional: true
              parameterType: BOOLEAN
            osft_save_final_checkpoint:
              isOptional: true
              parameterType: BOOLEAN
            osft_target_patterns:
              defaultValue: ''
              isOptional: true
              parameterType: STRING
            osft_unfreeze_rank_ratio:
              isOptional: true
              parameterType: NUMBER_DOUBLE
            osft_unmask_messages:
              isOptional: true
              parameterType: BOOLEAN
            osft_use_processed_dataset:
              isOptional: true
              parameterType: BOOLEAN
            pvc_path:
              parameterType: STRING
            sft_accelerate_full_state_at_epoch:
              isOptional: true
              parameterType: BOOLEAN
            sft_fsdp_sharding_strategy:
              defaultValue: ''
              isOptional: true
              parameterType: STRING
            sft_save_samples:
              isOptional: true
              parameterType: NUMBER_INTEGER
            technique:
              parameterType: STRING
            training_base_model:
              defaultValue: Qwen/Qwen2.5-1.5B-Instruct
              isOptional: true
              parameterType: STRING
            training_checkpoint_at_epoch:
              isOptional: true
              parameterType: BOOLEAN
            training_data_output_dir:
              isOptional: true
              parameterType: STRING
            training_dataset_type:
              isOptional: true
              parameterType: STRING
            training_effective_batch_size:
              defaultValue: 128.0
              isOptional: true
              parameterType: NUMBER_INTEGER
            training_envs:
              defaultValue: ''
              isOptional: true
              parameterType: STRING
            training_field_input:
              isOptional: true
              parameterType: STRING
            training_field_instruction:
              isOptional: true
              parameterType: STRING
            training_field_messages:
              isOptional: true
              parameterType: STRING
            training_field_output:
              isOptional: true
              parameterType: STRING
            training_learning_rate:
              isOptional: true
              parameterType: NUMBER_DOUBLE
            training_lr_scheduler:
              isOptional: true
              parameterType: STRING
            training_lr_warmup_steps:
              isOptional: true
              parameterType: NUMBER_INTEGER
            training_max_seq_len:
              defaultValue: 8192.0
              isOptional: true
              parameterType: NUMBER_INTEGER
            training_max_tokens_per_gpu:
              defaultValue: 32000.0
              isOptional: true
              parameterType: NUMBER_INTEGER
            training_metadata_annotations:
              defaultValue: ''
              isOptional: true
              parameterType: STRING
            training_metadata_labels:
              defaultValue: ''
              isOptional: true
              parameterType: STRING
            training_num_epochs:
              isOptional: true
              parameterType: NUMBER_INTEGER
            training_resource_cpu_per_worker:
              defaultValue: '4'
              isOptional: true
              parameterType: STRING
            training_resource_gpu_per_worker:
              defaultValue: 1.0
              isOptional: true
              parameterType: NUMBER_INTEGER
            training_resource_memory_per_worker:
              defaultValue: 24Gi
              isOptional: true
              parameterType: STRING
            training_resource_num_procs_per_worker:
              defaultValue: auto
              isOptional: true
              parameterType: STRING
            training_resource_num_workers:
              defaultValue: 1.0
              isOptional: true
              parameterType: NUMBER_INTEGER
            training_runtime:
              defaultValue: training-hub
              isOptional: true
              parameterType: STRING
            training_seed:
              isOptional: true
              parameterType: NUMBER_INTEGER
            training_use_liger:
              isOptional: true
              parameterType: BOOLEAN
        outputDefinitions:
          artifacts:
            output_loss_chart:
              artifactType:
                schemaTitle: system.HTML
                schemaVersion: 0.0.1
            output_metrics:
              artifactType:
                schemaTitle: system.Metrics
                schemaVersion: 0.0.1
            output_model:
              artifactType:
                schemaTitle: system.Model
                schemaVersion: 0.0.1
          parameters:
            Output:
              parameterType: STRING
        taskConfigPassthroughs:
        - field: RESOURCES
        - field: KUBERNETES_TOLERATIONS
        - field: KUBERNETES_NODE_SELECTOR
        - field: KUBERNETES_AFFINITY
        - applyToTask: true
          field: ENV
        - applyToTask: true
          field: KUBERNETES_VOLUMES
    deploymentSpec:
      executors:
        exec-data-quality-filter:
          container:
            args:
            - --executor_input
            - '{{$}}'
            - --function_to_execute
            - data_quality_filter
            command:
            - sh
            - -c
            - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip\
              \ || python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\
              \nPIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location\
              \ 'sdg-hub>=0.7.0,<1.0' 'requests'  &&  python3 -m pip install --quiet\
              \ --no-warn-script-location 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5;\
              \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
            - sh
            - -ec
            - 'program_path=$(mktemp -d)


              printf "%s" "$0" > "$program_path/ephemeral_component.py"

              _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

              '
            - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing\
              \ import *\n\ndef data_quality_filter(\n    output_dataset: dsl.Output[dsl.Dataset],\n\
              \    output_metrics: dsl.Output[dsl.Metrics],\n    input_dataset: dsl.Input[dsl.Dataset]\
              \ = None,\n    input_pvc_path: str = \"\",\n    pvc_mount_path: str\
              \ = \"\",\n    similarity_threshold: float = 0.85,\n    min_assistant_tokens:\
              \ int = 5,\n    min_user_tokens: int = 3,\n    max_repetition_ratio:\
              \ float = 0.5,\n    export_to_pvc: bool = True,\n    shared_log_file:\
              \ str = \"pipeline_log.txt\",\n    # -- Optional LLM Judge for hallucination\
              \ detection --\n    enable_llm_judge: bool = False,\n    llm_judge_endpoint:\
              \ str = \"\",\n):\n    \"\"\"Clean and deduplicate an instruction-tuning\
              \ dataset.\n\n    Performs exact and near-duplicate removal, quality\
              \ scoring, and\n    format validation on chat-format JSONL data. Built\
              \ on the SDG Hub\n    framework (Red Hat supported).\n\n    Optional\
              \ LLM Judge:\n      When enable_llm_judge=True, each example is scored\
              \ by an LLM\n      for answer quality and factual grounding. Requires\
              \ an OpenAI-compatible\n      endpoint (e.g., vLLM on KServe). Examples\
              \ scoring below threshold\n      are flagged or removed. Useful for\
              \ synthetic/generated training data.\n      For expert-curated data,\
              \ leave disabled (default).\n\n    Args:\n        output_dataset: Cleaned\
              \ dataset artifact (JSONL).\n        output_metrics: Quality metrics\
              \ (rows before/after, duplicates found, etc.).\n        input_dataset:\
              \ Input dataset artifact from upstream component.\n        input_pvc_path:\
              \ Path to input JSONL on PVC (alternative to artifact).\n        pvc_mount_path:\
              \ PVC mount path for exports.\n        similarity_threshold: Fuzzy dedup\
              \ threshold (0.0-1.0). Higher = stricter.\n        min_assistant_tokens:\
              \ Minimum word count for assistant response.\n        min_user_tokens:\
              \ Minimum word count for user prompt.\n        max_repetition_ratio:\
              \ Max ratio of repeated words in assistant response.\n        export_to_pvc:\
              \ Whether to save cleaned dataset to PVC.\n        shared_log_file:\
              \ Pipeline log file name.\n        enable_llm_judge: Enable LLM-based\
              \ quality scoring (requires endpoint).\n        llm_judge_endpoint:\
              \ OpenAI-compatible API endpoint for the judge model\n            (e.g.,\
              \ http://vllm-judge.namespace.svc.cluster.local:8000/v1).\n    \"\"\"\
              \n    import hashlib\n    import json\n    import logging\n    import\
              \ os\n    import time\n    from difflib import SequenceMatcher\n\n \
              \   import pandas as pd\n\n    logging.basicConfig(\n        level=logging.INFO,\n\
              \        format=\"%(asctime)s - %(levelname)s - %(message)s\",\n   \
              \ )\n    log = logging.getLogger(\"data_quality\")\n\n    start_time\
              \ = time.time()\n\n    def log_message(msg: str):\n        log.info(msg)\n\
              \        if pvc_mount_path and shared_log_file:\n            log_path\
              \ = os.path.join(pvc_mount_path, shared_log_file)\n            try:\n\
              \                with open(log_path, \"a\") as f:\n                \
              \    f.write(msg + \"\\n\")\n            except OSError:\n         \
              \       pass\n\n    log_message(\"=\" * 60)\n    log_message(\"Data\
              \ Quality Filter \u2014 SDG Hub Framework\")\n    log_message(\"=\"\
              \ * 60)\n\n    # =====================================================================\n\
              \    # Load input data\n    # =====================================================================\n\
              \    if input_dataset and os.path.exists(input_dataset.path):\n    \
              \    log_message(f\"Loading from artifact: {input_dataset.path}\")\n\
              \        data = []\n        with open(input_dataset.path, \"r\") as\
              \ f:\n            for line in f:\n                line = line.strip()\n\
              \                if line:\n                    data.append(json.loads(line))\n\
              \    elif input_pvc_path and os.path.exists(input_pvc_path):\n     \
              \   log_message(f\"Loading from PVC: {input_pvc_path}\")\n        data\
              \ = []\n        with open(input_pvc_path, \"r\") as f:\n           \
              \ for line in f:\n                line = line.strip()\n            \
              \    if line:\n                    data.append(json.loads(line))\n \
              \   else:\n        raise ValueError(\"No input provided. Supply input_dataset\
