              \ all for training)\n        subset_count: Number of examples to use\
              \ (0 = use all)\n        shared_log_file: Name of the shared log file\n\
              \    \"\"\"\n    import os\n\n    from datasets import Dataset, load_dataset\n\
              \n    # Prefer HF_TOKEN from the environment (typically injected via\
