apiVersion: v1
kind: ConfigMap
metadata:
  name: skill-rh-rfp-drafting
  labels:
    app.kubernetes.io/part-of: rfp-agent
    app.kubernetes.io/component: skill
data:
  SKILL.md: |
    # RFP Drafting

    > Generate the proposal response section by section, mirroring the customer's format and marking each section with confidence level. This is Phase 4 of the RFP workflow.

    ## When to Use

    - After strategy is approved and user confirms proceeding
    - User says "draft the response", "generate the proposal", "write the RFP response", "fill the RFI"

    ## RFI mode

    If document job is **RFI / questionnaire**, fill the matrix only:

    | ID | Answer | Citation | Evidence |
    |----|--------|----------|----------|
    | Qn | Yes / Partial / No / HUMAN | `filename.md` | one sentence from that file |

    Rules:

    - Follow `rfi-questionnaire-response-pattern.md`
    - Never `[GROUNDED]` without a filename
    - Do not emit services/technology narrative templates
    - Pricing, legal, unapproved metrics, missing lifecycle → HUMAN
    - Gateway name: **Red Hat AI gateway** (never Praxis, never "Model Serving" as the Praxis replacement)

    Then pause for `rh-accuracy-review`.

    ## General Rules

    1. **Mirror the customer's format** — if the RFP specifies response sections, match them exactly
    2. **One section at a time** — generate sequentially so the user can review/redirect
    3. **Mark every section** with `[AUTO-GENERATED]`, `[SCAFFOLD - NEEDS REVIEW]`, or `[HUMAN INPUT REQUIRED]`
    4. **Cite knowledge sources** — track which knowledge base document powered each section
    5. **No fabrication** — if the knowledge base doesn't support a claim, say so
    6. **Use customer's language** — their terminology, their deliverable IDs
    7. **Verify naming** — use `rh-product-naming` for all Red Hat product references

    ## Writing Standards

    - **Specific over general** — "deploys via Helm chart in under 5 minutes" not "easy to deploy"
    - **Evidence over assertion** — "benchmark showed 87% cache hit rate" not "high performance"
    - **No marketing fluff** — no "industry-leading", "best-in-class", "revolutionary", "seamless"
    - **Traceable claims** — every fact must exist in the knowledge base
    - **Anti-patterns:** never use "unlock", "empower", "cutting-edge", "next-generation"

    ## Output Format

    Default output is Markdown. For final delivery:
    - DOCX: use `pandoc input.md -o output.docx` (pandoc is available in the sandbox)
    - PDF: HTML then `xhtml2pdf` (weasyprint is not installed)

    ---

    ## TEMPLATE: Services RFP Response

    Use when RFP is primarily asking for staffing, delivery, methodology, governance.

    ```markdown
