# Secret template for per-cluster overlay. This file is NOT applied directly.
# Use kubeseal to seal it and commit the SealedSecret instead.
#
# Usage:
#   export COOKIE_SECRET=$(python3 -c "import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
#   export OAUTH2_CLIENT_SECRET="<your-dex-client-secret>"
#
#   oc -n openshell-dashboard create secret generic openshell-dashboard-oauth2 \
#     --from-literal=OAUTH2_PROXY_CLIENT_SECRET="$OAUTH2_CLIENT_SECRET" \
#     --from-literal=OAUTH2_PROXY_COOKIE_SECRET="$COOKIE_SECRET" \
#     --dry-run=client -o yaml | kubeseal -o yaml \
#     > redhat/rhoai/v3.5/overlays/<cluster>/openshell-dashboard-oauth2-sealed.yaml
apiVersion: v1
kind: Secret
metadata:
  name: openshell-dashboard-oauth2
  namespace: openshell-dashboard
  labels:
    app.kubernetes.io/name: openshell-dashboard
    app.kubernetes.io/part-of: openshell
type: Opaque
stringData:
  OAUTH2_PROXY_CLIENT_SECRET: REPLACE_ME
  OAUTH2_PROXY_COOKIE_SECRET: REPLACE_ME
