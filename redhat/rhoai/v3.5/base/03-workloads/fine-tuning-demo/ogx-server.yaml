apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: fine-tuning-ogx
  namespace: fine-tuning-demo
  annotations:
    openshift.io/display-name: "Fine-Tuning SQL Demo Playground"
    openshift.io/description: >-
      OGX server for the GenAI Playground — connects both the base
      Qwen2.5-1.5B model and the LoRA SQL fine-tuned variant for
      side-by-side comparison.
  labels:
    opendatahub.io/dashboard: "true"
    app: ogx
spec:
  distribution:
    name: rh
  overrideConfig:
    key: config.yaml
    name: fine-tuning-ogx-config
  workload:
    replicas: 1
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi
    storage:
      mountPath: /opt/app-root/src/.ogx
      size: 5Gi
