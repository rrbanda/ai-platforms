apiVersion: v1
kind: ConfigMap
metadata:
  name: fine-tuning-ogx-config
  namespace: fine-tuning-demo
  labels:
    ogx.io/watch: "true"
    app: ogx
data:
  config.yaml: |
    version: 2
    image_name: rh
    apis:
      - inference
      - tool_runtime
      - responses
      - vector_io
      - files
      - file_processors
      - interactions
      - messages

    providers:
      files:
        - provider_id: localfs
          provider_type: inline::localfs
          config:
            storage_dir: /opt/app-root/src/.ogx/files
            metadata_store:
              table_name: files_metadata
              backend: sql_default

      file_processors:
        - provider_id: auto
          provider_type: inline::auto
          config: {}
        - provider_id: markitdown
          provider_type: inline::markitdown
          config: {}
        - provider_id: pypdf
          provider_type: inline::pypdf
          config: {}

      inference:
        - provider_id: vllm-sql-finetuned
          provider_type: remote::vllm
          config:
            base_url: ${env.VLLM_SQL_FINETUNED_URL:=}
            max_tokens: 2048
            api_token: ${env.VLLM_API_TOKEN:=fake}
            network:
              tls:
                verify: false
        - provider_id: vllm-base
          provider_type: remote::vllm
          config:
            base_url: ${env.VLLM_BASE_URL:=}
            max_tokens: 2048
            api_token: ${env.VLLM_API_TOKEN:=fake}
            network:
              tls:
                verify: false

      tool_runtime:
        - provider_id: file-search
          provider_type: inline::file-search
          config: {}

      responses:
        - provider_id: builtin
          provider_type: inline::builtin
          config:
            persistence:
              responses:
                table_name: responses
                backend: sql_default

      vector_io:
        - provider_id: faiss
          provider_type: inline::faiss
          config:
            persistence:
              namespace: vector_io
              backend: kv_default

      interactions:
        - provider_id: builtin
          provider_type: inline::builtin
          config:
            store:
              table_name: interactions
              backend: sql_default

      messages:
        - provider_id: builtin
          provider_type: inline::builtin
          config:
            kvstore:
              namespace: message_batches
              backend: kv_default

    storage:
      backends:
        kv_default:
          type: kv_sqlite
          db_path: /opt/app-root/src/.ogx/kvstore.db
        sql_default:
          type: sql_sqlite
          db_path: /opt/app-root/src/.ogx/sql_store.db
      stores:
        metadata:
          namespace: registry
          backend: kv_default
        inference:
          table_name: inference_store
          backend: sql_default
        conversations:
          table_name: openai_conversations
          backend: sql_default
        prompts:
          table_name: prompts
          backend: sql_default
        connectors:
          table_name: connectors
          backend: sql_default
