version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /sbin
    - /etc
    - /var/log
    - /proc
    - /dev/urandom
    - /opt/openshell
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /dev/pts
    - /mnt
    - /run
    - /opt/app-root

landlock:
  compatibility: best_effort

process:
  run_as_user: ""
  run_as_group: ""

network_policies:
  gemini_api:
    name: Gemini API (reasoning LLM)
    endpoints:
      - host: generativelanguage.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  pypi:
    name: Python Package Index (pip install)
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  openshell_gateway:
    name: OpenShell gateway
    endpoints:
      - host: openshell.openshell.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  cluster_dns:
    name: Cluster DNS
    endpoints:
      - host: "172.30.0.10"
        port: 53
      - host: "172.30.0.10"
        port: 5353
    binaries:
      - path: /**

  openshift_mcp:
    name: OpenShift MCP Server
    endpoints:
      - host: openshift-mcp-v2.openshift-mcp-server.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: full
      - host: openshift-mcp-v2.openshift-mcp-server.svc
        port: 8080
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**
