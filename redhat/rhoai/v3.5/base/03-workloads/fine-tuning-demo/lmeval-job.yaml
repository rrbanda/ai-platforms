apiVersion: trustyai.opendatahub.io/v1alpha1
kind: LMEvalJob
metadata:
  name: sql-finetuned-eval
  namespace: fine-tuning-demo
  annotations:
    openshift.io/display-name: "SQL Fine-Tuned Model Evaluation"
    openshift.io/description: >-
      Evaluates the LoRA-fine-tuned Qwen2.5-1.5B-Instruct model using
      lm-evaluation-harness (arc_easy benchmark). Loads base model + adapter
      from the shared PVC. Runs on CPU (1.5B model fits comfortably).
  labels:
    opendatahub.io/dashboard: "true"
spec:
  model: hf
  modelArgs:
    - name: pretrained
      value: Qwen/Qwen2.5-1.5B-Instruct
    - name: peft
      value: /mnt/shared/checkpoints
    - name: dtype
      value: float32
  taskList:
    taskNames:
      - arc_easy
  batchSize: "4"
  limit: "100"
  logSamples: true
  allowOnline: true
  pod:
    container:
      resources:
        limits:
          cpu: "8"
          memory: "16Gi"
        requests:
          cpu: "4"
          memory: "8Gi"
      env:
        - name: HF_HOME
          value: /tmp/hf_cache
      volumeMounts:
        - name: shared-storage
          mountPath: /mnt/shared
    volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: fine-tuning-shared
  outputs:
    pvcName: fine-tuning-shared
