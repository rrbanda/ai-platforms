apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: gemini-external-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Gemini External Access"
    openshift.io/description: "Grants all authenticated users access to all Gemini external models"
spec:
  modelRefs:
    - name: gemini-3.7-flash
      namespace: gemini-external
    - name: gemini-3.5-flash
      namespace: gemini-external
    - name: gemini-3.5-flash-lite
      namespace: gemini-external
    - name: gemini-2.5-flash
      namespace: gemini-external
    - name: gemini-2.5-pro
      namespace: gemini-external
  subjects:
    groups:
      - name: system:authenticated
    users: []
