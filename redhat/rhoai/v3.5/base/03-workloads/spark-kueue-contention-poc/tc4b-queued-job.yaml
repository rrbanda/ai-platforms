# TC-4b: Queued Job — Waits for Quota Release
#
# Purpose: Second half of the quota release & re-admission test.
# Apply AFTER tc4a-large-job is admitted and running.
# This job also needs 5 CPU (1 CPU driver + 2 executors × 2 CPU) but quota
# is exhausted (5 + 5 = 10 > 6 CPU). Kueue holds it Suspended.
# Once tc4a completes and quota is freed, tc4b auto-admits.
#
# Tested: 2026-10-15 on RHOAI 3.5.1 / Spark Operator 2.4.0 / Kueue 1.4.3
# Job B stayed Suspended while Job A was running. Within seconds of Job A
# completing, Job B was automatically admitted and started running.
#
# Expected behavior:
#   - Stays Suspended while tc4a is running
#   - Workload shows ADMITTED=False, pending in spark-lq
#   - When tc4a completes → tc4b auto-admitted within seconds
#   - No manual intervention required
#
# Verification:
#   oc apply -f tc4b-queued-job.yaml
#   oc get sparkapplication tc4-job-b -w
#   oc get workload -w   # Watch for ADMITTED transition
#
# After TC-4, restore spark-cq quota to 25 CPU:
#   oc patch clusterqueue spark-cq --type merge \
#     -p '{"spec":{"resourceGroups":[{"coveredResources":["cpu","memory"],"flavors":[{"name":"default-flavor","resources":[{"name":"cpu","nominalQuota":"25"},{"name":"memory","nominalQuota":"32Gi"}]}]}]}}'
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: tc4-job-b
  labels:
    app: spark-contention-poc
    poc/test-case: tc4-quota-release
    kueue.x-k8s.io/queue-name: spark-lq
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  sparkVersion: "4.0.1"
  image: quay.io/opendatahub/data-processing:Spark-v4.0.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py
  sparkConf:
    spark.executor.instances: "2"
  arguments:
    - "1000"
  driver:
    cores: 1
    memory: 512m
    serviceAccount: spark-operator-spark
    securityContext: {}
  executor:
    instances: 2
    cores: 2
    memory: 512m
    securityContext: {}
  restartPolicy:
    type: Never
