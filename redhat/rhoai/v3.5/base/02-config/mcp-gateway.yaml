apiVersion: v1
kind: Namespace
metadata:
  name: mcp-system
  annotations:
    openshift.io/display-name: "MCP Gateway"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-gateway
  namespace: mcp-system
  annotations:
    security.opendatahub.io/authorino-tls-bootstrap: "true"
spec:
  gatewayClassName: openshift-ai-inference
  listeners:
    - name: mcp
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: mcps
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
# Alias service: MCP Gateway controller hardcodes "-istio" suffix for
# internal broker-to-gateway connectivity, but openshift-ai-inference class
# creates a service named "<gw>-openshift-ai-inference".
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway-istio
  namespace: mcp-system
spec:
  selector:
    gateway.networking.k8s.io/gateway-name: mcp-gateway
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-mcp-gateway
  namespace: mcp-system
spec:
  from:
    - group: mcp.kuadrant.io
      kind: MCPGatewayExtension
      namespace: openshift-operators
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: openshift-operators
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: ocp-mcp-server
    - group: kuadrant.io
      kind: AuthPolicy
      namespace: mcp-system
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
