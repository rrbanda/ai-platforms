version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /sbin
    - /etc
    - /var/log
    - /proc
    - /dev/urandom
    - /opt/openshell
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /dev/pts
    - /mnt
    - /run
    - /opt/app-root

landlock:
  compatibility: best_effort

process:
  run_as_user: ""
  run_as_group: ""

network_policies:
  gemini_api:
    name: Gemini API (reasoning LLM)
    endpoints:
      - host: generativelanguage.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  pypi:
    name: Python Package Index (pip install)
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  npm:
    name: npm registry (GitHub MCP via npx)
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  openshell_gateway:
    name: OpenShell gateway
    endpoints:
      - host: openshell.openshell.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  cluster_dns:
    name: Cluster DNS
    endpoints:
      - host: "172.30.0.10"
        port: 53
      - host: "172.30.0.10"
        port: 5353
    binaries:
      - path: /**

  openshift_mcp:
    name: OpenShift MCP Server
    endpoints:
      - host: openshift-mcp-v2.openshift-mcp-server.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: full
      - host: openshift-mcp-v2.openshift-mcp-server.svc
        port: 8080
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  rhoai_mcp:
    name: RHOAI MCP Server
    endpoints:
      - host: rhoai-mcp.rhoai-copilot.svc.cluster.local
        port: 8000
        protocol: rest
        enforcement: enforce
        access: full
      - host: rhoai-mcp.rhoai-copilot.svc
        port: 8000
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  mlflow_mcp:
    name: MLflow MCP Server
    endpoints:
      - host: mlflow-mcp.redhat-ods-applications.svc.cluster.local
        port: 8080
        protocol: rest
        enforcement: enforce
        access: full
      - host: mlflow-mcp.redhat-ods-applications.svc
        port: 8080
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  argocd:
    name: OpenShift GitOps (ArgoCD MCP)
    endpoints:
      - host: openshift-gitops-server.openshift-gitops.svc.cluster.local
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: openshift-gitops-server.openshift-gitops.svc
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  github:
    name: GitHub API (GitHub MCP)
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**

  redhat_docs:
    name: Red Hat documentation
    endpoints:
      - host: docs.redhat.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: access.redhat.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /**
