apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-openshell-dashboard
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: rhoai-platform
  source:
    repoURL: https://github.com/rrbanda/ai-platforms.git
    targetRevision: main
    path: redhat/rhoai/v3.5/base/09-openshell-dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: openshell-dashboard
  ignoreDifferences:
    - group: route.openshift.io
      kind: Route
      jsonPointers:
        - /spec/host
        - /metadata/annotations
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
