    ---

    ## Section Generation Process

    For each section:
    1. Search knowledge base with `rh-knowledge-retrieval` for relevant content
    2. Check `rh-product-naming` for all product references
    3. Generate section using retrieved content
    4. Mark with confidence level
    5. Present to user for review before moving to next section

    ## Next Phase

    After all sections are drafted, proceed with `rh-rfp-review` for accuracy verification.
