# ImageSetConfiguration for mirroring RHOAI v3.4 + all dependencies to a disconnected registry.
#
# Usage:
#   1. Copy this file and replace placeholder values:
#      - REPLACE_OCP_VERSION  → your OCP version (e.g., v4.19)
#      - REPLACE_MIRROR_REGISTRY → your mirror registry (e.g., mirror.example.com:5000)
#   2. Run: oc-mirror --config imageset-config.yaml docker://<mirror-registry> --v2
#   3. Apply the generated CatalogSource + IDMS/ITMS manifests to the cluster
#   4. Update the disconnected overlay and Helm values with the generated catalog name
#
# Image lists are maintained in the images/ directory alongside this file.
# See all-images.txt for the complete set of additional images included below.
apiVersion: mirror.openshift.io/v2alpha1
kind: ImageSetConfiguration
storageConfig:
  # Target mirror registry — replace with your actual registry endpoint
  registry:
    imageURL: REPLACE_MIRROR_REGISTRY/metadata
    skipTLS: false
mirror:
  # ---------------------------------------------------------------------------
  # Operator catalogs
  # ---------------------------------------------------------------------------
  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:REPLACE_OCP_VERSION
      packages:
        # --- Core RHOAI stack ---

        # Service Mesh 3.x (pre-requisite for serving runtimes and MCP Gateway)
        - name: servicemeshoperator3
          channels:
            - name: stable

        # RHOAI operator — pinned to the v3.4 release channel
        - name: rhods-operator
          channels:
            - name: stable-3.4

        # --- RHOAI managed dependencies ---

        # TLS certificate management for internal services
        - name: openshift-cert-manager-operator
          channels:
            - name: stable-v1

        # Red Hat Connectivity Link for API management
        - name: rhcl-operator
          channels:
            - name: stable

        # Distributed training operators
        - name: leader-worker-set
          channels:
            - name: stable-v1.0
        - name: job-set
          channels:
            - name: stable-v1.0

        # Workload queueing and fair-sharing
        - name: kueue-operator
          channels:
            - name: stable-v1.2

        # Autoscaling for inference endpoints
        - name: openshift-custom-metrics-autoscaler-operator
          channels:
            - name: stable

        # --- Observability stack (optional, for monitoring) ---

        - name: cluster-observability-operator
          channels:
            - name: stable
        - name: opentelemetry-product
          channels:
            - name: stable
        - name: tempo-product
          channels:
            - name: stable

        # --- GPU support (optional, for accelerated workloads) ---

        # Node Feature Discovery for GPU/accelerator detection
        - name: nfd
          channels:
            - name: stable

        # --- MCP Gateway (preview) ---

        - name: mcp-gateway
          channels:
            - name: preview

        # --- GitOps (for deployment automation) ---

        - name: openshift-gitops-operator
          channels:
            - name: latest

    # Certified operators from the certified-operator-index
    - catalog: registry.redhat.io/redhat/certified-operator-index:REPLACE_OCP_VERSION
      packages:
        # NVIDIA GPU Operator for GPU node provisioning
        - name: gpu-operator-certified
          channels:
            - name: v25.10

        # Sealed Secrets for GitOps-friendly secret management
        - name: sealed-secrets-operator-helm
          channels:
            - name: stable

  # ---------------------------------------------------------------------------
  # Additional images not shipped via operator catalogs
  # These include RHOAI workbench/notebook images, Ray, fine-tuning images,
  # and workload infrastructure (Milvus, etcd, MinIO, PostgreSQL).
  # ---------------------------------------------------------------------------
  additionalImages:
    # --- RHOAI operator images (from rhoai-disconnected-install-helper) ---
    - name: quay.io/modh/fms-hf-tuning@sha256:83f70e981657728ef9929fa50d06fe5c72f364e5ed41a9fc1331e99751f610e8
