apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: evalhub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: registry.redhat.io/rhel9/postgresql-15:latest
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRESQL_USER
          value: evalhub
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: evalhub-db-password
              key: password
        - name: POSTGRESQL_DATABASE
          value: evalhub
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/pgsql/data
      volumes:
      - name: pgdata
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: evalhub
spec:
  selector:
    app: postgresql
  ports:
  - port: 5432
    targetPort: 5432
