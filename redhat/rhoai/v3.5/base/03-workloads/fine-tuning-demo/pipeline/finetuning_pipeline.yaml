              \            \"bigcode/the-stack-dedup-python\" -> (\"bigcode/the-stack-dedup-python\"\
              , None)\n        \"\"\"\n        if \":\" in dataset_path:\n       \
              \     base, cfg = dataset_path.split(\":\", 1)\n            return base,\
              \ (cfg or None)\n        return dataset_path, None\n\n    def download_from_huggingface(dataset_path:\
              \ str) -> Dataset:\n        \"\"\"Download dataset from HuggingFace.\"\
              \"\"\n        ds_id, ds_config = split_hf_id_and_config(dataset_path)\n\
              \        if ds_config:\n            log_message(f\"Downloading from\
