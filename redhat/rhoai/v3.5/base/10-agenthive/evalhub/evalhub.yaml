apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalhub
  namespace: evalhub
  labels:
    app: eval-hub
    component: api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-hub
  template:
    metadata:
      labels:
        app: eval-hub
        component: api
    spec:
      serviceAccountName: default
      containers:
      - name: evalhub
        image: registry.redhat.io/rhoai/odh-eval-hub-rhel9@sha256:0ffb37f52af20cf4e7fbfb0301bb015a295d9c0d8b4fa7775db57288bd5bf51c
        imagePullPolicy: IfNotPresent
        ports:
        - name: evalhub
          containerPort: 8444
          protocol: TCP
        - name: metrics
          containerPort: 8081
          protocol: TCP
        env:
        - name: API_HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8444"
        - name: DB_DRIVER
          value: "pgx"
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: evalhub-db-credentials
              key: db-url
        - name: DB_MAX_OPEN_CONNS
          value: "25"
        - name: DB_MAX_IDLE_CONNS
          value: "5"
        - name: MLFLOW_TRACKING_URI
          value: "https://mlflow.redhat-ods-applications.svc.cluster.local:8443/mlflow"
        - name: MLFLOW_TOKEN_PATH
          value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
        - name: MLFLOW_INSECURE_SKIP_VERIFY
          value: "true"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: evalhub-llm-judge
              key: api-key
        - name: OPENAI_BASE_URL
          value: "https://generativelanguage.googleapis.com/v1beta/openai/"
        - name: LOG_LEVEL
          value: "INFO"
        - name: SERVICE_URL
          value: "http://evalhub.evalhub.svc.cluster.local:8444"
        - name: EVALHUB_INSTANCE_NAME
          value: "evalhub"
        - name: PROVIDERS_DIR
          value: "/app/config/providers"
        - name: COLLECTIONS_DIR
          value: "/app/config/collections"
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8444
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8444
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: providers
          mountPath: /app/config/providers
          readOnly: true
        - name: collections
          mountPath: /app/config/collections
          readOnly: true
        - name: db-secret
          mountPath: /etc/evalhub/secrets
          readOnly: true
        - name: work
          mountPath: /opt/evalhub/work
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: evalhub-config
      - name: providers
        projected:
          sources:
          - configMap:
              name: evalhub-provider-ragas
          - configMap:
              name: evalhub-provider-deepeval
      - name: collections
        projected:
          sources:
          - configMap:
              name: evalhub-collection-rfp-agent
      - name: db-secret
        secret:
          secretName: evalhub-db-credentials
      - name: work
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: evalhub
  namespace: evalhub
  labels:
    app: eval-hub
spec:
  selector:
    app: eval-hub
  ports:
  - name: api
    port: 8444
    targetPort: 8444
    protocol: TCP
  - name: metrics
    port: 8081
    targetPort: 8081
    protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: evalhub
  namespace: evalhub
  labels:
    app: eval-hub
spec:
  to:
    kind: Service
    name: evalhub
  port:
    targetPort: api
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
