apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: amortized
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: rhoai-workloads
  source:
    repoURL: https://github.com/rrbanda/ai-platforms.git
    targetRevision: main
    path: redhat/rhoai/v3.5/overlays/sandbox1388/amortized
  destination:
    server: https://kubernetes.default.svc
  ignoreDifferences:
    # K8s normalizes volumeClaimTemplates with extra fields; ignore to avoid
    # perpetual OutOfSync on the postgres StatefulSet.
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
