# TC-2: Kueue Admission Blocking
#
# Purpose: Demonstrate Kueue prevents the "half-admitted" state.
# Same resource request as TC-1 (10 CPU total) but WITH the Kueue queue label.
# Kueue calculates the total resource demand and compares against ClusterQueue quota (4 CPU).
# Since 10 > 4, the job stays Suspended — zero pods are created.
#
# Expected behavior:
#   - SparkApplication stays in Suspended state
#   - Zero Driver/Executor pods are created
#   - Kueue creates a Workload object with ADMITTED=False
#   - No resource waste — nothing is scheduled until quota is available
#
# Verification:
#   oc get sparkapplication tc2-kueue-admission-blocking -w
#   oc get workload -l kueue.x-k8s.io/queue-name=contention-lq
#   oc get pods -l sparkoperator.k8s.io/app-name=tc2-kueue-admission-blocking
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: tc2-kueue-admission-blocking
  labels:
    app: spark-contention-poc
    poc/test-case: tc2-admission-blocking
    kueue.x-k8s.io/queue-name: contention-lq
spec:
  type: Scala
  mode: cluster
  image: quay.io/opendatahub/data-processing:Spark-v4.0.1
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples.jar
  arguments: ["10000"]
  sparkVersion: "4.0.1"
  timeToLiveSeconds: 600
  restartPolicy:
    type: Never
  driver:
    cores: 2
    memory: "1024m"
    serviceAccount: spark-operator-spark
    securityContext: {}
  executor:
    cores: 2
    instances: 4
    memory: "1024m"
    securityContext: {}
