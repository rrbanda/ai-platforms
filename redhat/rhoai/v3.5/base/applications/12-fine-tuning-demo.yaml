apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fine-tuning-demo
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: rhoai-workloads
  source:
    repoURL: https://github.com/rrbanda/ai-platforms.git
    targetRevision: main
    path: redhat/rhoai/v3.5/base/03-workloads/fine-tuning-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: fine-tuning-demo
  ignoreDifferences:
    - group: kubeflow.org
      kind: Notebook
      jqPathExpressions:
        - .spec.template.spec.containers[].resources
        - .spec.template.spec.volumes[]?.persistentVolumeClaim
        - .metadata.annotations["notebooks.opendatahub.io/last-image-selection"]
        - .metadata.annotations["notebooks.opendatahub.io/last-size-selection"]
    - group: serving.kserve.io
      kind: LLMInferenceService
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
