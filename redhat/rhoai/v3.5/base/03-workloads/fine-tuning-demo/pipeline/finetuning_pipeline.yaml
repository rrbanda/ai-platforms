deploymentSpec:
  executors:
    exec-dataset-download:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - dataset_download
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'datasets>=2.14.0'\
          \ 'huggingface-hub>=0.20.0' 's3fs>=2023.1.0'  &&  python3 -m pip install\
          \ --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef dataset_download(\n    train_dataset: dsl.Output[dsl.Dataset],\n\
          \    eval_dataset: dsl.Output[dsl.Dataset],\n    dataset_uri: str,\n   \
          \ pvc_mount_path: str,\n    train_split_ratio: float = 0.9,  # 1.0 = no\
          \ eval split (all data for training)\n    subset_count: int = 0,\n    shared_log_file:\
          \ str = \"pipeline_log.txt\",\n):\n    \"\"\"Download and prepare datasets\
          \ from multiple sources.\n\n    Validates that datasets follow chat template\
          \ format (messages/conversations with role/content).\n\n    Args:\n    \
          \    train_dataset: Output artifact for training dataset (JSONL format)\n\
          \        eval_dataset: Output artifact for evaluation dataset (JSONL format)\n\
          \        dataset_uri: Dataset URI (hf://, s3://, https://, pvc:// or absolute\
          \ path)\n        pvc_mount_path: Path where the shared PVC is mounted\n\
          \        train_split_ratio: Train/eval split (0.9 = 90%/10%, 1.0 = no split,\
          \ all for training)\n        subset_count: Number of examples to use (0\
          \ = use all)\n        shared_log_file: Name of the shared log file\n   \
          \ \"\"\"\n    import os\n\n    from datasets import Dataset, load_dataset\n\
          \n    # Prefer HF_TOKEN from the environment (typically injected via the\
          \ `hf-token` Kubernetes secret).\n    # This keeps authentication configuration\
          \ in Kubernetes secrets instead of pipeline parameters.\n    hf_token =\
          \ (os.environ.get(\"HF_TOKEN\") or \"\").strip()\n\n    def log_message(msg:\
          \ str):\n        \"\"\"Log message to console and shared log file.\"\"\"\
          \n        print(msg)\n        log_path = os.path.join(pvc_mount_path, shared_log_file)\n\
          \        with open(log_path, \"a\") as f:\n            f.write(msg + \"\\\
          n\")\n\n    def parse_uri(uri: str) -> tuple[str, str]:\n        \"\"\"\
          Parse dataset URI to determine source type and path.\n\n        Args:\n\
          \            uri: Dataset URI with scheme. Supported formats:\n        \
          \        - HuggingFace: hf://dataset-name or dataset-name\n            \
          \    - S3/MinIO: s3://bucket/path/to/file.jsonl\n                - HTTP/HTTPS:\
          \ http://... or https://... (e.g., MinIO shared links)\n               \
          \ - Local/PVC: pvc://path/to/file.jsonl or /absolute/path/to/file.jsonl\n\
          \n        Returns:\n            Tuple of (source_type, path) where source_type\
          \ is 'hf', 's3', 'http', or 'local'\n        \"\"\"\n        uri = uri.strip()\n\
          \n        # Check for explicit schemes\n        if uri.startswith(\"http://\"\
          ) or uri.startswith(\"https://\"):\n            return (\"http\", uri)\n\
          \        elif uri.startswith(\"hf://\"):\n            return (\"hf\", uri[5:])\n\
          \        elif uri.startswith(\"s3://\"):\n            return (\"s3\", uri[5:])\n\
          \        elif uri.startswith(\"pvc://\"):\n            return (\"local\"\
          , uri[6:])\n        elif uri.startswith(\"/\"):\n            return (\"\
          local\", uri)\n        else:\n            # Default to HuggingFace if no\
          \ scheme\n            return (\"hf\", uri)\n\n    def validate_chat_format_dataset(dataset:\
          \ Dataset) -> bool:\n        \"\"\"Validate that dataset follows chat template\
          \ format.\n\n        Expected format:\n        - Each entry should have\
          \ 'messages' or 'conversations' field\n        - Messages should be a list\
          \ of dicts with 'role' and 'content'\n        - Roles should be from: 'system',\
