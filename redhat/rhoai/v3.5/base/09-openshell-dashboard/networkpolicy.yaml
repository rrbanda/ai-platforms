# Restrict dashboard pod traffic: allow ingress only from the OpenShift router
# and egress only to the OpenShell gateway in the openshell namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openshell-dashboard
  namespace: openshell-dashboard
  labels:
    app.kubernetes.io/name: openshell-dashboard
    app.kubernetes.io/part-of: openshell
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openshell-dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from OpenShift router (edge-terminated TLS)
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - port: 4180
          protocol: TCP
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow BFF -> OpenShell gateway (gRPC)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshell
      ports:
        - port: 50051
          protocol: TCP
    # Allow oauth2-proxy -> IdP (HTTPS on 443 or Keycloak internal 8443)
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
          protocol: TCP
        - port: 8443
          protocol: TCP
        - port: 5556
          protocol: TCP
