name: "CD: Manual Deploy / Rollback"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g., sha-abc1234 or v1.2.0)"
        required: true
        type: string
      overlay:
        description: "Target overlay"
        required: true
        default: dev
        type: choice
        options:
          - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: ${{ inputs.overlay }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | \
            tar xz -C /usr/local/bin

      - name: Pin image tag in agent directory
        working-directory: redhat/rhoai/v3.5/base/03-workloads/agents/rfp-agent
        run: |
          kustomize edit set image \
            ghcr.io/${{ github.repository_owner }}/rfp-agent=ghcr.io/${{ github.repository_owner }}/rfp-agent:${{ inputs.image_tag }}

      - name: Validate kustomize
        run: |
          kustomize build redhat/rhoai/v3.5/base/03-workloads/agents/rfp-agent > /dev/null

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add redhat/rhoai/v3.5/base/03-workloads/agents/rfp-agent/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "cd: deploy rfp-agent:${{ inputs.image_tag }} to ${{ inputs.overlay }}"
            git pull --rebase origin main
            git push
          fi

      - name: Summary
        run: |
          echo "### CD: Manual Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`ghcr.io/${{ github.repository_owner }}/rfp-agent:${{ inputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Overlay: \`${{ inputs.overlay }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggered by: @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ArgoCD will auto-sync from the updated manifests" >> "$GITHUB_STEP_SUMMARY"
