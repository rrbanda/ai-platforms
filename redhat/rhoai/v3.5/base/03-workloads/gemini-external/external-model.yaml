apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: gemini-3-7-flash
  namespace: gemini-external
  annotations:
    openshift.io/display-name: "Gemini 3.7 Flash"
    openshift.io/description: >-
      Google's newest and most intelligent model. Combines frontier intelligence
      with superior search, grounding, and agentic capabilities.
spec:
  provider: openai
  endpoint: generativelanguage.googleapis.com
  targetModel: gemini-3.7-flash
  credentialRef:
    name: gemini-api-key
