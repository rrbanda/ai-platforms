repos:
  # Gitleaks: scan for secrets, tokens, and credentials before commit
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: 'helm-deploy/chart/templates/.*'
      - id: check-merge-conflict
      - id: detect-private-key

  # Red Hat InfoSec rh-pre-commit (requires Red Hat VPN)
  # Uncomment below if you have rh-pre-commit installed via:
  #   cd ~/Downloads/tools-main/rh-pre-commit && make install
  #
  # - repo: https://gitlab.cee.redhat.com/infosec-public/developer-workbench/tools.git
  #   rev: rh-pre-commit-2.3.2
  #   hooks:
  #     - id: rh-pre-commit
  #     - id: rh-pre-commit.commit-msg
