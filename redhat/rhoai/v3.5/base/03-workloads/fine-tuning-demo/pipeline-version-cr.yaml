              lr_scheduler:
                defaultValue: cosine
                isOptional: true
                parameterType: STRING
              max_seq_len:
                defaultValue: 8192.0
                isOptional: true
                parameterType: NUMBER_INTEGER
              max_tokens_per_gpu:
                defaultValue: 32000.0
                isOptional: true
                parameterType: NUMBER_INTEGER
              memory_per_worker:
                defaultValue: 32Gi
                isOptional: true
                parameterType: STRING
              mlflow_experiment:
                defaultValue: finetuning-experiments
                isOptional: true
