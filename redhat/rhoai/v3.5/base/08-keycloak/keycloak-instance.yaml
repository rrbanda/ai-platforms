# Red Hat Build of Keycloak instance for MCP token exchange.
# Uses embedded dev-file DB (suitable for single-instance hub).
# For production, use PostgreSQL (spec.db.vendor: postgres).
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: mcp-keycloak
  namespace: keycloak
spec:
  instances: 1
  db:
    vendor: dev-file
  http:
    httpEnabled: true
  hostname:
    strict: false
  proxy:
    headers: xforwarded
  ingress:
    enabled: true
