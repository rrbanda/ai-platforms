apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen3-llmd
  namespace: llm-d-demo
  annotations:
    openshift.io/display-name: "Qwen3-0.6B — llm-d Distributed Inference"
    openshift.io/description: >-
      Two-replica deployment of Qwen3-0.6B using llm-d distributed inference
      with prefix-cache-aware routing via the Endpoint Picker (EPP) scheduler.
      Used for demonstrating KV-cache-aware scheduling, observability dashboards,
      and intelligent multi-replica routing.
    opendatahub.io/model-type: generative
    security.opendatahub.io/enable-auth: "false"
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
spec:
  model:
    name: Qwen/Qwen3-0.6B
    uri: hf://Qwen/Qwen3-0.6B
  replicas: 2
  router:
    route: {}
    gateway: {}
    scheduler: {}
  template:
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A10G
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
    containers:
      - name: main
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:ba060ec145e1b7ac3a3b25b89fc75f7d146746156990ff5858235eaa9d158e32
        command:
          - python
          - -m
          - vllm.entrypoints.openai.api_server
        args:
          - "--served-model-name={{.Name}}"
          - --model=/mnt/models
          - --enable-ssl-refresh
          - --ssl-certfile=/var/run/kserve/tls/tls.crt
          - --ssl-keyfile=/var/run/kserve/tls/tls.key
          - --enable-force-include-usage
          - --max-model-len=4096
          - --dtype=float16
          - --gpu-memory-utilization=0.85
          - --enable-prefix-caching
        env:
          - name: HF_HOME
            value: /tmp/hf_home
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 15
          failureThreshold: 30
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
