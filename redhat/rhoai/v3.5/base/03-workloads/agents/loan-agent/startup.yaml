apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-agent-startup
  labels:
    app.kubernetes.io/part-of: loan-agent
data:
  startup.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    mkdir -p /app/data
    cd /app

    exec /opt/app-root/bin/uvicorn server:app \
      --host 0.0.0.0 \
      --port 8080 \
      --log-level info
