apiVersion: v1
kind: Namespace
metadata:
  name: mcp-system
  annotations:
    openshift.io/display-name: "MCP Gateway"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-gateway
  namespace: mcp-system
spec:
  gatewayClassName: openshift-ai-inference
  listeners:
    - name: mcp
      port: 8001
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: mcps
      hostname: "*.mcp.local"
      port: 8002
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-mcp-gateway-extension
  namespace: mcp-system
spec:
  from:
    - group: mcp.kuadrant.io
      kind: MCPGatewayExtension
      namespace: mcp-gateway-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: mcp-gateway-system
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
