# TC-3 Overflow: Second job to apply AFTER tc3-gang-scheduling is running
# (if you raised CQ quota to let tc3-gang-scheduling through).
#
# Alternative TC-3 variant: If you increase spark-cq quota to 33+ CPU so
# tc3-gang-scheduling runs, apply this overflow job to prove Kueue blocks
# the second job rather than partially admitting it.
#
# With the default 25 CPU quota, tc3-gang-scheduling itself already stays
# Suspended (proving gang scheduling), so this overflow file is optional.
#
# Expected behavior:
#   - SparkApplication stays Suspended
#   - Zero pods created
#   - Once tc3-gang-scheduling completes and quota is released, this job is admitted
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: tc3-gang-overflow
  labels:
    app: spark-contention-poc
    poc/test-case: tc3-gang-overflow
    kueue.x-k8s.io/queue-name: spark-lq
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  sparkVersion: "4.0.1"
  image: quay.io/opendatahub/data-processing:Spark-v4.0.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py
  sparkConf:
    spark.executor.instances: "4"
  driver:
    cores: 1
    coreRequest: "1"
    memory: 512m
    serviceAccount: spark-operator-spark
    securityContext: {}
  executor:
    instances: 4
    cores: 8
    coreRequest: "8"
    memory: 1g
    securityContext: {}
  restartPolicy:
    type: Never
