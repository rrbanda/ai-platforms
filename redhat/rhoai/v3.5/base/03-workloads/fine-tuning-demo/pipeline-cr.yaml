apiVersion: pipelines.kubeflow.org/v2beta1
kind: Pipeline
metadata:
  name: finetuning-pipeline
  namespace: fine-tuning-demo
spec:
  description: 7-phase fine-tuning pipeline supporting LoRA, SFT, OSFT, and custom techniques. Includes data quality filter
    (dedup + quality scoring), model pre-caching, distributed training, benchmark evaluation with safety benchmarks via EvalHub
    + MLflow, holdout evaluation, and model registry with full provenance.
  displayName: finetuning-pipeline
