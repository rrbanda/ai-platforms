apiVersion: batch/v1
kind: Job
metadata:
  name: corpus-ingest
  namespace: rfp-agent
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: openshell-sandbox
      initContainers:
      - name: git-clone
        image: registry.access.redhat.com/ubi9/python-311:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          CLONE_URL=$(echo "$REPO_URL" | sed "s|https://|https://x-access-token:${GITHUB_TOKEN}@|")
          git clone --depth 1 --single-branch --branch "$REPO_BRANCH" "$CLONE_URL" /workspace/repo
        env:
        - name: REPO_URL
          value: "https://github.com/rrbanda/ai-platforms.git"
        - name: REPO_BRANCH
          value: "main"
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: git-clone-github
              key: token
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      containers:
      - name: ingest
        image: registry.access.redhat.com/ubi9/python-311:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -euo pipefail
          pip install --quiet openai boto3

          cd /workspace/repo

          echo "=== Wait for OGX ==="
          python3 - <<'WAIT_OGX'
          import os, time, urllib.request, urllib.error
          url = os.environ["OGX_SERVICE_URL"].rstrip("/") + "/v1/models"
          deadline = time.time() + 300
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=5) as resp:
                      if resp.status == 200:
                          print(f"OGX ready: {url}")
                          raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print(f"waiting for OGX {url}: {exc}")
              time.sleep(5)
          raise SystemExit(f"OGX not ready after 300s: {url}")
          WAIT_OGX

          echo "=== Step 1: Upload corpus to MinIO for AutoRAG ==="
          python3 - <<'UPLOAD_SCRIPT'
          import boto3, os
          from pathlib import Path
          from botocore.client import Config

          s3 = boto3.client('s3',
              endpoint_url=os.environ['MINIO_ENDPOINT'],
              aws_access_key_id=os.environ['MINIO_ACCESS_KEY'],
              aws_secret_access_key=os.environ['MINIO_SECRET_KEY'],
              region_name='us-east-1',
              config=Config(signature_version='s3v4'))

          bucket = os.environ['MINIO_BUCKET']
          try:
              s3.head_bucket(Bucket=bucket)
          except:
              s3.create_bucket(Bucket=bucket)
              print(f"Created bucket: {bucket}")

          corpus = Path('agents/rfp-agent/corpus')
          deleted = 0
          paginator = s3.get_paginator('list_objects_v2')
          for page in paginator.paginate(Bucket=bucket, Prefix='input_data/'):
              for obj in page.get('Contents') or []:
                  s3.delete_object(Bucket=bucket, Key=obj['Key'])
                  deleted += 1
          if deleted:
              print(f"Cleared {deleted} existing input_data objects")

          uploaded = 0
          for f in sorted(corpus.rglob('*.md')):
              if f.name == 'README.md' or f.name.startswith('._'):
                  continue
              key = f'input_data/{f.relative_to(corpus)}'
              s3.upload_file(str(f), bucket, key)
              uploaded += 1

          bench = corpus / 'test-data' / 'benchmark_data.json'
          if bench.exists():
              s3.upload_file(str(bench), bucket, 'benchmark_data.json')
              print(f"Uploaded benchmark_data.json")

          bench_rhoai = corpus / 'test-data' / 'benchmark_rhoai.json'
          if bench_rhoai.exists():
              s3.upload_file(str(bench_rhoai), bucket, 'benchmark_rhoai.json')
              print(f"Uploaded benchmark_rhoai.json")

          print(f"Uploaded {uploaded} corpus files to s3://{bucket}/input_data/")
          UPLOAD_SCRIPT

          echo "=== Step 2: Ingest corpus into OGX vector store ==="
          python3 platform/scripts/ingest-corpus.py

          echo "=== Ingest complete ==="
        env:
        - name: OGX_SERVICE_URL
          value: "http://rfp-ogx-service.rfp-agent.svc.cluster.local:8321"
        - name: MINIO_ENDPOINT
          value: "http://minio.minio.svc.cluster.local:9000"
        - name: MINIO_ACCESS_KEY
          value: "minioadmin"
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: dspa-minio-creds
              key: root-password
        - name: MINIO_BUCKET
          value: "rfp-agent-knowledge"
        - name: CORPUS_DIR
          value: "/workspace/repo/agents/rfp-agent/corpus"
        - name: VECTOR_STORE_NAME
          value: "rfp_knowledge_v1"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      volumes:
      - name: workspace
        emptyDir: {}
