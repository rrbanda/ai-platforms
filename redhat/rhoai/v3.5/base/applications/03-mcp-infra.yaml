apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-mcp-infra
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: rhoai-platform
  source:
    repoURL: https://github.com/rrbanda/ai-platforms.git
    targetRevision: main
    path: redhat/rhoai/v3.5/base/04-mcp-infra
  destination:
    server: https://kubernetes.default.svc
    namespace: ocp-mcp-server
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
