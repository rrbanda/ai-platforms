apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ocp-virt-agent-eval
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ocp-virt-migration-agent
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: rhoai-workloads
  source:
    repoURL: https://github.com/rrbanda/ai-platforms.git
    targetRevision: main
    path: redhat/rhoai/v3.5/base/03-workloads/agents/ocp-virt-agent/eval
  destination:
    server: https://kubernetes.default.svc
    namespace: ocp-virt-agent-eval
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
