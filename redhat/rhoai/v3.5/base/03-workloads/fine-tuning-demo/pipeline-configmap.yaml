    n        eval_config = {\\n            \\\"name\\\": evalhub_job_name,\\n\\\n          \\            \\\"model\\\": model_spec,\\n        }\\n        if mlflow_experiment_name.strip():\\n\\\n          \\            eval_config[\\\"experiment\\\"] = {\\\"name\\\": mlflow_experiment_name.strip()}\\n\\\n          \\            logger.info(f\\\"MLflow enabled (experiment: {mlflow_experiment_name.strip()})\\\"\\\n          )\\n        else:\\n            logger.info(\\\"MLflow disabled (no mlflow_experiment_name\\\n          \\ provided)\\\")\\n\\n        cleaned_collection = collection_id.strip().strip('\\\"\\\n          ').strip(\\\"'\\\") if collection_id else \\\"\\\"\\n        if cleaned_collection:\\n\\\n          \\            eval_config[\\\"collection\\\"] = {\\\"id\\\": cleaned_collection}\\n\\\n          \\        elif benchmarks:\\n            parsed = benchmarks if isinstance(benchmarks,\\\n          \\ list) else json.loads(benchmarks)\\n            eval_config[\\\"benchmarks\\\
    \"\\\n          ] = parsed\\n        else:\\n            raise ValueError(\\\"Provide either\\\n          \\ 'benchmarks' list or 'collection_id'.\\\")\\n\\n        submit_url = f\\\"{evalhub_url.rstrip('/')}/api/v1/evaluations/jobs\\\"\\\n          \\n        logger.info(f\\\"Submitting evaluation job to {submit_url}\\\")\\n\\\n          \\        logger.info(f\\\"Config: {json.dumps(eval_config, indent=2)}\\\")\\n\\\n          \\n        resp = requests.post(submit_url, json=eval_config, headers=headers,\\\n          \\ timeout=30, verify=verify_tls)\\n        if resp.status_code not in (200,\\\n          \\ 201, 202):\\n            raise RuntimeError(f\\\"Eval Hub returned {resp.status_code}:\\\n          \\ {resp.text}\\\")\\n\\n        job = resp.json()\\n        job_id = job[\\\"resource\\\"\\\n          ][\\\"id\\\"]\\n        logger.info(f\\\"Evaluation job created: {job_id}\\\")\\n\\n\\\n          \\        # =====================================================================\\\
