apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-gateway-secret-reader
  namespace: ocp-mcp-server
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-gateway-secret-reader
  namespace: ocp-mcp-server
subjects:
  - kind: ServiceAccount
    name: mcp-controller
    namespace: openshift-operators
roleRef:
  kind: Role
  name: mcp-gateway-secret-reader
  apiGroup: rbac.authorization.k8s.io
