apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-mcp-auth
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: rhoai-platform
  source:
    repoURL: https://github.com/rrbanda/ai-platforms.git
    targetRevision: main
    path: redhat/rhoai/v3.5/overlays/sandbox1388/mcp-auth
  destination:
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: operator.authorino.kuadrant.io
      kind: Authorino
      jsonPointers:
        - /status
        - /spec/healthz
        - /spec/metrics
        - /spec/tracing
        - /spec/volumes
        - /spec/listener/ports
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
