# MCP Server v0.3 Helm values (base -- no spoke kubeconfig)
# Override via per-cluster overlay for multicluster spoke access.
openshift: true
ingress:
  enabled: false

serviceAccount:
  create: false
  name: mcp-viewer

config:
  read_only: true
  toolsets:
    - core
    - config
    - helm
    - prometheus
    - netedge
  denied_resources:
    - group: ""
      version: v1
      kind: Secret
    - group: ""
      version: v1
      kind: ConfigMap
    - group: rbac.authorization.k8s.io
      version: v1
      kind: Role
    - group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
    - group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding

extraVolumes: []
extraVolumeMounts: []
