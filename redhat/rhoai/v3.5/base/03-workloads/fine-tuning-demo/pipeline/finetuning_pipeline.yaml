              \ technique modules for technique-specific parameter docs.\n    \"\"\
              \"\n    import os\n    from typing import Dict\n\n    from data import\
              \ download_oci_model, prepare_jsonl, resolve_dataset\n    from output\
              \ import persist_model, plot_training_loss\n    from setup import configure_env,\
              \ create_logger, init_k8s, parse_kv, setup_hf_token\n    from techniques\
              \ import get_technique_module\n    from training import compute_nproc,\
              \ select_runtime, wait_for_training_job\n\n    log = create_logger(\"\
              unified_train_model\")\n    technique = technique.strip().lower()\n\
              \    log.info(f\"Technique: {technique} | Model: {training_base_model}\
              \ | PVC: {pvc_path}\")\n\n    tech = get_technique_module(technique)\n\
              \n    # =====================================================================\n\
              \    # Phase A: Environment and dataset setup\n    # =====================================================================\n\
              \    _api = init_k8s(log)\n\n    cache = os.path.join(pvc_path, \".cache\"\
              , \"huggingface\")\n    default_env: Dict[str, str] = {\n        \"\
              XDG_CACHE_HOME\": \"/tmp\",\n        \"TRITON_CACHE_DIR\": \"/tmp/.triton\"\
              ,\n        \"HF_HOME\": \"/tmp/.cache/huggingface\",\n        \"HF_DATASETS_CACHE\"\
              : os.path.join(cache, \"datasets\"),\n        \"TRANSFORMERS_CACHE\"\
              : os.path.join(cache, \"transformers\"),\n        \"NCCL_DEBUG\": \"\
              INFO\",\n        \"PYTHONUNBUFFERED\": \"1\",\n    }\n\n    merged_env\
              \ = configure_env(training_envs, default_env, log)\n    setup_hf_token(merged_env,\
              \ training_base_model, log)\n\n    ds_dir = os.path.join(pvc_path, \"\
              dataset\", \"train\")\n    os.makedirs(ds_dir, exist_ok=True)\n    resolve_dataset(dataset,\
              \ ds_dir, log)\n\n    jsonl = os.path.join(ds_dir, \"train.jsonl\")\n\
              \    prepare_jsonl(ds_dir, jsonl, log)\n\n    resolved = training_base_model\n\
              \    if isinstance(training_base_model, str) and training_base_model.startswith(\"\
              oci://\"):\n        resolved = download_oci_model(training_base_model,\
              \ pvc_path, log)\n\n    ckpt_dir = os.path.join(pvc_path, \"checkpoints\"\
              )\n    os.makedirs(ckpt_dir, exist_ok=True)\n    data_path = jsonl if\
              \ os.path.exists(jsonl) else ds_dir\n\n    # =====================================================================\n\
              \    # Phase B: Build common + technique-specific params\n    # =====================================================================\n\
              \    np_val, nn_val = compute_nproc(\n        training_resource_gpu_per_worker,\n\
              \        training_resource_num_procs_per_worker,\n        num_workers=training_resource_num_workers,\n\
              \        single_node=tech.IS_SINGLE_NODE,\n    )\n\n    params: Dict\
              \ = {\n        \"model_path\": resolved,\n        \"data_path\": data_path,\n\
              \        \"effective_batch_size\": int(training_effective_batch_size\
              \ or 128),\n        \"max_tokens_per_gpu\": int(training_max_tokens_per_gpu),\n\
              \        \"max_seq_len\": int(training_max_seq_len or 8192),\n     \
              \   \"learning_rate\": float(training_learning_rate or tech.DEFAULT_LR),\n\
              \        \"ckpt_output_dir\": ckpt_dir,\n        \"data_output_dir\"\
              : training_data_output_dir or os.path.join(ckpt_dir, \"_internal_data_processing\"\
              ),\n        \"warmup_steps\": int(training_lr_warmup_steps) if training_lr_warmup_steps\
              \ is not None else 10,\n        \"checkpoint_at_epoch\": bool(training_checkpoint_at_epoch)\
              \ if training_checkpoint_at_epoch is not None else False,\n        \"\
              num_epochs\": int(training_num_epochs) if training_num_epochs else tech.DEFAULT_EPOCHS,\n\
              \        \"nproc_per_node\": np_val,\n        \"nnodes\": nn_val,\n\
              \    }\n\n    if training_lr_scheduler:\n        params[\"lr_scheduler\"\
              ] = training_lr_scheduler\n    if training_use_liger is not None:\n\
              \        params[\"use_liger\"] = bool(training_use_liger)\n    if training_seed\
              \ is not None:\n        params[\"seed\"] = int(training_seed)\n    for\
              \ field, key in [\n        (training_dataset_type, \"dataset_type\"\
              ),\n        (training_field_messages, \"field_messages\"),\n       \
              \ (training_field_instruction, \"field_instruction\"),\n        (training_field_input,\
              \ \"field_input\"),\n        (training_field_output, \"field_output\"\
              ),\n    ]:\n        if field:\n            params[key] = field\n\n \
              \   tech.build_params(params, **{k: v for k, v in locals().items() if\
              \ k.startswith((\"lora_\", \"sft_\", \"osft_\"))})\n    log.info(f\"\
              Training params ({technique}): {sorted(params.keys())}\")\n\n    # =====================================================================\n\
              \    # Phase C: Submit TrainJob\n    # =====================================================================\n\
              \    from kubeflow.common.types import KubernetesBackendConfig\n   \
              \ from kubeflow.trainer import TrainerClient\n    from kubeflow.trainer.options.kubernetes\
              \ import (\n        ContainerOverride,\n        PodSpecOverride,\n \
              \       PodTemplateOverride,\n        PodTemplateOverrides,\n    )\n\
              \    from kubeflow.trainer.rhai import TrainingHubAlgorithms, TrainingHubTrainer\n\
              \n    if _api is None:\n        raise RuntimeError(\"K8s API not initialized\"\
              )\n\n    client = TrainerClient(KubernetesBackendConfig(client_configuration=_api.configuration))\n\
              \    runtime = select_runtime(client, log, runtime_name=training_runtime)\n\
              \    algorithm = getattr(TrainingHubAlgorithms, tech.ALGORITHM_NAME)\n\
              \n    vols, vmts = [], []\n    if kubernetes_config and getattr(kubernetes_config,\
              \ \"volumes\", None):\n        vols.extend(kubernetes_config.volumes)\n\
              \    if kubernetes_config and getattr(kubernetes_config, \"volume_mounts\"\
              , None):\n        vmts.extend(kubernetes_config.volume_mounts)\n\n \
              \   # Check if workspace PVC is already mounted via kubernetes_config\
              \ passthrough.\n    # If not, discover it from own pod spec and add\
              \ it.\n    has_workspace = any(\"workspace\" in str(v) for v in vols)\n\
              \    if not has_workspace:\n        try:\n            from kubernetes\
              \ import client as k8s_client\n            v1 = k8s_client.CoreV1Api(_api)\n\
              \            my_pod_name = os.environ.get(\"HOSTNAME\", \"\")\n    \
              \        my_namespace = open(\"/var/run/secrets/kubernetes.io/serviceaccount/namespace\"\
              ).read().strip()\n            if my_pod_name and my_namespace:\n   \
              \             pod = v1.read_namespaced_pod(my_pod_name, my_namespace)\n\
              \                for vol in pod.spec.volumes or []:\n              \
              \      if vol.persistent_volume_claim and \"workspace\" in (vol.persistent_volume_claim.claim_name\
              \ or \"\"):\n                        workspace_pvc = vol.persistent_volume_claim.claim_name\n\
              \                        workspace_mount = None\n                  \
              \      for container in pod.spec.containers or []:\n               \
              \             for vm in container.volume_mounts or []:\n           \
              \                     if vm.name == vol.name:\n                    \
              \                workspace_mount = vm.mount_path\n                 \
              \                   break\n                        if workspace_pvc\
              \ and workspace_mount:\n                            log.info(f\"Adding\
              \ workspace PVC: {workspace_pvc} at {workspace_mount}\")\n         \
              \                   vols.append({\"name\": \"workspace\", \"persistentVolumeClaim\"\
              : {\"claimName\": workspace_pvc}})\n                            vmts.append({\"\
              name\": \"workspace\", \"mountPath\": workspace_mount})\n          \
              \              break\n        except Exception as e:\n            log.warning(f\"\
              Could not discover workspace PVC: {e}\")\n    else:\n        log.info(\"\
              Workspace PVC already in kubernetes_config passthrough\")\n\n    resources\
              \ = {\n        \"nvidia.com/gpu\": training_resource_gpu_per_worker,\n\
              \        \"memory\": training_resource_memory_per_worker,\n        \"\
              cpu\": int(training_resource_cpu_per_worker),\n    }\n\n    job = client.train(\n\
              \        trainer=TrainingHubTrainer(\n            func=tech.train_func,\n\
              \            func_args=params,\n            algorithm=algorithm,\n \
              \           packages_to_install=[],\n            env=dict(merged_env),\n\
              \            resources_per_node=resources,\n        ),\n        options=[\n\
              \            PodTemplateOverrides(\n                PodTemplateOverride(\n\
              \                    target_jobs=[\"node\"],\n                    metadata=(\n\
              \                        {\"labels\": parse_kv(training_metadata_labels),\
              \ \"annotations\": parse_kv(training_metadata_annotations)}\n      \
              \                  if (training_metadata_labels or training_metadata_annotations)\n\
              \                        else None\n                    ),\n       \
              \             spec=PodSpecOverride(\n                        volumes=vols,\n\
              \                        containers=[ContainerOverride(name=\"node\"\
              , volume_mounts=vmts)],\n                        tolerations=[{\"key\"\
              : \"nvidia.com/gpu\", \"operator\": \"Exists\", \"effect\": \"NoSchedule\"\
              }],\n                        node_selector={\"nvidia.com/gpu.present\"\
              : \"true\"},\n                    ),\n                )\n          \
              \  )\n        ],\n        runtime=runtime,\n    )\n    log.info(f\"\
              Job submitted: {job}\")\n    wait_for_training_job(client, job, log)\n\
              \n    # =====================================================================\n\
              \    # Phase D: Metrics and model persistence\n    # =====================================================================\n\
              \    output_metrics.log_metric(\"technique\", technique)\n    output_metrics.log_metric(\"\
              num_epochs\", float(params.get(\"num_epochs\", 1)))\n    output_metrics.log_metric(\"\
              effective_batch_size\", float(params.get(\"effective_batch_size\", 128)))\n\
              \    output_metrics.log_metric(\"learning_rate\", float(params.get(\"\
              learning_rate\", 2e-4)))\n    output_metrics.log_metric(\"max_seq_len\"\
              , float(params.get(\"max_seq_len\", 8192)))\n    output_metrics.log_metric(\"\
              num_workers\", float(nn_val))\n    output_metrics.log_metric(\"gpu_per_worker\"\
              , float(training_resource_gpu_per_worker))\n\n    tech.log_metrics(output_metrics,\
              \ params)\n\n    metrics_files = getattr(tech, \"METRICS_FILES\", [])\n\
              \    loss = []\n    for mf in metrics_files:\n        mf_path = os.path.join(ckpt_dir,\
              \ mf)\n        if os.path.exists(mf_path):\n            from output\
              \ import extract_metrics_from_jsonl\n            tm, loss = extract_metrics_from_jsonl(mf_path)\n\
              \            for k, v in tm.items():\n                output_metrics.log_metric(f\"\
              training_{k}\", v)\n            break\n\n    plot_training_loss(loss,\
              \ output_loss_chart.path)\n    persist_model(ckpt_dir, pvc_path, training_base_model,\
              \ output_model, log)\n\n    return f\"{technique} training completed\"\
              \n\n"
