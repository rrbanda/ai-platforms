# AuthPolicy for MCP Gateway: dual authentication (on-cluster SA + external Keycloak JWT).
# Either method succeeds → request is authenticated.
# On-cluster agents: use kubernetesTokenReview with SA tokens
# External agents (GKE/EKS): use Keycloak JWT via client_credentials grant
# Authorization: kubernetesSubjectAccessReview for SA tokens (Keycloak JWT skips RBAC)
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: mcp-auth-policy
  namespace: mcp-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: mcp-gateway
    sectionName: mcp
  defaults:
    rules:
      authentication:
        "kubernetes-token":
          kubernetesTokenReview:
            audiences:
              - "https://kubernetes.default.svc"
        "keycloak-jwt":
          jwt:
            issuerUrl: REPLACE_WITH_KEYCLOAK_ISSUER_URL
      response:
        unauthenticated:
          code: 401
          body:
            value: |
              {"error":"Unauthorized","message":"Authentication required. Provide a valid SA token or Keycloak JWT."}
        unauthorized:
          code: 403
          body:
            value: |
              {"error":"Forbidden","message":"You do not have permission to use MCP tools. Contact your cluster administrator."}
