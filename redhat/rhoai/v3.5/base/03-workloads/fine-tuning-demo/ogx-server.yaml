apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: fine-tuning-ogx
  namespace: fine-tuning-demo
  labels:
    opendatahub.io/dashboard: "true"
    app: ogx
spec:
  distribution:
    name: rh
  overrideConfig:
    key: config.yaml
    name: fine-tuning-ogx-config
  workload:
    overrides:
      env:
        - name: VLLM_SQL_FINETUNED_URL
          value: "https://qwen25-sql-finetuned-kserve-workload-svc.fine-tuning-demo.svc.cluster.local:8000/v1"
        - name: VLLM_BASE_URL
          value: "https://qwen25-base-kserve-workload-svc.fine-tuning-demo.svc.cluster.local:8000/v1"
        - name: OMP_NUM_THREADS
          value: "4"
        - name: MKL_NUM_THREADS
          value: "4"
    replicas: 1
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi
    storage:
      mountPath: /opt/app-root/src/.ogx
      size: 5Gi
