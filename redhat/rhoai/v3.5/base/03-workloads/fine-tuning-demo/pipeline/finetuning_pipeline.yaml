              \n        if hf_token:\n            load_kwargs[\"token\"] = hf_token\n\
              \n        try:\n            dataset = load_dataset(**load_kwargs)\n\
              \            log_message(f\"Downloaded {len(dataset)} examples from\
              \ HuggingFace (split: train)\")\n            return dataset\n\n    \
              \    except ValueError as e:\n            # If \"train\" split doesn't\
              \ exist, try to find an alternative\n            if \"Unknown split\"\
              \ in str(e):\n                log_message(\"'train' split not found,\
              \ attempting to detect available splits...\")\n\n                # Load\
              \ dataset info without specifying split\n                try:\n    \
              \                load_kwargs_no_split = {\"path\": ds_id}\n        \
              \            if ds_config:\n                        load_kwargs_no_split[\"\
              name\"] = ds_config\n                    if hf_token:\n            \
              \            load_kwargs_no_split[\"token\"] = hf_token\n\n        \
              \            # Load all splits\n                    dataset_dict = load_dataset(**load_kwargs_no_split)\n\
              \n                    # Try common training split names in order of\
              \ preference\n                    preferred_splits = [\"train_sft\"\
              , \"train_gen\", \"train\", \"training\"]\n\n                    for\
              \ split_name in preferred_splits:\n                        if split_name\
              \ in dataset_dict:\n                            log_message(f\"Using\
              \ split: {split_name}\")\n                            dataset = dataset_dict[split_name]\n\
              \                            log_message(f\"Downloaded {len(dataset)}\
              \ examples from HuggingFace (split: {split_name})\")\n             \
              \               return dataset\n\n                    # If none of the\
              \ preferred splits found, use the first available split\n          \
              \          available_splits = list(dataset_dict.keys())\n          \
              \          if available_splits:\n                        first_split\
              \ = available_splits[0]\n                        log_message(f\"Using\
              \ first available split: {first_split}\")\n                        dataset\
              \ = dataset_dict[first_split]\n                        log_message(f\"\
              Downloaded {len(dataset)} examples from HuggingFace (split: {first_split})\"\
              )\n                        return dataset\n                    else:\n\
              \                        raise ValueError(\"No splits found in dataset\"\
              )\n\n                except Exception as inner_e:\n                \
              \    log_message(f\"Error detecting splits: {str(inner_e)}\")\n    \
              \                raise\n            else:\n                log_message(f\"\
              Error loading dataset: {str(e)}\")\n                raise\n        except\
              \ Exception as e:\n            log_message(f\"Error loading dataset:\
              \ {str(e)}\")\n            raise\n\n    def download_from_s3(s3_path:\
              \ str) -> Dataset:\n        \"\"\"Download dataset from AWS S3 using\
              \ datasets library native S3 support.\"\"\"\n        log_message(f\"\
              Loading from AWS S3: s3://{s3_path}\")\n\n        # Get credentials\
              \ from Kubernetes secret (environment variables)\n        access_key\
              \ = (os.environ.get(\"AWS_ACCESS_KEY_ID\") or \"\").strip()\n      \
              \  secret_key = (os.environ.get(\"AWS_SECRET_ACCESS_KEY\") or \"\").strip()\n\
              \n        # Validate that credentials are present and consistent\n \
              \       if (access_key and not secret_key) or (secret_key and not access_key):\n\
              \            raise ValueError(\n                \"S3 credentials misconfigured:\
              \ AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must either \"\n     \
              \           \"both be set and non-empty, or both be unset. Check the\
              \ 's3-secret' Kubernetes secret.\"\n            )\n        if not access_key\
              \ and not secret_key:\n            raise ValueError(\n             \
              \   \"S3 credentials missing: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY\
              \ must be provided via \"\n                \"the 's3-secret' Kubernetes\
              \ secret when using s3:// dataset URIs.\"\n            )\n\n       \
              \ # Build storage_options for datasets library\n        storage_options\
              \ = {}\n\n        # Add credentials if available (otherwise uses default\
              \ AWS credential chain)\n        if access_key and secret_key:\n   \
              \         storage_options[\"key\"] = access_key\n            storage_options[\"\
              secret\"] = secret_key\n            log_message(\"Using S3 credentials\
              \ from Kubernetes secret\")\n        else:\n            log_message(\"\
              No credentials found, using default AWS credential chain (IAM role,\
              \ etc.)\")\n\n        # Load dataset directly from S3 (no temp file\
