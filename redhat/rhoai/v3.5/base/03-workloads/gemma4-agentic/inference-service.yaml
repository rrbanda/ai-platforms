apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: gemma4-12b-agentic
  namespace: gemma4-agentic
  annotations:
    modelFormat: vLLM
    opendatahub.io/model-type: generative
    openshift.io/display-name: "Gemma 4 12B Agentic (FP8)"
    openshift.io/description: >-
      Gemma 4 12B IT with tool-calling enabled for agentic workloads.
      RedHatAI FP8 dynamic quantized variant.
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: RawDeployment
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
spec:
  predictor:
    maxReplicas: 1
    minReplicas: 1
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-gemma4-agentic
      storageUri: hf://RedHatAI/gemma-4-12B-it-FP8-Dynamic
      args:
        - --dtype=auto
        - --max-model-len=4096
        - --gpu-memory-utilization=0.92
        - --enforce-eager
      resources:
        limits:
          cpu: "4"
          memory: 24Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "2"
          memory: 12Gi
          nvidia.com/gpu: "1"
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A10G
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
