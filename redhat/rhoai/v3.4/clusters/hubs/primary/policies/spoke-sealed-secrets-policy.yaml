apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: spoke-install-sealed-secrets
  namespace: openshift-gitops
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SC System and Communications Protection
    policy.open-cluster-management.io/controls: SC-12 Cryptographic Key Establishment
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: sealed-secrets-namespace
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: sealed-secrets
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: sealed-secrets-operator-group
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: sealed-secrets
                  namespace: sealed-secrets
                spec:
                  targetNamespaces:
                    - sealed-secrets
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: sealed-secrets-subscription
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: sealed-secrets-operator-helm
                  namespace: sealed-secrets
                spec:
                  channel: stable
                  installPlanApproval: Automatic
                  name: sealed-secrets-operator-helm
                  source: certified-operators
                  sourceNamespace: openshift-marketplace
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: spoke-install-sealed-secrets-binding
  namespace: openshift-gitops
placementRef:
  name: all-rhoai-spokes
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: spoke-install-sealed-secrets
    apiGroup: policy.open-cluster-management.io
    kind: Policy
