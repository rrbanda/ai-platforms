        root:
          dag:
            tasks:
              data-quality-filter:
                cachingOptions: {}
                componentRef:
                  name: comp-data-quality-filter
                dependentTasks:
                - dataset-download
                inputs:
                  artifacts:
                    input_dataset:
                      taskOutputArtifact:
                        outputArtifactKey: train_dataset
                        producerTask: dataset-download
                  parameters:
                    enable_llm_judge:
                      componentInputParameter: enable_llm_judge
                    export_to_pvc:
                      runtimeValue:
                        constant: true
                    llm_judge_endpoint:
                      componentInputParameter: llm_judge_endpoint
                    min_assistant_tokens:
                      runtimeValue:
                        constant: 5.0
                    min_user_tokens:
                      runtimeValue:
                        constant: 3.0
                    pvc_mount_path:
                      runtimeValue:
                        constant: '{{$.workspace_path}}'
                    shared_log_file:
                      runtimeValue:
                        constant: pipeline_log.txt
                    similarity_threshold:
                      componentInputParameter: similarity_threshold
                taskInfo:
                  name: data-quality-filter
              dataset-download:
                cachingOptions: {}
                componentRef:
                  name: comp-dataset-download
                inputs:
                  parameters:
                    dataset_uri:
                      componentInputParameter: dataset_uri
                    pvc_mount_path:
                      runtimeValue:
                        constant: '{{$.workspace_path}}'
                    shared_log_file:
                      runtimeValue:
                        constant: pipeline_log.txt
                    subset_count:
                      componentInputParameter: dataset_subset
                    train_split_ratio:
                      componentInputParameter: train_split_ratio
                taskInfo:
                  name: dataset-download
              evalhub-evaluator-kserve:
                cachingOptions: {}
                componentRef:
                  name: comp-evalhub-evaluator-kserve
                dependentTasks:
                - train-model
                inputs:
                  artifacts:
                    model_artifact:
                      taskOutputArtifact:
                        outputArtifactKey: output_model
                        producerTask: train-model
                  parameters:
                    base_model_name:
                      componentInputParameter: base_model
                    benchmarks:
                      componentInputParameter: evalhub_benchmarks
                    collection_id:
                      componentInputParameter: evalhub_collection
                    cpu:
                      componentInputParameter: eval_cpu
                    evalhub_job_name:
                      runtimeValue:
                        constant: finetuning-pipeline-eval
                    evalhub_model_name:
                      runtimeValue:
                        constant: finetuned-model
                    evalhub_poll_interval:
                      runtimeValue:
                        constant: 30.0
                    evalhub_timeout:
                      componentInputParameter: eval_timeout
                    evalhub_url:
                      componentInputParameter: evalhub_url
                    gpu_count:
                      componentInputParameter: eval_gpu_count
                    memory:
                      componentInputParameter: eval_memory
                    mlflow_experiment_name:
                      componentInputParameter: mlflow_experiment
                    pvc_mount_path:
                      runtimeValue:
                        constant: '{{$.workspace_path}}'
                taskInfo:
                  name: evalhub-evaluator-kserve
              holdout-llm-evaluator:
                cachingOptions: {}
                componentRef:
                  name: comp-holdout-llm-evaluator
                dependentTasks:
                - dataset-download
                - evalhub-evaluator-kserve
                - train-model
                inputs:
                  artifacts:
                    eval_dataset:
                      taskOutputArtifact:
                        outputArtifactKey: eval_dataset
                        producerTask: dataset-download
                    model_artifact:
                      taskOutputArtifact:
                        outputArtifactKey: output_model
                        producerTask: train-model
                  parameters:
                    batch_size:
                      componentInputParameter: holdout_eval_batch_size
                    enforce_eager:
                      componentInputParameter: holdout_enforce_eager
                    limit:
                      componentInputParameter: holdout_eval_limit
                    log_samples:
                      runtimeValue:
                        constant: true
                    task_names:
                      componentInputParameter: holdout_eval_tasks
                taskInfo:
                  name: holdout-llm-evaluator
              kubeflow-model-registry:
                cachingOptions: {}
                componentRef:
                  name: comp-kubeflow-model-registry
                dependentTasks:
                - evalhub-evaluator-kserve
                - holdout-llm-evaluator
                - train-model
                inputs:
                  artifacts:
                    eval_metrics:
                      taskOutputArtifact:
                        outputArtifactKey: output_metrics
                        producerTask: evalhub-evaluator-kserve
                    eval_results:
                      taskOutputArtifact:
                        outputArtifactKey: output_results
                        producerTask: evalhub-evaluator-kserve
                    input_metrics:
                      taskOutputArtifact:
                        outputArtifactKey: output_metrics
                        producerTask: train-model
                    input_model:
                      taskOutputArtifact:
                        outputArtifactKey: output_model
                        producerTask: train-model
                  parameters:
                    author:
                      componentInputParameter: registry_author
                    model_description:
                      componentInputParameter: registry_description
                    model_format_name:
                      runtimeValue:
                        constant: pytorch
                    model_format_version:
                      runtimeValue:
                        constant: '1.0'
                    model_name:
                      componentInputParameter: registry_model_name
                    model_version:
                      componentInputParameter: registry_model_version
                    pvc_mount_path:
                      runtimeValue:
                        constant: '{{$.workspace_path}}'
                    registry_address:
                      componentInputParameter: registry_address
                    registry_port:
                      componentInputParameter: registry_port
                    shared_log_file:
                      runtimeValue:
                        constant: pipeline_log.txt
                    source_namespace:
                      runtimeValue:
                        constant: ''
                    source_pipeline_name:
                      runtimeValue:
                        constant: finetuning-pipeline
                    source_pipeline_run_id:
                      runtimeValue:
                        constant: '{{$.pipeline_job_uuid}}'
                    source_pipeline_run_name:
                      runtimeValue:
                        constant: '{{$.pipeline_job_name}}'
                taskInfo:
                  name: kubeflow-model-registry
              train-model:
                cachingOptions: {}
                componentRef:
                  name: comp-train-model
                dependentTasks:
                - data-quality-filter
                inputs:
                  artifacts:
                    dataset:
                      taskOutputArtifact:
                        outputArtifactKey: output_dataset
                        producerTask: data-quality-filter
                  parameters:
                    lora_alpha:
                      componentInputParameter: lora_alpha
                    lora_bf16:
                      componentInputParameter: lora_bf16
                    lora_dropout:
                      componentInputParameter: lora_dropout
                    lora_flash_attention:
                      componentInputParameter: lora_flash_attention
                    lora_gradient_accumulation_steps:
                      componentInputParameter: lora_grad_accum_steps
                    lora_load_in_4bit:
                      componentInputParameter: lora_load_in_4bit
                    lora_load_in_8bit:
                      componentInputParameter: lora_load_in_8bit
                    lora_micro_batch_size:
                      componentInputParameter: lora_micro_batch_size
                    lora_r:
                      componentInputParameter: lora_r
                    lora_sample_packing:
                      componentInputParameter: lora_sample_packing
                    lora_target_modules:
                      componentInputParameter: lora_target_modules
                    osft_fsdp_sharding_strategy:
                      componentInputParameter: osft_fsdp_sharding
                    osft_lr_scheduler_kwargs:
                      componentInputParameter: osft_lr_scheduler_kwargs
                    osft_memory_efficient_init:
                      componentInputParameter: osft_memory_efficient_init
                    osft_save_final_checkpoint:
                      componentInputParameter: osft_save_final_checkpoint
                    osft_target_patterns:
                      componentInputParameter: osft_target_patterns
                    osft_unfreeze_rank_ratio:
                      componentInputParameter: osft_unfreeze_ratio
                    osft_unmask_messages:
                      componentInputParameter: osft_unmask_messages
                    osft_use_processed_dataset:
                      componentInputParameter: osft_use_processed_dataset
                    pvc_path:
                      runtimeValue:
                        constant: '{{$.workspace_path}}'
                    sft_accelerate_full_state_at_epoch:
                      componentInputParameter: sft_accelerate_full_state_at_epoch
                    sft_fsdp_sharding_strategy:
                      componentInputParameter: sft_fsdp_sharding
                    sft_save_samples:
                      componentInputParameter: sft_save_samples
                    technique:
                      componentInputParameter: technique
                    training_base_model:
                      componentInputParameter: base_model
                    training_effective_batch_size:
                      componentInputParameter: effective_batch_size
                    training_envs:
                      componentInputParameter: env_vars
                    training_learning_rate:
                      componentInputParameter: learning_rate
                    training_lr_scheduler:
                      componentInputParameter: lr_scheduler
                    training_max_seq_len:
                      componentInputParameter: max_seq_len
                    training_max_tokens_per_gpu:
                      componentInputParameter: max_tokens_per_gpu
                    training_metadata_annotations:
                      componentInputParameter: annotations
                    training_metadata_labels:
                      componentInputParameter: labels
                    training_num_epochs:
                      componentInputParameter: epochs
                    training_resource_cpu_per_worker:
                      componentInputParameter: cpu_per_worker
                    training_resource_gpu_per_worker:
                      componentInputParameter: gpu_per_worker
                    training_resource_memory_per_worker:
                      componentInputParameter: memory_per_worker
                    training_resource_num_workers:
                      componentInputParameter: num_workers
                    training_runtime:
                      componentInputParameter: training_runtime
                    training_seed:
                      componentInputParameter: seed
                    training_use_liger:
                      componentInputParameter: use_liger
                taskInfo:
                  name: train-model
          inputDefinitions:
            parameters:
              annotations:
                defaultValue: ''
                isOptional: true
                parameterType: STRING
              base_model:
                defaultValue: Qwen/Qwen2.5-1.5B-Instruct
                isOptional: true
                parameterType: STRING
              cpu_per_worker:
                defaultValue: '4'
                isOptional: true
                parameterType: STRING
              dataset_subset:
                defaultValue: 5000.0
                isOptional: true
                parameterType: NUMBER_INTEGER
              dataset_uri:
                defaultValue: hf://b-mc2/sql-create-context
                isOptional: true
                parameterType: STRING
              effective_batch_size:
                defaultValue: 128.0
                isOptional: true
                parameterType: NUMBER_INTEGER
              enable_llm_judge:
                defaultValue: false
                isOptional: true
                parameterType: BOOLEAN
              env_vars:
                defaultValue: ''
                isOptional: true
                parameterType: STRING
              epochs:
                defaultValue: 2.0
                isOptional: true
                parameterType: NUMBER_INTEGER
              eval_cpu:
                defaultValue: '2'
                isOptional: true
                parameterType: STRING
              eval_gpu_count:
                defaultValue: 1.0
                isOptional: true
                parameterType: NUMBER_INTEGER
              eval_memory:
                defaultValue: 32Gi
                isOptional: true
                parameterType: STRING
              eval_timeout:
                defaultValue: 7200.0
                isOptional: true
                parameterType: NUMBER_INTEGER
              evalhub_benchmarks:
                defaultValue:
                - id: leaderboard_ifeval
                  provider_id: lm_evaluation_harness
                - id: leaderboard_bbh
                  provider_id: lm_evaluation_harness
                - id: leaderboard_mmlu_pro
                  provider_id: lm_evaluation_harness
                - id: leaderboard_musr
                  provider_id: lm_evaluation_harness
                - id: leaderboard_math_hard
                  provider_id: lm_evaluation_harness
                - id: truthfulqa_mc1
                  provider_id: lm_evaluation_harness
                - id: toxigen
                  provider_id: lm_evaluation_harness
                - id: ethics_cm
                  provider_id: lm_evaluation_harness
                isOptional: true
                parameterType: LIST
              evalhub_collection:
                defaultValue: ''
                isOptional: true
                parameterType: STRING
              evalhub_url:
                defaultValue: https://evalhub.redhat-ods-applications.svc.cluster.local:8443
                isOptional: true
                parameterType: STRING
              gpu_per_worker:
                defaultValue: 1.0
                isOptional: true
                parameterType: NUMBER_INTEGER
              holdout_enforce_eager:
                defaultValue: true
                isOptional: true
                parameterType: BOOLEAN
              holdout_eval_batch_size:
                defaultValue: auto
                isOptional: true
                parameterType: STRING
              holdout_eval_limit:
                defaultValue: 100.0
                isOptional: true
                parameterType: NUMBER_INTEGER
              holdout_eval_tasks:
                defaultValue:
                - arc_easy
                isOptional: true
                parameterType: LIST
              labels:
                defaultValue: ''
                isOptional: true
                parameterType: STRING
              learning_rate:
                defaultValue: 0.0002
                isOptional: true
                parameterType: NUMBER_DOUBLE
              llm_judge_endpoint:
                defaultValue: ''
                isOptional: true
                parameterType: STRING
              lora_alpha:
                defaultValue: 32.0
                isOptional: true
                parameterType: NUMBER_INTEGER
              lora_bf16:
                defaultValue: true
                isOptional: true
                parameterType: BOOLEAN
              lora_dropout:
                defaultValue: 0.0
                isOptional: true
                parameterType: NUMBER_DOUBLE
              lora_flash_attention:
