# CatalogSource — mirrored Red Hat operator index image.
#
# Replace:
#   CATALOG_NAME_PLACEHOLDER  -> CatalogSource name (e.g. mirror-redhat-operators)
#   REGISTRY_PLACEHOLDER      -> mirror registry URL
#   REPLACE_OCP_VERSION       -> OCP version tag (e.g. v4.14)
#
# Apply with: oc apply -f catalogsource-redhat.yaml
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: CATALOG_NAME_PLACEHOLDER
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  image: REGISTRY_PLACEHOLDER/redhat/redhat-operator-index:REPLACE_OCP_VERSION
  displayName: Mirrored Red Hat Operators
  publisher: Red Hat (mirrored)
  updateStrategy:
    registryPoll:
      interval: 30m
