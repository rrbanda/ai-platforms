# PIPELINE DEFINITION
# Name: finetuning-pipeline
# Description: Fine-tuning pipeline supporting LoRA, SFT, OSFT, and custom techniques. Includes dataset preparation with train/eval split, model pre-caching, distributed training, benchmark evaluation via EvalHub with MLflow, holdout evaluation on task-specific data, and model registry with full provenance.
# Inputs:
#    annotations: str [Default: '']
#    base_model: str [Default: 'Qwen/Qwen2.5-1.5B-Instruct']
#    cpu_per_worker: str [Default: '4']
#    dataset_subset: int [Default: 5000.0]
#    dataset_uri: str [Default: 'hf://b-mc2/sql-create-context']
#    effective_batch_size: int [Default: 128.0]
#    env_vars: str [Default: '']
#    epochs: int [Default: 2.0]
#    eval_cpu: str [Default: '2']
#    eval_gpu_count: int [Default: 1.0]
#    eval_memory: str [Default: '32Gi']
#    eval_timeout: int [Default: 7200.0]
#    evalhub_benchmarks: list [Default: [{'id': 'leaderboard_ifeval', 'provider_id': 'lm_evaluation_harness'}, {'id': 'leaderboard_bbh', 'provider_id': 'lm_evaluation_harness'}, {'id': 'leaderboard_mmlu_pro', 'provider_id': 'lm_evaluation_harness'}, {'id': 'leaderboard_musr', 'provider_id': 'lm_evaluation_harness'}, {'id': 'leaderboard_math_hard', 'provider_id': 'lm_evaluation_harness'}]]
#    evalhub_collection: str [Default: '']
#    evalhub_url: str [Default: '']
#    gpu_per_worker: int [Default: 1.0]
#    holdout_eval_batch_size: str [Default: 'auto']
#    holdout_eval_limit: int [Default: 100.0]
#    holdout_eval_tasks: list [Default: ['arc_easy']]
#    labels: str [Default: '']
#    learning_rate: float [Default: 0.0002]
#    lora_alpha: int [Default: 32.0]
#    lora_bf16: bool [Default: True]
#    lora_dropout: float [Default: 0.0]
#    lora_flash_attention: bool [Default: True]
#    lora_grad_accum_steps: int [Default: 1.0]
#    lora_load_in_4bit: bool [Default: True]
#    lora_load_in_8bit: bool [Default: False]
#    lora_micro_batch_size: int [Default: 2.0]
#    lora_r: int [Default: 16.0]
#    lora_sample_packing: bool [Default: False]
#    lora_target_modules: str [Default: '']
#    lr_scheduler: str [Default: 'cosine']
#    max_seq_len: int [Default: 8192.0]
#    max_tokens_per_gpu: int [Default: 32000.0]
#    memory_per_worker: str [Default: '32Gi']
#    mlflow_experiment: str [Default: '']
#    num_workers: int [Default: 1.0]
#    osft_target_patterns: str [Default: '']
#    osft_unfreeze_ratio: float [Default: 0.1]
#    registry_address: str [Default: '']
#    registry_author: str [Default: 'pipeline']
#    registry_description: str [Default: '']
#    registry_model_name: str [Default: 'finetuned-model']
#    registry_model_version: str [Default: '1.0.0']
#    registry_port: int [Default: 8080.0]
#    seed: int [Default: 42.0]
#    sft_fsdp_sharding: str [Default: '']
#    technique: str [Default: 'lora']
#    train_split_ratio: float [Default: 0.9]
#    training_runtime: str [Default: 'training-hub']
#    use_liger: bool [Default: True]
components:
  comp-dataset-download:
    executorLabel: exec-dataset-download
    inputDefinitions:
      parameters:
        dataset_uri:
          description: Dataset URI (hf://, s3://, https://, pvc:// or absolute path)
          parameterType: STRING
        pvc_mount_path:
          description: Path where the shared PVC is mounted
          parameterType: STRING
        shared_log_file:
          defaultValue: pipeline_log.txt
          description: Name of the shared log file
          isOptional: true
          parameterType: STRING
        subset_count:
          defaultValue: 0.0
          description: Number of examples to use (0 = use all)
          isOptional: true
          parameterType: NUMBER_INTEGER
        train_split_ratio:
          defaultValue: 0.9
          description: Train/eval split (0.9 = 90%/10%, 1.0 = no split, all for training)
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        eval_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-download-base-model:
    executorLabel: exec-download-base-model
    inputDefinitions:
      parameters:
        model_name:
          description: HuggingFace model ID (e.g. 'Qwen/Qwen2.5-1.5B-Instruct').
          parameterType: STRING
        pvc_mount_path:
          description: Workspace PVC mount path.
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-evalhub-evaluator-kserve:
    executorLabel: exec-evalhub-evaluator-kserve
    inputDefinitions:
      artifacts:
        model_artifact:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
          description: Model artifact from upstream training step.
          isOptional: true
      parameters:
        base_model_name:
          defaultValue: ''
          description: HF model ID for tokenizer resolution.
          isOptional: true
          parameterType: STRING
        benchmarks:
          defaultValue: []
          description: 'List of benchmark specs [{"provider_id": "...", "id": "..."}].'
          isOptional: true
          parameterType: LIST
        collection_id:
          defaultValue: ''
          description: Eval Hub collection ID (alternative to benchmarks list).
          isOptional: true
          parameterType: STRING
        cpu:
          defaultValue: '2'
          description: CPU request/limit for the predictor (e.g. "2").
          isOptional: true
          parameterType: STRING
        evalhub_auth_token:
          defaultValue: ''
          description: Bearer token for Eval Hub auth.
          isOptional: true
          parameterType: STRING
        evalhub_job_name:
          defaultValue: pipeline-eval
          description: Evaluation job name in Eval Hub.
          isOptional: true
          parameterType: STRING
        evalhub_model_name:
          defaultValue: finetuned-model
          description: Display name for the model in Eval Hub.
          isOptional: true
          parameterType: STRING
        evalhub_poll_interval:
          defaultValue: 30.0
          description: Seconds between eval status polls.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evalhub_tenant:
          defaultValue: ''
          description: Eval Hub tenant / namespace header (X-Tenant).
          isOptional: true
          parameterType: STRING
        evalhub_timeout:
          defaultValue: 7200.0
          description: Max seconds to wait for evaluation to complete.
          isOptional: true
          parameterType: NUMBER_INTEGER
        evalhub_url:
          description: Eval Hub API endpoint (empty = skip evaluation).
          parameterType: STRING
        gpu_count:
          defaultValue: 1.0
          description: Number of GPUs for the InferenceService predictor.
          isOptional: true
          parameterType: NUMBER_INTEGER
        isvc_ready_timeout:
          defaultValue: 600.0
          description: Max seconds to wait for InferenceService readiness.
          isOptional: true
          parameterType: NUMBER_INTEGER
        memory:
          defaultValue: 8Gi
          description: Pod memory request/limit for the predictor (e.g. "8Gi", "32Gi").
          isOptional: true
          parameterType: STRING
        mlflow_experiment_name:
          defaultValue: ''
          description: MLflow experiment name (non-empty enables MLflow).
          isOptional: true
          parameterType: STRING
        model_path:
          description: Local filesystem path to model directory (if no artifact).
          isOptional: true
          parameterType: STRING
        pvc_mount_path:
          defaultValue: ''
          description: Workspace PVC mount path (triggers KFP PVC mount).
          isOptional: true
          parameterType: STRING
        runtime_image:
          defaultValue: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:ad06abf3bb5235ebb5b2df84cd1b9fd09e823f0ff2eebfc82bb4590275ccfe0b
          description: Container image for the ServingRuntime (RHOAI vLLM default).
          isOptional: true
          parameterType: STRING
        trust_remote_code:
          defaultValue: false
          description: Pass --trust-remote-code to vLLM (enables arbitrary code from
            model repos).
          isOptional: true
          parameterType: BOOLEAN
        verify_tls:
          defaultValue: false
          description: Verify TLS certificates for Eval Hub API calls (False for self-signed
            certs).
          isOptional: true
          parameterType: BOOLEAN
    outputDefinitions:
      artifacts:
        output_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        output_results:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-kubeflow-model-registry:
    executorLabel: exec-kubeflow-model-registry
    inputDefinitions:
      artifacts:
        eval_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
          description: Evaluation metrics from lm-eval.
          isOptional: true
        eval_results:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: Full evaluation results JSON artifact.
          isOptional: true
        input_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
          description: Training metrics.
          isOptional: true
        input_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
          description: Model artifact from training step.
          isOptional: true
      parameters:
        author:
          defaultValue: pipeline
          description: Author name for the model registration.
          isOptional: true
          parameterType: STRING
        model_description:
          defaultValue: ''
          description: Optional description for the model.
          isOptional: true
          parameterType: STRING
        model_format_name:
          defaultValue: pytorch
          description: Model format name (e.g. "pytorch", "onnx").
          isOptional: true
          parameterType: STRING
        model_format_version:
          defaultValue: '1.0'
