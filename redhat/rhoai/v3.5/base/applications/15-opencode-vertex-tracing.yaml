apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencode-vertex-tracing
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: rhoai-workloads
  source:
    repoURL: https://github.com/rrbanda/ai-platforms.git
    targetRevision: main
    path: redhat/rhoai/v3.5/base/03-workloads/agents/opencode-vertex-tracing
  destination:
    server: https://kubernetes.default.svc
    namespace: opencode-vertex-tracing
  ignoreDifferences:
    - group: ""
      kind: ServiceAccount
      jsonPointers:
        - /imagePullSecrets
        - /secrets
    - group: route.openshift.io
      kind: Route
      jsonPointers:
        - /spec/host
    - group: bitnami.com
      kind: SealedSecret
      jqPathExpressions:
        - .status
        - .metadata.annotations
        - .metadata.resourceVersion
        - .metadata.uid
        - .metadata.creationTimestamp
        - .metadata.generation
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
