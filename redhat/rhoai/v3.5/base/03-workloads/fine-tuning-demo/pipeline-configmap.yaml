apiVersion: v1
data:
  pipeline.yaml: "# PIPELINE DEFINITION\n# Name: finetuning-pipeline\n# Description: Fine-tuning pipeline supporting LoRA, SFT, OSFT, and custom techniques. Includes dataset preparation with train/eval split, model pre-caching, distributed training, benchmark evaluation via EvalHub with MLflow, holdout evaluation on task-specific data, and model registry with full provenance.\n# Inputs:\n#    annotations: str [Default: '']\n#    base_model: str [Default: 'Qwen/Qwen2.5-1.5B-Instruct']\n#    cpu_per_worker: str [Default: '4']\n#    dataset_subset: int [Default: 5000.0]\n#    dataset_uri: str [Default: 'hf://b-mc2/sql-create-context']\n#    effective_batch_size: int [Default: 128.0]\n#    enable_llm_judge: bool [Default: False]\n#    env_vars: str [Default: '']\n#    epochs: int [Default: 2.0]\n#    eval_cpu: str [Default: '2']\n#    eval_gpu_count: int [Default: 1.0]\n#    eval_memory: str [Default: '32Gi']\n#    eval_timeout: int [Default: 7200.0]\n#    evalhub_benchmarks: list [Default:\
    \ [{'provider_id': 'lm_evaluation_harness', 'id': 'leaderboard_ifeval'}, {'provider_id': 'lm_evaluation_harness', 'id': 'leaderboard_bbh'}, {'provider_id': 'lm_evaluation_harness', 'id': 'leaderboard_mmlu_pro'}, {'provider_id': 'lm_evaluation_harness', 'id': 'leaderboard_musr'}, {'provider_id': 'lm_evaluation_harness', 'id': 'leaderboard_math_hard'}, {'provider_id': 'lm_evaluation_harness', 'id': 'truthfulqa_mc1'}, {'provider_id': 'lm_evaluation_harness', 'id': 'toxigen'}, {'provider_id': 'lm_evaluation_harness', 'id': 'ethics_cm'}]]\n#    evalhub_collection: str [Default: '']\n#    evalhub_url: str [Default: 'https://evalhub.redhat-ods-applications.svc.cluster.local:8443']\n#    gpu_per_worker: int [Default: 1.0]\n#    holdout_eval_batch_size: str [Default: 'auto']\n#    holdout_eval_limit: int [Default: 100.0]\n#    holdout_eval_tasks: list [Default: ['arc_easy']]\n#    labels: str [Default: '']\n#    learning_rate: float [Default: 0.0002]\n#    llm_judge_endpoint: str [Default: '']\n\
    #    lora_alpha: int [Default: 32.0]\n#    lora_bf16: bool [Default: True]\n#    lora_dropout: float [Default: 0.0]\n#    lora_flash_attention: bool [Default: True]\n#    lora_grad_accum_steps: int [Default: 1.0]\n#    lora_load_in_4bit: bool [Default: True]\n#    lora_load_in_8bit: bool [Default: False]\n#    lora_micro_batch_size: int [Default: 2.0]\n#    lora_r: int [Default: 16.0]\n#    lora_sample_packing: bool [Default: False]\n#    lora_target_modules: str [Default: '']\n#    lr_scheduler: str [Default: 'cosine']\n#    max_seq_len: int [Default: 8192.0]\n#    max_tokens_per_gpu: int [Default: 32000.0]\n#    memory_per_worker: str [Default: '32Gi']\n#    mlflow_experiment: str [Default: 'finetuning-experiments']\n#    num_workers: int [Default: 1.0]\n#    osft_target_patterns: str [Default: '']\n#    osft_unfreeze_ratio: float [Default: 0.1]\n#    registry_address: str [Default: 'fine-tuning-demo.rhoai-model-registries.svc.cluster.local']\n#    registry_author: str [Default: 'pipeline']\n\
    #    registry_description: str [Default: '']\n#    registry_model_name: str [Default: 'finetuned-model']\n#    registry_model_version: str [Default: '1.0.0']\n#    registry_port: int [Default: 8443.0]\n#    seed: int [Default: 42.0]\n#    sft_fsdp_sharding: str [Default: '']\n#    similarity_threshold: float [Default: 0.85]\n#    technique: str [Default: 'lora']\n#    train_split_ratio: float [Default: 0.9]\n#    training_runtime: str [Default: 'training-hub']\n#    use_liger: bool [Default: True]\ncomponents:\n  comp-data-quality-filter:\n    executorLabel: exec-data-quality-filter\n    inputDefinitions:\n      artifacts:\n        input_dataset:\n          artifactType:\n            schemaTitle: system.Dataset\n            schemaVersion: 0.0.1\n          description: Input dataset artifact from upstream component.\n          isOptional: true\n      parameters:\n        enable_llm_judge:\n          defaultValue: false\n          description: Enable LLM-based quality scoring (requires\
    \ endpoint).\n          isOptional: true\n          parameterType: BOOLEAN\n        export_to_pvc:\n          defaultValue: true\n          description: Whether to save cleaned dataset to PVC.\n          isOptional: true\n          parameterType: BOOLEAN\n        input_pvc_path:\n          defaultValue: ''\n          description: Path to input JSONL on PVC (alternative to artifact).\n          isOptional: true\n          parameterType: STRING\n        llm_judge_endpoint:\n          defaultValue: ''\n          description: 'OpenAI-compatible API endpoint for the judge model\n\n            (e.g., http://vllm-judge.namespace.svc.cluster.local:8000/v1).'\n          isOptional: true\n          parameterType: STRING\n        max_repetition_ratio:\n          defaultValue: 0.5\n          description: Max ratio of repeated words in assistant response.\n          isOptional: true\n          parameterType: NUMBER_DOUBLE\n        min_assistant_tokens:\n          defaultValue: 5.0\n          description:\
    \ Minimum word count for assistant response.\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        min_user_tokens:\n          defaultValue: 3.0\n          description: Minimum word count for user prompt.\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        pvc_mount_path:\n          defaultValue: ''\n          description: PVC mount path for exports.\n          isOptional: true\n          parameterType: STRING\n        shared_log_file:\n          defaultValue: pipeline_log.txt\n          description: Pipeline log file name.\n          isOptional: true\n          parameterType: STRING\n        similarity_threshold:\n          defaultValue: 0.85\n          description: Fuzzy dedup threshold (0.0-1.0). Higher = stricter.\n          isOptional: true\n          parameterType: NUMBER_DOUBLE\n    outputDefinitions:\n      artifacts:\n        output_dataset:\n          artifactType:\n            schemaTitle: system.Dataset\n            schemaVersion:\
    \ 0.0.1\n        output_metrics:\n          artifactType:\n            schemaTitle: system.Metrics\n            schemaVersion: 0.0.1\n  comp-dataset-download:\n    executorLabel: exec-dataset-download\n    inputDefinitions:\n      parameters:\n        dataset_uri:\n          description: Dataset URI (hf://, s3://, https://, pvc:// or absolute path)\n          parameterType: STRING\n        pvc_mount_path:\n          description: Path where the shared PVC is mounted\n          parameterType: STRING\n        shared_log_file:\n          defaultValue: pipeline_log.txt\n          description: Name of the shared log file\n          isOptional: true\n          parameterType: STRING\n        subset_count:\n          defaultValue: 0.0\n          description: Number of examples to use (0 = use all)\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        train_split_ratio:\n          defaultValue: 0.9\n          description: Train/eval split (0.9 = 90%/10%, 1.0 = no split,\
    \ all for training)\n          isOptional: true\n          parameterType: NUMBER_DOUBLE\n    outputDefinitions:\n      artifacts:\n        eval_dataset:\n          artifactType:\n            schemaTitle: system.Dataset\n            schemaVersion: 0.0.1\n        train_dataset:\n          artifactType:\n            schemaTitle: system.Dataset\n            schemaVersion: 0.0.1\n  comp-download-base-model:\n    executorLabel: exec-download-base-model\n    inputDefinitions:\n      parameters:\n        model_name:\n          description: HuggingFace model ID (e.g. 'Qwen/Qwen2.5-1.5B-Instruct').\n          parameterType: STRING\n        pvc_mount_path:\n          description: Workspace PVC mount path.\n          parameterType: STRING\n    outputDefinitions:\n      parameters:\n        Output:\n          parameterType: STRING\n  comp-evalhub-evaluator-kserve:\n    executorLabel: exec-evalhub-evaluator-kserve\n    inputDefinitions:\n      artifacts:\n        model_artifact:\n          artifactType:\n\
    \            schemaTitle: system.Model\n            schemaVersion: 0.0.1\n          description: Model artifact from upstream training step.\n          isOptional: true\n      parameters:\n        base_model_name:\n          defaultValue: ''\n          description: HF model ID for tokenizer resolution.\n          isOptional: true\n          parameterType: STRING\n        benchmarks:\n          defaultValue: []\n          description: 'List of benchmark specs [{\"provider_id\": \"...\", \"id\": \"...\"}].'\n          isOptional: true\n          parameterType: LIST\n        collection_id:\n          defaultValue: ''\n          description: Eval Hub collection ID (alternative to benchmarks list).\n          isOptional: true\n          parameterType: STRING\n        cpu:\n          defaultValue: '2'\n          description: CPU request/limit for the predictor (e.g. \"2\").\n          isOptional: true\n          parameterType: STRING\n        evalhub_auth_token:\n          defaultValue: ''\n\
    \          description: Bearer token for Eval Hub auth.\n          isOptional: true\n          parameterType: STRING\n        evalhub_job_name:\n          defaultValue: pipeline-eval\n          description: Evaluation job name in Eval Hub.\n          isOptional: true\n          parameterType: STRING\n        evalhub_model_name:\n          defaultValue: finetuned-model\n          description: Display name for the model in Eval Hub.\n          isOptional: true\n          parameterType: STRING\n        evalhub_poll_interval:\n          defaultValue: 30.0\n          description: Seconds between eval status polls.\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        evalhub_tenant:\n          defaultValue: ''\n          description: Eval Hub tenant / namespace header (X-Tenant).\n          isOptional: true\n          parameterType: STRING\n        evalhub_timeout:\n          defaultValue: 7200.0\n          description: Max seconds to wait for evaluation to complete.\n\
    \          isOptional: true\n          parameterType: NUMBER_INTEGER\n        evalhub_url:\n          description: Eval Hub API endpoint (empty = skip evaluation).\n          parameterType: STRING\n        gpu_count:\n          defaultValue: 1.0\n          description: Number of GPUs for the InferenceService predictor.\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        isvc_ready_timeout:\n          defaultValue: 600.0\n          description: Max seconds to wait for InferenceService readiness.\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        memory:\n          defaultValue: 8Gi\n          description: Pod memory request/limit for the predictor (e.g. \"8Gi\", \"32Gi\").\n          isOptional: true\n          parameterType: STRING\n        mlflow_experiment_name:\n          defaultValue: ''\n          description: MLflow experiment name (non-empty enables MLflow).\n          isOptional: true\n          parameterType: STRING\n    \
    \    model_path:\n          description: Local filesystem path to model directory (if no artifact).\n          isOptional: true\n          parameterType: STRING\n        pvc_mount_path:\n          defaultValue: ''\n          description: Workspace PVC mount path (triggers KFP PVC mount).\n          isOptional: true\n          parameterType: STRING\n        runtime_image:\n          defaultValue: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:ad06abf3bb5235ebb5b2df84cd1b9fd09e823f0ff2eebfc82bb4590275ccfe0b\n          description: Container image for the ServingRuntime (RHOAI vLLM default).\n          isOptional: true\n          parameterType: STRING\n        trust_remote_code:\n          defaultValue: false\n          description: Pass --trust-remote-code to vLLM (enables arbitrary code from\n            model repos).\n          isOptional: true\n          parameterType: BOOLEAN\n        verify_tls:\n          defaultValue: false\n          description: Verify TLS certificates for Eval\
    \ Hub API calls (False for self-signed\n            certs).\n          isOptional: true\n          parameterType: BOOLEAN\n    outputDefinitions:\n      artifacts:\n        output_metrics:\n          artifactType:\n            schemaTitle: system.Metrics\n            schemaVersion: 0.0.1\n        output_results:\n          artifactType:\n            schemaTitle: system.Artifact\n            schemaVersion: 0.0.1\n  comp-kubeflow-model-registry:\n    executorLabel: exec-kubeflow-model-registry\n    inputDefinitions:\n      artifacts:\n        eval_metrics:\n          artifactType:\n            schemaTitle: system.Metrics\n            schemaVersion: 0.0.1\n          description: Evaluation metrics from lm-eval.\n          isOptional: true\n        eval_results:\n          artifactType:\n            schemaTitle: system.Artifact\n            schemaVersion: 0.0.1\n          description: Full evaluation results JSON artifact.\n          isOptional: true\n        input_metrics:\n          artifactType:\n\
    \            schemaTitle: system.Metrics\n            schemaVersion: 0.0.1\n          description: Training metrics.\n          isOptional: true\n        input_model:\n          artifactType:\n            schemaTitle: system.Model\n            schemaVersion: 0.0.1\n          description: Model artifact from training step.\n          isOptional: true\n      parameters:\n        author:\n          defaultValue: pipeline\n          description: Author name for the model registration.\n          isOptional: true\n          parameterType: STRING\n        model_description:\n          defaultValue: ''\n          description: Optional description for the model.\n          isOptional: true\n          parameterType: STRING\n        model_format_name:\n          defaultValue: pytorch\n          description: Model format name (e.g. \"pytorch\", \"onnx\").\n          isOptional: true\n          parameterType: STRING\n        model_format_version:\n          defaultValue: '1.0'\n          description:\
    \ Model format version.\n          isOptional: true\n          parameterType: STRING\n        model_name:\n          defaultValue: fine-tuned-model\n          description: Name for the registered model.\n          isOptional: true\n          parameterType: STRING\n        model_version:\n          defaultValue: 1.0.0\n          description: Version string for the model (e.g. \"1.0.0\").\n          isOptional: true\n          parameterType: STRING\n        pvc_mount_path:\n          description: PVC mount path for workspace storage.\n          parameterType: STRING\n        registry_address:\n          defaultValue: ''\n          description: Model Registry server address (hostname or IP).\n          isOptional: true\n          parameterType: STRING\n        registry_port:\n          defaultValue: 8080.0\n          description: 'Model Registry server port (default: 8080).'\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        shared_log_file:\n          defaultValue:\
    \ pipeline_log.txt\n          description: Filename for shared pipeline log.\n          isOptional: true\n          parameterType: STRING\n        source_namespace:\n          defaultValue: ''\n          description: Namespace where pipeline runs (auto-detected if empty).\n          isOptional: true\n          parameterType: STRING\n        source_pipeline_name:\n          defaultValue: ''\n          description: Name of the source KFP pipeline.\n          isOptional: true\n          parameterType: STRING\n        source_pipeline_run_id:\n          defaultValue: ''\n          description: Unique ID of the pipeline run.\n          isOptional: true\n          parameterType: STRING\n        source_pipeline_run_name:\n          defaultValue: ''\n          description: Display name of the pipeline run.\n          isOptional: true\n          parameterType: STRING\n    outputDefinitions:\n      parameters:\n        Output:\n          parameterType: STRING\n  comp-train-model:\n    executorLabel:\
    \ exec-train-model\n    inputDefinitions:\n      artifacts:\n        dataset:\n          artifactType:\n            schemaTitle: system.Dataset\n            schemaVersion: 0.0.1\n          isOptional: true\n      parameters:\n        kubernetes_config:\n          isOptional: true\n          parameterType: TASK_CONFIG\n        lora_alpha:\n          defaultValue: 32.0\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        lora_bf16:\n          isOptional: true\n          parameterType: BOOLEAN\n        lora_dropout:\n          defaultValue: 0.0\n          isOptional: true\n          parameterType: NUMBER_DOUBLE\n        lora_enable_model_splitting:\n          isOptional: true\n          parameterType: BOOLEAN\n        lora_flash_attention:\n          isOptional: true\n          parameterType: BOOLEAN\n        lora_fp16:\n          isOptional: true\n          parameterType: BOOLEAN\n        lora_gradient_accumulation_steps:\n          isOptional: true\n         \
    \ parameterType: NUMBER_INTEGER\n        lora_load_in_4bit:\n          defaultValue: true\n          isOptional: true\n          parameterType: BOOLEAN\n        lora_load_in_8bit:\n          isOptional: true\n          parameterType: BOOLEAN\n        lora_logging_steps:\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        lora_micro_batch_size:\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        lora_r:\n          defaultValue: 16.0\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        lora_sample_packing:\n          isOptional: true\n          parameterType: BOOLEAN\n        lora_save_steps:\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        lora_save_total_limit:\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        lora_target_modules:\n          defaultValue: ''\n          isOptional: true\n          parameterType: STRING\n        lora_tf32:\n          isOptional:\
    \ true\n          parameterType: BOOLEAN\n        lora_use_dora:\n          isOptional: true\n          parameterType: BOOLEAN\n        lora_use_rslora:\n          isOptional: true\n          parameterType: BOOLEAN\n        osft_fsdp_sharding_strategy:\n          defaultValue: ''\n          isOptional: true\n          parameterType: STRING\n        osft_lr_scheduler_kwargs:\n          defaultValue: ''\n          isOptional: true\n          parameterType: STRING\n        osft_memory_efficient_init:\n          isOptional: true\n          parameterType: BOOLEAN\n        osft_save_final_checkpoint:\n          isOptional: true\n          parameterType: BOOLEAN\n        osft_target_patterns:\n          defaultValue: ''\n          isOptional: true\n          parameterType: STRING\n        osft_unfreeze_rank_ratio:\n          isOptional: true\n          parameterType: NUMBER_DOUBLE\n        osft_unmask_messages:\n          isOptional: true\n          parameterType: BOOLEAN\n        osft_use_processed_dataset:\n\
    \          isOptional: true\n          parameterType: BOOLEAN\n        pvc_path:\n          parameterType: STRING\n        sft_accelerate_full_state_at_epoch:\n          isOptional: true\n          parameterType: BOOLEAN\n        sft_fsdp_sharding_strategy:\n          defaultValue: ''\n          isOptional: true\n          parameterType: STRING\n        sft_save_samples:\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        technique:\n          parameterType: STRING\n        training_base_model:\n          defaultValue: Qwen/Qwen2.5-1.5B-Instruct\n          isOptional: true\n          parameterType: STRING\n        training_checkpoint_at_epoch:\n          isOptional: true\n          parameterType: BOOLEAN\n        training_data_output_dir:\n          isOptional: true\n          parameterType: STRING\n        training_dataset_type:\n          isOptional: true\n          parameterType: STRING\n        training_effective_batch_size:\n          defaultValue: 128.0\n\
    \          isOptional: true\n          parameterType: NUMBER_INTEGER\n        training_envs:\n          defaultValue: ''\n          isOptional: true\n          parameterType: STRING\n        training_field_input:\n          isOptional: true\n          parameterType: STRING\n        training_field_instruction:\n          isOptional: true\n          parameterType: STRING\n        training_field_messages:\n          isOptional: true\n          parameterType: STRING\n        training_field_output:\n          isOptional: true\n          parameterType: STRING\n        training_learning_rate:\n          isOptional: true\n          parameterType: NUMBER_DOUBLE\n        training_lr_scheduler:\n          isOptional: true\n          parameterType: STRING\n        training_lr_warmup_steps:\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        training_max_seq_len:\n          defaultValue: 8192.0\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n      \
    \  training_max_tokens_per_gpu:\n          defaultValue: 32000.0\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        training_metadata_annotations:\n          defaultValue: ''\n          isOptional: true\n          parameterType: STRING\n        training_metadata_labels:\n          defaultValue: ''\n          isOptional: true\n          parameterType: STRING\n        training_num_epochs:\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        training_resource_cpu_per_worker:\n          defaultValue: '4'\n          isOptional: true\n          parameterType: STRING\n        training_resource_gpu_per_worker:\n          defaultValue: 1.0\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        training_resource_memory_per_worker:\n          defaultValue: 32Gi\n          isOptional: true\n          parameterType: STRING\n        training_resource_num_procs_per_worker:\n          defaultValue: auto\n          isOptional:\
    \ true\n          parameterType: STRING\n        training_resource_num_workers:\n          defaultValue: 1.0\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        training_runtime:\n          defaultValue: training-hub\n          isOptional: true\n          parameterType: STRING\n        training_seed:\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        training_use_liger:\n          isOptional: true\n          parameterType: BOOLEAN\n    outputDefinitions:\n      artifacts:\n        output_loss_chart:\n          artifactType:\n            schemaTitle: system.HTML\n            schemaVersion: 0.0.1\n        output_metrics:\n          artifactType:\n            schemaTitle: system.Metrics\n            schemaVersion: 0.0.1\n        output_model:\n          artifactType:\n            schemaTitle: system.Model\n            schemaVersion: 0.0.1\n      parameters:\n        Output:\n          parameterType: STRING\n    taskConfigPassthroughs:\n\
    \    - field: RESOURCES\n    - field: KUBERNETES_TOLERATIONS\n    - field: KUBERNETES_NODE_SELECTOR\n    - field: KUBERNETES_AFFINITY\n    - applyToTask: true\n      field: ENV\n    - applyToTask: true\n      field: KUBERNETES_VOLUMES\n  comp-universal-llm-evaluator:\n    executorLabel: exec-universal-llm-evaluator\n    inputDefinitions:\n      artifacts:\n        eval_dataset:\n          artifactType:\n            schemaTitle: system.Dataset\n            schemaVersion: 0.0.1\n          description: JSONL dataset in chat format for custom holdout evaluation.\n          isOptional: true\n        model_artifact:\n          artifactType:\n            schemaTitle: system.Model\n            schemaVersion: 0.0.1\n          description: KFP Model artifact from a previous pipeline step.\n          isOptional: true\n      parameters:\n        batch_size:\n          defaultValue: auto\n          description: Batch size for evaluation (\"auto\" or integer).\n          isOptional: true\n       \
    \   parameterType: STRING\n        custom_eval_max_tokens:\n          defaultValue: 256.0\n          description: 'Max tokens for generation in custom eval (default: 256).'\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        gen_kwargs:\n          defaultValue: {}\n          description: Dictionary of generation kwargs passed to the model.\n          isOptional: true\n          parameterType: STRUCT\n        limit:\n          defaultValue: -1.0\n          description: Limit number of examples per task (-1 for no limit).\n          isOptional: true\n          parameterType: NUMBER_INTEGER\n        log_samples:\n          defaultValue: true\n          description: Whether to log individual evaluation samples.\n          isOptional: true\n          parameterType: BOOLEAN\n        model_args:\n          defaultValue: {}\n          description: 'Dictionary for model initialization (e.g. {\"dtype\": \"float16\"}).'\n          isOptional: true\n          parameterType:\
    \ STRUCT\n        model_path:\n          description: String path or HF ID. Used if model_artifact is None.\n          isOptional: true\n          parameterType: STRING\n        task_names:\n          description: List of benchmark task names (e.g. [\"mmlu\", \"gsm8k\"]).\n          parameterType: LIST\n        verbosity:\n          defaultValue: INFO\n          description: Logging verbosity level (DEBUG, INFO, WARNING, ERROR).\n          isOptional: true\n          parameterType: STRING\n    outputDefinitions:\n      artifacts:\n        output_metrics:\n          artifactType:\n            schemaTitle: system.Metrics\n            schemaVersion: 0.0.1\n        output_results:\n          artifactType:\n            schemaTitle: system.Artifact\n            schemaVersion: 0.0.1\n        output_samples:\n          artifactType:\n            schemaTitle: system.Artifact\n            schemaVersion: 0.0.1\ndeploymentSpec:\n  executors:\n    exec-data-quality-filter:\n      container:\n   \
